进、智能装备等关键环节，推动这条世界最长海底高铁隧道建设向无人化、智能化方向发展。金塘海底隧道是甬舟铁路全线控制性工程，西起宁波北仑、东至舟山金塘，全长16.18公里，其中盾构段长11.21公里，采用两台超大直径盾构机分别从宁波、舟山两侧相向掘进，最终在海底实现高精度对接。面对超深高水压、复杂地层等极端工况，建设团队在施工中应用多项国产自主研发前沿技术。（新华社）", "originalSummary": "在中铁十四局集团有限公司的介绍中，记者29日了解到，在甬舟铁路金塘海底隧道建设现场，多项盾构前沿技术成果得到应用，覆盖智能掘进、智能装备等关键环节，推动这条世界最长海底高铁隧道建设向无人化、智能化方向发展。金塘海底隧道是甬舟铁路全线控制性工程，西起宁波北仑、东至舟山金塘，全长16.18公里，其中盾构段长11.21公里，采用两台超大直径盾构机分别从宁波、舟山两侧相向掘进，最终在海底实现高精度对接。面对超深高水压、复杂地层等极端工况，建设团队在施工中应用多项国产自主研发前沿技术。（新华社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415502.shtml", "translatedPage": ""}, {"idx": 28, "title": "尼日尔军政府发布声明呼吁民众保持冷静", "originalTitle": "尼日尔军政府发布声明呼吁民众保持冷静", "summary": "当地时间8月29日8时许，尼日尔保卫祖国国家委员会发布官方海报及声明，表示国防与安全部队已全面动员保卫祖国。声明呼吁广大民众面对当前突发事件保持冷静、团结与警惕，切勿传播未经证实的信息。当天凌晨1时左右，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声。武装分子针对迪奥里·哈马尼国际机场、101空军基地展开袭击，并试图强行突破总统府周边的安全警戒线，密集交火一直持续至天明。当天9时左右，尼日尔国家电视台信号突然中断。目前，首都安全局势仍不稳定。（央视新闻）", "originalSummary": "当地时间8月29日8时许，尼日尔保卫祖国国家委员会发布官方海报及声明，表示国防与安全部队已全面动员保卫祖国。声明呼吁广大民众面对当前突发事件保持冷静、团结与警惕，切勿传播未经证实的信息。当天凌晨1时左右，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声。武装分子针对迪奥里·哈马尼国际机场、101空军基地展开袭击，并试图强行突破总统府周边的安全警戒线，密集交火一直持续至天明。当天9时左右，尼日尔国家电视台信号突然中断。目前，首都安全局势仍不稳定。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415497.shtml", "translatedPage": ""}, {"idx": 29, "title": "乌称基辅近郊遭无人机袭击 已致27人遇难", "originalTitle": "乌称基辅近郊遭无人机袭击 已致27人遇难", "summary": "当地时间8月29日，乌克兰总统泽连斯基通报，基辅近郊米拉村自昨夜起持续遭遇俄军无人机袭击，目前各项善后处置工作正在有序推进。此次袭击击中村内一处仓库并引发爆炸，造成大量人员伤亡和基础设施损毁。截至目前，本次袭击已造成27人遇难、数十人受伤，超370名民众完成紧急疏散，相关疏散工作仍在持续推进。乌方表示，按照规定，弹药禁止存放于居民区及民用建筑周边，后续将依据调查结论，对相关决策及履职失职人员依法追责。据悉，乌克兰总理、内务部长已就本次袭击事件完成专项工作汇报。（央视新闻）", "originalSummary": "当地时间8月29日，乌克兰总统泽连斯基通报，基辅近郊米拉村自昨夜起持续遭遇俄军无人机袭击，目前各项善后处置工作正在有序推进。此次袭击击中村内一处仓库并引发爆炸，造成大量人员伤亡和基础设施损毁。截至目前，本次袭击已造成27人遇难、数十人受伤，超370名民众完成紧急疏散，相关疏散工作仍在持续推进。乌方表示，按照规定，弹药禁止存放于居民区及民用建筑周边，后续将依据调查结论，对相关决策及履职失职人员依法追责。据悉，乌克兰总理、内务部长已就本次袭击事件完成专项工作汇报。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415491.shtml", "translatedPage": ""}, {"idx": 30, "title": "近百家企业参展2026数博会“数据集市”", "originalTitle": "近百家企业参展2026数博会“数据集市”", "summary": "记者从国家数据局获悉，近百家企业参展2026数博会期间举行的“数据集市”活动。活动旨在推动数据产品、技术服务从成果展示转向合作落地。(新华社)", "originalSummary": "记者从国家数据局获悉，近百家企业参展2026数博会期间举行的“数据集市”活动。活动旨在推动数据产品、技术服务从成果展示转向合作落地。(新华社)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415406.shtml", "translatedPage": ""}, {"idx": 31, "title": "垂直升降载人飞行器在香港首航试飞", "originalTitle": "垂直升降载人飞行器在香港首航试飞", "summary": "eVTOL垂直升降飞行器昨日在中国香港特区顺利完成试飞。该项目此前入选了香港特区政府低空经济“监管沙盒 X”首批非传统航空器试点项目。记者在现场看到，飞行器垂直升空过程中姿态平稳，在空中悬停一段时间后缓慢下降，全程起降动作连贯顺畅，最后安全着陆。据研发企业代表介绍，此次试飞的机型为旗舰型载人产品，主要针对城市交通拥堵、地面通勤时间过长等问题，未来将应用于载人出行场景。 (中新网)", "originalSummary": "eVTOL垂直升降飞行器昨日在中国香港特区顺利完成试飞。该项目此前入选了香港特区政府低空经济“监管沙盒 X”首批非传统航空器试点项目。记者在现场看到，飞行器垂直升空过程中姿态平稳，在空中悬停一段时间后缓慢下降，全程起降动作连贯顺畅，最后安全着陆。据研发企业代表介绍，此次试飞的机型为旗舰型载人产品，主要针对城市交通拥堵、地面通勤时间过长等问题，未来将应用于载人出行场景。 (中新网)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415218.shtml", "translatedPage": ""}, {"idx": 32, "title": "企业人士共话中国和巴西经贸合作未来", "originalTitle": "企业人士共话中国和巴西经贸合作未来", "summary": "“巴西-中国企业高管对话：新经济下的基础设施”论坛日前在巴西里约热内卢市举行，两国政府、企业和机构人士共同探讨基础设施建设与投资合作机遇。来自巴西国家工业产权局、比亚迪等机构和企业的代表还就经贸合作领域的技术转移、知识产权保护及人工智能等议题展开探讨。 (新华社)", "originalSummary": "“巴西-中国企业高管对话：新经济下的基础设施”论坛日前在巴西里约热内卢市举行，两国政府、企业和机构人士共同探讨基础设施建设与投资合作机遇。来自巴西国家工业产权局、比亚迪等机构和企业的代表还就经贸合作领域的技术转移、知识产权保护及人工智能等议题展开探讨。 (新华社)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415100.shtml", "translatedPage": ""}, {"idx": 33, "title": "长鑫存储回应起诉美国国防部", "originalTitle": "长鑫存储回应起诉美国国防部", "summary": "有消息称，长鑫存储于美国东部时间8月28日向美国国防部提起诉讼。8月29日，长鑫存储向记者表示，公司向美国哥伦比亚特区地方法院提起诉讼，指控美国国防部错误地将其列入“中国军事企业”清单，该公司2025年1月被首次列名。长鑫存储不是军事企业，仅研发和生产用于商业及民用领域的DRAM（动态随机存取存储器）产品，未用于军事用途。（第一财经）", "originalSummary": "有消息称，长鑫存储于美国东部时间8月28日向美国国防部提起诉讼。8月29日，长鑫存储向记者表示，公司向美国哥伦比亚特区地方法院提起诉讼，指控美国国防部错误地将其列入“中国军事企业”清单，该公司2025年1月被首次列名。长鑫存储不是军事企业，仅研发和生产用于商业及民用领域的DRAM（动态随机存取存储器）产品，未用于军事用途。（第一财经）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415078.shtml", "translatedPage": ""}, {"id
