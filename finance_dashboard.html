<html lang="zh-CN">

<title>财经日报 · 晨报仪表盘</title>
<style>
  :root{--bg:#0e1014;--bg2:#151922;--card:#171c26;--card-hover:#1e2531;--border:#272f3d;--text:#e8ecf3;--muted:#9aa4b2;--accent:#f0b429;--accent2:#37e0b0;--up:#ff5b5b;--down:#3ddc84;--warn:#ff7a45;--chip:#222b39;--shadow:rgba(0,0,0,.45);--domestic:#5b9eff;--intl:#ff8c42;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:120px}
  body{background:radial-gradient(1200px 600px at 80% -10%, #2a2213 0%, var(--bg) 55%) fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .hero{padding:30px 0 16px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.18em;color:var(--accent);border:1px solid var(--border);padding:5px 12px;border-radius:999px;background:var(--bg2)}
  .hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;margin:12px 0 4px;letter-spacing:-.5px}
  .hero h1 .sub{color:var(--accent)}
  .hero .date{font-size:15px;color:var(--text);font-weight:600}
  .hero .window{font-size:13px;color:var(--muted);margin-top:2px}
  .quotes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .quote{display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 13px}
  .quote .qn{font-size:12.5px;color:var(--muted)}
  .quote .qp{font-size:15px;font-weight:800}
  .quote .qc{font-size:12.5px;font-weight:700}
  .quote.up .qp,.quote.up .qc{color:var(--up)}
  .quote.down .qp,.quote.down .qc{color:var(--down)}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .stat .num{font-size:14px;font-weight:800;color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat.total .num{color:var(--accent2)}
  .stat.domestic .num{color:var(--domestic)}
  .stat.intl .num{color:var(--intl)}
  .block{margin:14px 0 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .block h2{font-size:14px;font-weight:800;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .block p{font-size:13.5px;color:#c9d1dc;margin-bottom:8px;text-align:justify}
  .block p:last-child{margin-bottom:0}
  .block .sub-h{font-size:12.5px;font-weight:800;color:var(--accent);margin:10px 0 3px}
  .block.emergency{background:linear-gradient(135deg,#33210f,#1d1710);border-color:var(--warn)}
  .block.emergency h2{color:var(--warn)}
  .block.emergency ol{list-style:none;counter-reset:ev}
  .block.emergency li{counter-increment:ev;display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
  .block.emergency li:last-child{border-bottom:none}
  .block.emergency li::before{content:counter(ev);flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--warn);color:#1a1109;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .ev-t{font-size:13.5px;font-weight:700;text-align:justify}
  .ev-d{font-size:12.5px;color:#c9d1dc;text-align:justify}
  .ev-i{font-size:12px;color:var(--accent);text-align:justify}
  .block.strategy{background:linear-gradient(135deg,#12281f,#141a18);border-color:var(--accent2)}
  .risk{font-size:12px;color:#9aa4b2;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .market-divider{margin:32px 0 24px;padding:16px 20px;background:linear-gradient(90deg,rgba(91,158,255,.15),transparent);border-left:4px solid var(--domestic);border-radius:8px}
  .market-divider.intl{background:linear-gradient(90deg,rgba(255,140,66,.15),transparent);border-left-color:var(--intl)}
  .market-divider h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
  .market-divider h2 .badge{font-size:13px;background:var(--domestic);color:#fff;padding:4px 10px;border-radius:999px;font-weight:700}
  .market-divider.intl h2 .badge{background:var(--intl)}
  .nav{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin-top:14px}
  .nav .wrap{display:flex;gap:10px;overflow-x:auto;padding:12px 18px;scrollbar-width:thin}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);border:1px solid var(--border);background:var(--bg2);padding:7px 13px;border-radius:999px;white-space:nowrap;transition:.15s}
  .nav a:hover{color:var(--text);border-color:var(--accent)}
  .nav a b{color:var(--accent);font-weight:700;margin-left:6px}

  .section-head h2{font-size:21px;font-weight:750}
  .section-head .count{font-size:14px;color:var(--muted)}

  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.18s}

  .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkgroup{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .orig{font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--border);padding:6px 12px;border-radius:10px;background:var(--bg2);white-space:nowrap;transition:.15s}

  footer{border-top:1px solid var(--border);margin-top:18px;padding:26px 0 50px;color:var(--muted);font-size:13.5px}
  .note{font-size:12.5px;color:#6f7a8a;margin-top:10px}
  .nav{position:sticky;top:0;z-index:1000;background:rgba(14,16,20,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}

  .nav-sub::-webkit-scrollbar{display:none}
  .nav-label{font-size:13px;color:var(--muted);padding:4px 8px;white-space:nowrap}
  .nav-sub a{padding:4px 10px;border-radius:6px;font-size:13px;white-space:nowrap;transition:all .2s;background:var(--chip)}

  .toggle-btn:active{transform:scale(.98)}

  .back-to-top:active{transform:translateY(-2px)}

</style>
</head>

0759", "translatedPage": ""}, {"idx": 10, "title": "中国双向开放提速加力 外资加码中国消费赛道", "originalTitle": "中国双向开放提速加力 外资加码中国消费赛道", "summary": "格隆汇8月30日丨据央视财经，今年以来，我国扩大高水平对外开放，双向开放提速加力。数据显示，上半年，全国新设外商投资企业3.5万户，同比增长7.0%，吸引外资呈现良好态势，引资结构进一步优化。 从投资区域看，出口大省、沿边省份外商投资企业增长“双轮驱动”。上半年，海南、山东、广东、江苏等出口大省新设外商投资企业增速分别为38.6%、15.2%、8.1%、6.8%；黑龙江、内蒙古、广西、吉林等沿边省份新设外商投资企业增速分别达到79.5%、29.1%、16.6%、12.0%。从投资领域看，消费市场成为吸引外资的新方向。上半年，卫生和社会工作、批发和零售业、住宿和餐饮业新设外商投资企业增速分别为27.1%、11.9%和11.7%，专家表示，多国资本持续加码中国市场，充分体现出国际社会对中国经济、产业创新与营商环境的高度认可。", "originalSummary": "格隆汇8月30日丨据央视财经，今年以来，我国扩大高水平对外开放，双向开放提速加力。数据显示，上半年，全国新设外商投资企业3.5万户，同比增长7.0%，吸引外资呈现良好态势，引资结构进一步优化。 从投资区域看，出口大省、沿边省份外商投资企业增长“双轮驱动”。上半年，海南、山东、广东、江苏等出口大省新设外商投资企业增速分别为38.6%、15.2%、8.1%、6.8%；黑龙江、内蒙古、广西、吉林等沿边省份新设外商投资企业增速分别达到79.5%、29.1%、16.6%、12.0%。从投资领域看，消费市场成为吸引外资的新方向。上半年，卫生和社会工作、批发和零售业、住宿和餐饮业新设外商投资企业增速分别为27.1%、11.9%和11.7%，专家表示，多国资本持续加码中国市场，充分体现出国际社会对中国经济、产业创新与营商环境的高度认可。", "source": "格隆汇快讯", "original": "https://www.gelonghui.com/live/2640752", "translatedPage": ""}, {"idx": 11, "title": "普热普强藏布堰塞湖下游山体发生滑坡 形成新的堰塞体", "originalTitle": "普热普强藏布堰塞湖下游山体发生滑坡 形成新的堰塞体", "summary": "格隆汇8月30日｜据央视，从应急管理部获悉，为保障西藏日喀则市吉隆县泥石流灾害抢险救援工作，应急管理部调派“雨燕应急”成员单位侦察无人机和大载重无人机，持续监测普热普强藏布堰塞湖发展态势，滚动会商研判，全力协助指导地方做好抢险救援救灾各项工作。8月29日晚，前方监测无人机发现，普热普强藏布堰塞湖下游2.8公里处山体发生滑坡，形成新的堰塞体，正在形成新的堰塞湖。应急管理部迅速召集专家研判分析，同时已将吉隆口岸附近抢险救援人员转移到安全位置。", "originalSummary": "格隆汇8月30日｜据央视，从应急管理部获悉，为保障西藏日喀则市吉隆县泥石流灾害抢险救援工作，应急管理部调派“雨燕应急”成员单位侦察无人机和大载重无人机，持续监测普热普强藏布堰塞湖发展态势，滚动会商研判，全力协助指导地方做好抢险救援救灾各项工作。8月29日晚，前方监测无人机发现，普热普强藏布堰塞湖下游2.8公里处山体发生滑坡，形成新的堰塞体，正在形成新的堰塞湖。应急管理部迅速召集专家研判分析，同时已将吉隆口岸附近抢险救援人员转移到安全位置。", "source": "格隆汇快讯", "original": "https://www.gelonghui.com/live/2640747", "translatedPage": ""}, {"idx": 12, "title": "长江沿线最深铁路盾构隧道迎来“穿江利器”", "originalTitle": "长江沿线最深铁路盾构隧道迎来“穿江利器”", "summary": "格隆汇8月30日｜据中国中铁消息，近日，由中铁工业旗下中铁装备联合中铁隧道局共同研制的 “筑梦金陵号”大直径泥水平衡盾构机在杭州顺利下线，标志着南京首条高速铁路过江通道建设迈入关键阶段。南京上元门过江通道北起江北新区南京北站，南接主城南京站，线路全长约20.4公里，其中隧道段长约14公里，采用单洞双线高速铁路隧道设计。隧道长距离穿越长江底部，最大埋深107米，最大水压1.07兆帕，是目前长江沿线埋深最深、水压最大的铁路盾构隧道。", "originalSummary": "格隆汇8月30日｜ 14%降至2025年上半年的3.15%。", "originalSummary": "创新“主办银行”模式，投向地产开发项目的信托资金应存入主办银行账户，实行封闭管理、加强监测；细化了资产服务信托参与房企化险的相关规定   \n     \n        \n      2026年8月29日，在建房地产项目。8月28日，国家金融监管总局公布《信托公司开展房地产领域信托业务管理办法（试行）》。这是2023年信托业“三分类”实施后，监管部门首次对地产相关信托业务出台专门的管理办法。图：视觉中国 \n     \n    \n        　　 【财新网】 适应市场新形势，房地产相关融资政策迎来一系列优化调整，包括完善信托公司的房地产相关业务管理，进一步规范非标投资，并明确了服务信托参与地产项目风险处置的细化要求。 \n 　　2026年8月28日，国家金融监管总局公布《信托公司开展房地产领域信托业务管理办法（试行）》（下称《办法》），自2027年3月1日起施行。这是2023年信托业“三分类”实施后，监管部门首次对地产相关信托业务出台专门的管理办法。 \n 　　过去多年，信托行业依赖非标投资和通道业务，大量资金投向房地产企业和城投平台。在地产进入下行期、化解地方债务风险等背景下，为促进信托业回归本源、健康发展，2023年3月《关于规范信托公司信托业务分类的通知》即“三分类”出台，将信托业务划分为资产管理信托、资产服务信托、公益慈善信托三大类共25个业务品种。据信托业协会统计，资金信托投向地产的比例，从2022年末的8.14%降至2025年上半年的3.15%。", "source": "财新网", "original": "https://finance.caixin.com/2026-08-30/102479852.html", "translatedPage": ""}, {"idx": 32, "title": "对话｜程晓陶：水库溃坝的风险永远不可能为零", "originalTitle": "对话｜程晓陶：水库溃坝的风险永远不可能为零", "summary": "广西六蓝、云表水库溃坝造成重大人员伤亡。水利专家程晓陶表示，中国早已进入世界低溃坝率国家行列，但是溃坝的风险永远不可能为零   \n     \n        \n      2026年8月，广西横州六蓝水库东坝和主坝，溃坝后，水库干涸见底，只有少量流水，洪流已再塑地貌。图：财新 郑海鹏 \n     \n    \n        　　 【财新网】 受台风“美莎克”影响，2026年7月上旬，广西遭遇历史罕见的大范围持续性强降雨，南宁、贵港、钦州等多地出现超历史极值降水，多座中小型水库出现漫顶溃坝险情。7月6日，南宁横州市六蓝、云表等水库接连溃决。据南宁市政府通报，截至8月21日，南宁市因灾遇难136人、失联10人。其中，横州六蓝、云表等水库溃坝洪灾遇难107人、失联7人。（详见财新网：《 广西横州水库溃坝洪灾共致107人遇难、7人失联 》；财新周刊：《 显影｜横州洪灾45天后 》）", "originalSummary": "广西六蓝、云表水库溃坝造成重大人员伤亡。水利专家程晓陶表示，中国早已进入世界低溃坝率国家行列，但是溃坝的风险永远不可能为零   \n     \n        \n      2026年8月，广西横州六蓝水库东坝和主坝，溃坝后，水库干涸见底，只有少量流水，洪流已再塑地貌。图：财新 郑海鹏 \n     \n    \n        　　 【财新网】 受台风“美莎克”影响，2026年7月上旬，广西遭遇历史罕见的大范围持续性强降雨，南宁、贵港、钦州等多地出现超历史极值降水，多座中小型水库出现漫顶溃坝险情。7月6日，南宁横州市六蓝、云表等水库接连溃决。据南宁市政府通报，截至8月21日，南宁市因灾遇难136人、失联10人。其中，横州六蓝、云表等水库溃坝洪灾遇难107人、失联7人。（详见财新网：《 广西横州水库溃坝洪灾共致107人遇难、7人失联 》；财新周刊：《 显影｜横州洪灾45天后 》）", "source": "财新网", "original": "https://science.caixin.com/2026-08-30/102479848.html", "translatedPage": ""}, {"idx": 33, "title": "人事观察｜接替任振鹤 中办副主任孔绍逊任甘肃政府一把手", "originalTitle": "人事观察｜接替任振鹤 中办副主任孔绍逊任甘肃政府一把手", "summary": "孔绍逊早年任职家乡宁夏，2010年参与中组部组织的央地干部交流，调入中办工作   \n     \n        \ ，且70组数据均能精准除出一位小数的概率亦极度罕见，被指系事后倒推拟合。", "originalSummary": "国家自然科学基金委通报31起科研不端案件，其中回应了自媒体博主“耿同学讲故事”公布的多起顶刊论文学术打假事件。相关项目被撤销，资金被追回，涉事人员被惩戒   \n     \n        \n      “耿同学”将打假矛头主要对准“杰青”课题组，原因包括资源分配、监管策略、学术心理等多重考量。图：IC photo \n     \n    \n        　　 【财新网】 国家自然科学基金委员会（下称“自然基金委”）8月28日通报31起（2026年第二批）科研不端案件的处罚结果。通报中第28至31项回应了2026年3月起由科学自媒体博主“耿同学讲故事”（下称“耿同学”）公布的多起顶刊论文学术打假事件。事件自互联网发酵后，经历了网络举报揭露、校内专项立案免职、顶级国际期刊关注声明或撤稿，最终被官方通报惩戒。 \n 　　在同济大学王平与金佳丽案中，涉事论文为2025年1月发表于《自然》（Nature）的肿瘤机制研究，曾被团队称为“十年磨一剑”。2026年3月底至4月初，“耿同学”发布多期深度解析视频，质疑该论文“冲击史上最假Nature”。同行在PubPeer平台上揭露其数据存在不可思议的数学规律，例如连续35次测量数值均呈现绝对相差0.3%等极低概率异常，这在自然界发生的概率仅为10的负23次方，且70组数据均能精准除出一位小数的概率亦极度罕见，被指系事后倒推拟合。", "source": "财新网", "original": "https://science.caixin.com/2026-08-29/102479803.html", "translatedPage": ""}, {"idx": 78, "title": "一周天下｜中尼边境特大泥石流致586人遇难、几内亚垃圾填埋场垮塌致30人死亡", "originalTitle": "一周天下｜中尼边境特大泥石流致586人遇难、几内亚垃圾填埋场垮塌致30人死亡", "summary": "", "originalSummary": "", "source": "财新网", "original": "https://photos.caixin.com/2026-08-29/102479759.html", "translatedPage": ""}, {"idx": 79, "title": "Trump seeking ways to shield farmers from expansion of refinery biofuel waivers - report", "originalTitle": "Trump seeking ways to shield farmers from expansion of refinery biofuel waivers - report", "summary": "", "originalSummary": "", "source": "Seeking Alpha", "original": "https://seekingalpha.com/news/4638047-trump-seeking-ways-to-shield-farmers-from-expansion-of-refinery-biofuel-waivers-report?utm_source=feed_news_all&utm_medium=referral&feed_item_type=news", "translatedPage": ""}, {"idx": 80, "title": "SA Asks: What's the best AI cybersecurity stock play right now?", "originalTitle": "SA Asks: What's the best AI cybersecurity stock play right now?", "summary": "", "originalSummary": "", "source": "Seeking Alpha", "original": "https://seekingalpha.com/news/4638045-sa-asks-whats-the-best-ai-cybersecurity-stock-play-right-now?utm_source=feed_news_all&utm_medium=referral&feed_item_type=news", "translatedPage": ""}, {"idx": 81, "
