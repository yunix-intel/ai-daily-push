<title>财经日报 · 晨报仪表盘</title>
<style>
  :root{--bg:#0e1014;--bg2:#151922;--card:#171c26;--card-hover:#1e2531;--border:#272f3d;--text:#e8ecf3;--muted:#9aa4b2;--accent:#f0b429;--accent2:#37e0b0;--up:#ff5b5b;--down:#3ddc84;--warn:#ff7a45;--chip:#222b39;--shadow:rgba(0,0,0,.45);--domestic:#5b9eff;--intl:#ff8c42;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(1200px 600px at 80% -10%, #2a2213 0%, var(--bg) 55%) fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:56px}
  a{color:inherit;text-decoration:none}
  .global-nav{position:fixed;top:0;left:0;right:0;background:rgba(14,16,20,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:1000;padding:12px 0}
  .global-nav .wrap{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;gap:20px;align-items:center}
  .global-nav a{color:var(--text);text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:6px;transition:all .2s}
  .global-nav a:hover{background:var(--card-hover);color:var(--accent)}
  .global-nav a.active{background:var(--accent);color:#0c1320}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .hero{padding:30px 0 16px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.18em;color:var(--accent);border:1px solid var(--border);padding:5px 12px;border-radius:999px;background:var(--bg2)}
  .hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;margin:12px 0 4px;letter-spacing:-.5px}
  .hero h1 .sub{color:var(--accent)}
  .hero .date{font-size:15px;color:var(--text);font-weight:600}
  .hero .window{font-size:13px;color:var(--muted);margin-top:2px}
  .quotes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .quote{display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 13px}
  .quote .qn{font-size:12.5px;color:var(--muted)}
  .quote .qp{font-size:15px;font-weight:800}
  .quote .qc{font-size:12.5px;font-weight:700}
  .quote.up .qp,.quote.up .qc{color:var(--up)}
  .quote.down .qp,.quote.down .qc{color:var(--down)}
  .quotes-note{font-size:11.5px;color:var(--muted);margin-top:7px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .stat .num{font-size:14px;font-weight:800;color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat.total .num{color:var(--accent2)}
  .stat.domestic .num{color:var(--domestic)}
  .stat.intl .num{color:var(--intl)}
  .block{margin:14px 0 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .block h2{font-size:14px;font-weight:800;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .block p{font-size:13.5px;color:#c9d1dc;margin-bottom:8px;text-align:justify}
  .block p:last-child{margin-bottom:0}
  .block .sub-h{font-size:12.5px;font-weight:800;color:var(--accent);margin:10px 0 3px}
  .block.emergency{background:linear-gradient(135deg,#33210f,#1d1710);border-color:var(--warn)}
  .block.emergency h2{color:var(--warn)}
  .block.emergency ol{list-style:none;counter-reset:ev}
  .block.emergency li{counter-increment:ev;display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
  .block.emergency li:last-child{border-bottom:none}
  .block.emergency li::before{content:counter(ev);flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--warn);color:#1a1109;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .ev-t{font-size:13.5px;font-weight:700;text-align:justify}
  .ev-d{font-size:12.5px;color:#c9d1dc;text-align:justify}
  .ev-i{font-size:12px;color:var(--accent);text-align:justify}
  .block.strategy{background:linear-gradient(135deg,#12281f,#141a18);border-color:var(--accent2)}
  .risk{font-size:12px;color:#9aa4b2;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .market-divider{margin:32px 0 24px;padding:16px 20px;background:linear-gradient(90deg,rgba(91,158,255,.15),transparent);border-left:4px solid var(--domestic);border-radius:8px}
  .market-divider.intl{background:linear-gradient(90deg,rgba(255,140,66,.15),transparent);border-left-color:var(--intl)}
  .market-divider h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
  .market-divider h2 .badge{font-size:13px;background:var(--domestic);color:#fff;padding:4px 10px;border-radius:999px;font-weight:700}
  .market-divider.intl h2 .badge{background:var(--intl)}
  .mustread{background:linear-gradient(135deg,#33280f,#1d1a10);border:1px solid var(--accent);border-radius:12px;padding:16px 20px}
  .mustread h2{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .mustread ol{list-style:none;counter-reset:mr;margin:0;padding:0}
  .mustread li{counter-increment:mr;display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
  .mustread li:last-child{border-bottom:none}
  .mustread li::before{content:counter(mr);flex:0 0 auto;width:20px;height:20px;background:var(--accent);color:#1a1109;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .mustread .mr-t{flex:1;font-size:14px;font-weight:600;line-height:1.5;text-align:justify}
  .mustread .mr-t a:hover{color:var(--accent)}
  .mustread .mr-s{font-size:12px;color:var(--muted);white-space:nowrap}
  .blogger{border-left:3px solid var(--accent)}
  .blogger .bg-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .blogger .bg-nm{font-size:15px;font-weight:800}
  .blogger .bg-tone{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
  .blogger .bg-tone.up{color:var(--up);border-color:var(--up)}
  .blogger .bg-tone.down{color:var(--down);border-color:var(--down)}
  .blogger .bg-view{font-size:14px;line-height:1.75;text-align:justify}
  .blogger .bg-focus{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .blogger .bg-focus span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}

  .blogger .bg-src a:hover{color:var(--accent)}
  .blogger .bg-live{display:inline-block;font-size:10.5px;font-weight:700;color:#1a1109;background:var(--accent);border-radius:4px;padding:1px 5px;margin-right:5px}

  .tab.active{color:var(--text);background:var(--card)}
  .tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent)}

  .sub-tab.active{color:var(--text);background:var(--card);border-color:var(--accent)}
  .sub-tab .count{display:inline-block;margin-left:4px;font-size:11px;opacity:.7}

  main{padding:28px 0 10px}
  .section{margin-bottom:38px;scroll-margin-top:64px}

  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.18s}

  .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .card .idx{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c98f10);color:#1a1109;font-weight:800;font-size:15px;flex:0 0 auto}
  .chip{font-size:12px;color:var(--muted);background:var(--chip);border:1px solid var(--border);padding:4px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .card h3 a:hover{color:var(--accent)}
  .card .summary{font-size:14px;color:#c4ccd8;flex:1;margin-bottom:10px;text-align:justify}
  .card .original-text{font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-bottom:14px;text-align:justify}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkgroup{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .orig{font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--border);padding:6px 12px;border-radius:10px;background:var(--bg2);white-space:nowrap;transition:.15s}
  .orig:hover{background:var(--accent);color:#1a1109;border-color:var(--accent)}
  footer{border-top:1px solid var(--border);margin-top:18px;padding:26px 0 50px;color:var(--muted);font-size:13.5px}
  .note{font-size:12.5px;color:#6f7a8a;margin-top:10px}
  @media (max-width:560px){.hero{padding:22px 0 12px}.grid{grid-template-columns:1fr}}

        main+='<div class="sub-h">主力净流入 Top 10</div>';
        main+='<div style="margin:10px 0"><table style="width:100%;border-collapse:collapse">';
        main+='<thead><tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:13px"><th style="text-align:left;padding:8px">股票</th><th style="text-align:center;padding:8px">代码</th><th style="text-align:right;padding:8px">净流入</th><th style="text-align:right;padding:8px">涨跌幅</th></tr></thead><tbody>';
        stf.top_inflow.forEach(item=>{
          const flowCls = item.net_inflow > 0 ? 'up' : 'down';
          const pctCls = item.change_pct > 0 ? 'up' : (item.change_pct < 0 ? 'down' : '');
          main+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px">'+esc(item.name)+'</td>';
          main+='<td style="text-align:center;padding:10px;color:var(--muted);font-size:12px">'+esc(item.code)+'</td>';
          main+='<td class="'+flowCls+'" style="text-align:right;padding:10px;font-weight:600">'+(item.net_inflow>0?'+':'')+item.net_inflow.toFixed(2)+' 亿</td>';
          main+='<td class="'+pctCls+'" style="text-align:right;padding:10px">'+(item.change_pct>0?'+':'')+item.change_pct.toFixed(2)+'%</td></tr>';
        });
        main+='</tbody></table></div>';
      }
      main+='</div>';
    }
  }

  document.getElementById('main').innerHTML=main;
  const sources='格隆汇、同花顺、金十数据、第一财经、财新网、Seeking Alpha、Bloomberg、CNBC';
  document.getElementById('footerMeta').innerHTML='本期共 <b style="color:var(--accent2)">'+meta.total+'</b> 条 · 数据来源：'+sources+' · 行情：腾讯财经';

  // Tab 切换功能
  const tabs = document.querySelectorAll('.tab');
  const sections = document.querySelectorAll('.section');
  tabs.forEach(tab => {
    tab.addEventListener('click', function(){
      const filter = this.getAttribute('data-filter');

      // 更新 tab 状态
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');

      // 过滤显示对应的 section
      sections.forEach(section => {
        const sectionId = section.getAttribute('id');
        if(filter === 'all'){
          section.classList.remove('hidden');
        }else if(filter === 'domestic' && sectionId && sectionId.startsWith('domestic-')){
          section.classList.remove('hidden');
        }else if(filter === 'intl' && sectionId && sectionId.startsWith('intl-')){
          section.classList.remove('hidden');
        }else{
          section.classList.add('hidden');
        }
      });

      // 平滑滚动到第一个可见的新闻区域
      const firstVisible = document.querySelector('.section:not(.hidden)');
      if(firstVisible){
        firstVisible.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    });
  });

  // 二级tab切换功能（section级别）
  const subTabsContainers = document.querySelectorAll('.sub-tabs');
  subTabsContainers.forEach(container => {
    const marketId = container.getAttribute('data-market');
    const subTabs = container.querySelectorAll('.sub-tab');

    subTabs.forEach(subTab => {
      subTab.addEventListener('click', function(){
        const sectionFilter = this.getAttribute('data-section');

        // 更新当前market的sub-tab状态
        subTabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');

        // 过滤显示对应market下的sections
        const marketSections = document.querySelectorAll('.section[id^="'+marketId+'-sec-"]');
        marketSections.forEach(section => {
          if(sectionFilter === 'all-'+marketId){
            // 显示该market的所有sections
            section.classList.remove('hidden');
          }else if(section.getAttribute('id') === sectionFilter){
            // 显示特定section
            section.classList.remove('hidden');
          }else{
            // 隐藏其他sections
            section.classList.add('hidden');
          }
        });

        // 平滑滚动到第一个可见的section
        const firstVisibleSection = document.querySelector('.section[id^="'+marketId+'-sec-"]:not(.hidden)');
        if(firstVisibleSection){
          firstVisibleSection.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      });
    });
  });
})();

// 展开/折叠翻译全文
function toggleTranslation(contentId, linkElement) {
  const content = document.getElementById(contentId);
  if (content) {
    if (content.style.display === 'none') {
      content.style.display = 'block';
      linkElement.textContent = '收起中文全文 ↑';
    } else {
      content.style.display = 'none';
      linkElement.textContent = '查看中文全文 ↓';
    }
  }
}
</script>
</body></html>
