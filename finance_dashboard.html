尔灾区，立即投入尼泊尔水电站隧道救援工作。同时，根据救援工作需要，又紧急增派4名中方隧道专家赴尼，全力支持尼泊尔开展隧道救援工作。 (央视)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415754.shtml", "translatedPage": ""}, {"idx": 27, "title": "尼日尔爆发军人哗变", "originalTitle": "尼日尔爆发军人哗变", "summary": "当地时间今天（8月29日）凌晨起，尼日尔首都尼亚美经历一夜剧烈枪战。据消息人士披露，此次冲突系尼日尔武装部队内部年轻军官策划发动的军人哗变。叛乱部队分别从蒂拉贝里和多索两个方向向首都尼亚美汇聚，多路突袭并将目标锁定为总统府、迪奥里·哈马尼国际机场以及尼日尔国家电视台等核心设施。据消息人士介绍，目前针对国家电视台和总统府的攻势已被击退，但位于机场附近的101空军基地周边冲突仍在持续，双方仍在展开激烈交火。此前突发信号中断的尼日尔国家电视台已恢复播出。 (CCTV国际时讯)", "originalSummary": "当地时间今天（8月29日）凌晨起，尼日尔首都尼亚美经历一夜剧烈枪战。据消息人士披露，此次冲突系尼日尔武装部队内部年轻军官策划发动的军人哗变。叛乱部队分别从蒂拉贝里和多索两个方向向首都尼亚美汇聚，多路突袭并将目标锁定为总统府、迪奥里·哈马尼国际机场以及尼日尔国家电视台等核心设施。据消息人士介绍，目前针对国家电视台和总统府的攻势已被击退，但位于机场附近的101空军基地周边冲突仍在持续，双方仍在展开激烈交火。此前突发信号中断的尼日尔国家电视台已恢复播出。 (CCTV国际时讯)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415655.shtml", "translatedPage": ""}, {"idx": 28, "title": "南京住房公积金异地贷款范围扩展至全国 9月1日起施行", "originalTitle": "南京住房公积金异地贷款范围扩展至全国 9月1日起施行", "summary": "8月29日，南京住房公积金管理中心发布通知，进一步扩大住房公积金异地贷款范围。通知全文：为更好发挥住房公积金制度作用，进一步满足购房人跨区域住房消费需求，现将住房公积金异地贷款范围扩展至全国。全国范围内的住房公积金缴存人，在南京市购房均可向南京住房公积金管理中心申请住房公积金贷款。本通知自2026年9月1日起施行。（央视新闻）", "originalSummary": "8月29日，南京住房公积金管理中心发布通知，进一步扩大住房公积金异地贷款范围。通知全文：为更好发挥住房公积金制度作用，进一步满足购房人跨区域住房消费需求，现将住房公积金异地贷款范围扩展至全国。全国范围内的住房公积金缴存人，在南京市购房均可向南京住房公积金管理中心申请住房公积金贷款。本通知自2026年9月1日起施行。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415562.shtml", "translatedPage": ""}, {"idx": 29, "title": "上海电气与巴斯夫集团共商绿色低碳合作", "originalTitle": "上海电气与巴斯夫集团共商绿色低碳合作", "summary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "originalSummary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415552.shtml", "translatedPage": ""}, {"idx": 30, "title": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "originalTitle": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "summary": "当 吸引、培养并让美国最优秀的人才毕业”。   3.  否认因无法演讲而改赴五角大楼 ——特朗普否认因纽约世贸中心“9·11”纪念仪式按惯例不安排政治人物演讲而改赴五角大楼的报道，痛批《纽约时报》记者玛吉·哈伯曼捏造消息。   4.  批评纽约州州长霍赫尔“站在加拿大一边” ——特朗普批评纽约州州长霍赫尔“站在加拿大一边”，不愿使用“美国湖”这一名称、“宁愿让加拿大赢”，并力挺布莱克曼成为纽约州下一任州长。   5.  悼念挪威国王哈拉尔 ——特朗普发文称：听到挪威国王哈拉尔逝世的消息，我们深感悲痛。他是一位坚强、自豪且备受尊敬的人。他热爱自己的国家，也深受人民的爱戴和尊敬。在这一艰难时刻，我们的心与挪威王室及全体挪威人民同在。这真是一个巨大的损失。   6.  纽约“封口费”案移交联邦法院的请求被驳回 ——美国联邦法官驳回特朗普将纽约“封口费”案移交联邦法院的请求。法官认定案件涉及特朗普个人行为，不适用总统豁免权。特朗普方面表示将提出上诉。   7.  美政府就邮寄投票新规被叫停正式提起上诉 ——当地时间8月28日，特朗普政府当日正式就一项阻止其邮寄投票行政令生效的联邦法院裁决提起上诉。波士顿联邦地区法官英迪拉·塔尔瓦尼于8月27日晚签发一项为期14天的临时限制令，暂停美国邮政署执行相关邮寄投票新规，并定于9月3日举行听证会，考虑是否实施更长期的禁令。", "originalSummary": "1.  宣布获得逾650亿桶委石油储量“多数控制权” ——特朗普28日在社交媒体发文宣布，美国已与委内瑞拉达成协议，获得对委内瑞拉已探明石油储量中逾650亿桶的“多数控制权”。特朗普说，这一交易“将使美国石油储备增加一倍以上，大幅提高石油供应，并在未来很长时间显著降低美国汽油价格”。   2.  签署行政令创建美国太空学院 ——特朗普签署行政令，启动创建“美国太空学院”的程序，称该学院将同时服务于美国太空军、美国航空航天局（NASA）和民用航天产业，并将以西点军校和美国海军学院等军事院校为参照，“吸引、培养并让美国最优秀的人才毕业”。   3.  否认因无法演讲而改赴五角大楼 ——特朗普否认因纽约世贸中心“9·11”纪念仪式按惯例不安排政治人物演讲而改赴五角大楼的报道，痛批《纽约时报》记者玛吉·哈伯曼捏造消息。   4.  批评纽约州州长霍赫尔“站在加拿大一边” ——特朗普批评纽约州州长霍赫尔“站在加拿大一边”，不愿使用“美国湖”这一名称、“宁愿让加拿大赢”，并力挺布莱克曼成为纽约州下一任州长。   5.  悼念挪威国王哈拉尔 ——特朗普发文称：听到挪威国王哈拉尔逝世的消息，我们深感悲痛。他是一位坚强、自豪且备受尊敬的人。他热爱自己的国家，也深受人民的爱戴和尊敬。在这一艰难时刻，我们的心与挪威王室及全体挪威人民同在。这真是一个巨大的损失。   6.  纽约“封口费”案移交联邦法院的请求被驳回 ——美国联邦法官驳回特朗普将纽约“封口费”案移交联邦法院的请求。法官认定案件涉及特朗普个人行为，不适用总统豁免权。特朗普方面表示将提出上诉。   7.  美政府就邮寄投票新规被叫停正式提起上诉 ——当地时间8月28日，特朗普政府当日正式就一项阻止其邮寄投票行政令生效的联邦法院裁决提起上诉。波士顿联邦地区法官英迪拉·塔尔瓦尼于8月27日晚签发一项为期14天的临时限制令，暂停美国邮政署执行相关邮寄投票新规，并定于9月3日举行听证会，考虑是否实施更长期的禁令。", "source": "金十数据", "original": "", "translatedPage": ""}, {"idx": 37, "title": "Eni working with Venezuela to revitalize the country’s energy sector", "originalTitle": "Eni working with Venezuela to revitalize the country’s energy sector", "summary": "", "originalSummary": "", "source": "Seeking Alpha", "original": "https://seekingalpha.com/news/4638040-eni-working-venezuela-revive-energy-sector?utm_source=feed_news_all&utm_medium=referral&feed_item_type=news", "translatedPage": ""}, {"idx": 38, "title": "Airbus reportedly seeking sale of its U.S. sp function fmtBeijing(iso, opts){try{const dt=new Date(iso);const o=Object.assign({timeZone:'Asia/Shanghai',hour12:false},opts||{});return new Intl.DateTimeFormat('zh-CN',o).format(dt);}catch(e){return iso;}}
function truncate(s,n){const arr=Array.from(s||'');if(arr.length<=n)return s||'';return arr.slice(0,n-1).join('')+'…';}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){try{const p=new URL(u,location.href).protocol;return (p==='http:'||p==='https:')?u:'#';}catch(e){return '#';}}
(function render(){

  document.getElementById('heroWindow').textContent='收录窗口：'+fmtBeijing(meta.windowStart,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' — '+fmtBeijing(meta.windowEnd,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+'（北京时间，过去 24 小时）';
  const quotes=DATA.quotes||[];
  document.getElementById('heroQuotes').innerHTML=quotes.map(q=>{
    const cls=q.pct>0?'up':(q.pct<0?'down':'');
    const sign=q.pct>0?'+':'';
    return '<span class="quote '+cls+'"><span class="qn">'+esc(q.name)+'</span><span class="qp">'+q.price+'</span><span class="qc">'+sign+q.pct.toFixed(2)+'%</span></span>';
  }).join('');
  let st='<div class="stat total"><div class="num">'+meta.total+'</div><div class="lbl">总条数</div></div>';
  sections.forEach(s=>{st+='<div class="stat"><div class="num">'+s.items.length+'</div><div class="lbl">'+esc(s.label)+'</div></div>';});
  document.getElementById('heroStats').innerHTML=st;
  const events=DATA.emergencyEvents||[];
  if(events.length){
    document.getElementById('emergency').style.display='';
    document.getElementById('emergencyList').innerHTML=events.map(e=>
      '<li><div><div class="ev-t">'+esc(e.title)+'</div><div class="ev-d">'+esc(e.desc)+'</div>'+

  if(sb){document.getElementById('strategyBlock').style.display='';document.getElementById('strategyBody').innerHTML=sb;}

  document.getElementById('navLinks').innerHTML=nav;
  let main='';sections.forEach((s,i)=>{main+='<section class="section" id="sec-'+i+'"><div class="section-head"><h2>'+esc(s.label)+'</h2><span class="count">'+s.items.length+' 条</span></div><div class="grid">';
    s.items.forEach(it=>{const orig=safeUrl(it.original||'#');const tp=safeUrl(it.translatedPage||'');
