贝里和多索两个方向向首都尼亚美汇聚，多路突袭并将目标锁定为总统府、迪奥里·哈马尼国际机场以及尼日尔国家电视台等核心设施。据消息人士介绍，目前针对国家电视台和总统府的攻势已被击退，但位于机场附近的101空军基地周边冲突仍在持续，双方仍在展开激烈交火。此前突发信号中断的尼日尔国家电视台已恢复播出。 (CCTV国际时讯)", "originalSummary": "当地时间今天（8月29日）凌晨起，尼日尔首都尼亚美经历一夜剧烈枪战。据消息人士披露，此次冲突系尼日尔武装部队内部年轻军官策划发动的军人哗变。叛乱部队分别从蒂拉贝里和多索两个方向向首都尼亚美汇聚，多路突袭并将目标锁定为总统府、迪奥里·哈马尼国际机场以及尼日尔国家电视台等核心设施。据消息人士介绍，目前针对国家电视台和总统府的攻势已被击退，但位于机场附近的101空军基地周边冲突仍在持续，双方仍在展开激烈交火。此前突发信号中断的尼日尔国家电视台已恢复播出。 (CCTV国际时讯)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415655.shtml", "translatedPage": ""}, {"idx": 37, "title": "南京住房公积金异地贷款范围扩展至全国 9月1日起施行", "originalTitle": "南京住房公积金异地贷款范围扩展至全国 9月1日起施行", "summary": "8月29日，南京住房公积金管理中心发布通知，进一步扩大住房公积金异地贷款范围。通知全文：为更好发挥住房公积金制度作用，进一步满足购房人跨区域住房消费需求，现将住房公积金异地贷款范围扩展至全国。全国范围内的住房公积金缴存人，在南京市购房均可向南京住房公积金管理中心申请住房公积金贷款。本通知自2026年9月1日起施行。（央视新闻）", "originalSummary": "8月29日，南京住房公积金管理中心发布通知，进一步扩大住房公积金异地贷款范围。通知全文：为更好发挥住房公积金制度作用，进一步满足购房人跨区域住房消费需求，现将住房公积金异地贷款范围扩展至全国。全国范围内的住房公积金缴存人，在南京市购房均可向南京住房公积金管理中心申请住房公积金贷款。本通知自2026年9月1日起施行。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415562.shtml", "translatedPage": ""}, {"idx": 38, "title": "上海电气与巴斯夫集团共商绿色低碳合作", "originalTitle": "上海电气与巴斯夫集团共商绿色低碳合作", "summary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "originalSummary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415552.shtml", "translatedPage": ""}, {"idx": 39, "title": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "originalTitle": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "summary": "当地时间8月29日凌晨起，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声，密集交火一直持续至天明。中国驻尼日尔大使馆对此发布安全提醒。我使馆提醒中国公民和在尼侨胞密切关注安全形势，提高安全警惕，加强安防意识，提升安保措施，做好应急储备，减少非必要外出，在公共场所切勿过多停留，避免夜间出行和单独行动，远离危险敏感区域。中资企业应切实加强安全措施，做好应急预案，在确保安全前提下开展工作，坚决杜绝户外高风险作业，确保员工人身安全和企业财产安全。（央视新闻）", "originalSummary": "当地时间8月29日凌晨起，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声，密集交火一直持续至天明。中国驻尼日尔大使馆对此发布安全提醒。我使馆提醒中国公民和在尼侨胞密切关注安全   if(sg.aShare) sb+='<div class="sub-h">A 股</div><p>'+esc(sg.aShare)+'</p>';
  if(sg.hkShare) sb+='<div class="sub-h">港股</div><p>'+esc(sg.hkShare)+'</p>';
  if(sg.risk) sb+='<div class="risk">'+esc(sg.risk)+'</div>';
  if(sb){document.getElementById('strategyBlock').style.display='';document.getElementById('strategyBody').innerHTML=sb;}
  let nav='';sections.forEach((s,i)=>{nav+='<a href="#sec-'+i+'">'+esc(s.label)+'<b>'+s.items.length+'</b></a>';});
  document.getElementById('navLinks').innerHTML=nav;
  let main='';sections.forEach((s,i)=>{main+='<section class="section" id="sec-'+i+'"><div class="section-head"><h2>'+esc(s.label)+'</h2><span class="count">'+s.items.length+' 条</span></div><div class="grid">';
    s.items.forEach(it=>{const orig=safeUrl(it.original||'#');const tp=safeUrl(it.translatedPage||'');
      main+='<article class="card"><div class="top"><span class="idx">'+it.idx+'</span><span class="chip" title="'+esc(it.source)+'">'+esc(it.source)+'</span></div>';
      main+='<h3><a href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>';
      main+='<p class="summary">'+esc(truncate(it.summary,120))+'</p>';
      if(it.originalTitle!==it.title||it.originalSummary!==it.summary) main+='<p class="original-text"><b>原文</b><br>'+esc(truncate(it.originalTitle,120))+'<br>'+esc(truncate(it.originalSummary,260))+'</p>';
      main+='<div class="foot"><span class="src">'+esc(it.source)+'</span><span class="linkgroup">'+(tp&&tp!=='#'?'<a class="orig" href="'+esc(tp)+'" target="_blank" rel="noopener noreferrer">翻译全文 ↗</a>':'')+'<a class="orig" href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a></span></div></article>';});
    main+='</div></section>';});
  document.getElementById('main').innerHTML=main;
  document.getElementById('footerMeta').innerHTML='本期共 <b style="color:var(--accent2)">'+meta.total+'</b> 条 · 数据来源：格隆汇、同花顺、金十数据、Seeking Alpha、MarketWatch、CNBC Finance · 行情：腾讯财经';
})();
</script>
