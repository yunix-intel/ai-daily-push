<style>

  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .hero{padding:30px 0 16px}

  .hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;margin:12px 0 4px;letter-spacing:-.5px}
  .hero h1 .sub{color:var(--accent)}
  .hero .date{font-size:15px;color:var(--text);font-weight:600}
  .hero .window{font-size:13px;color:var(--muted);margin-top:2px}
  .quotes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .quote{display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 13px}

  .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .note{font-size:12.5px;color:#6f7a8a;margin-top:10px}
  @media (max-width:560px){.hero{padding:22px 0 12px}.grid{grid-template-columns:1fr}}
</style>

来可能逐步升温。  ②方正证券：市场磨底进程进入后半段，关注三方面配置机会  方正证券研报指出，市场磨底进程进入后半段，进入9月份之后方向性选择临近。从基本面来看，经济逐步进入旺季，7月政治局会议之后政策的落地效果迎来验证，新一轮增量政策出台的窗口期正在打开；流动性方面，9月以及全年美联储货币政策取向将水落石出，考虑到当前美债利率高企以及中期选举临近，加息的概率并不大；风险偏好方面，市场成交额较高点回落一半左右，基本可以认为是本轮调整的地量水平，指数底部逐渐清晰。此外，新一轮元首外交的窗口期即将到来，对于市场风险偏好的影响需要重点关注。结构上来看，指数走势的核心决定因素仍是科技，这和2021年-2022年的新能源是类似的，关注能创新高的细分赛道对科技整体情绪的带动作用。  磨底阶段市场主线不清晰，轮动加快，继续关注三方面配置机会，一是进入中报业绩披露窗口期，科技股内部向能涨价、能扩量、有新技术突破的细分方向倾斜，包括海外算力中拥挤度不高、筹码结构较好的核心标的，以及国产算力中景气确定性较强的半导体设备和材料，此外还可以关注相对低位的AI应用以及恒生科技；二是关注弱美元下HALO资产的布局机会，美债和美元信用问题重燃，美联储加息预期进一步弱化，除了核心资源相关的有色金属+化工之外，还可以关注新旧能源，包括储能、煤炭等；三是对于货币政策变化反应最为直接，业绩估值匹配度较好，能够稳指数的非银金融。  ③光大证券：市场整体上行斜率相对平缓，或更多以结构性机会呈现  光大证券研报指出，短期市场波动的核心外部变量仍是美债长端利率。本轮长端美债收益率上行，主要驱动来自美国财政融资压力带来的期限溢价抬升，而非美联储加息预期的进一步加码。从市场定价来看，美联储9月加息概率已处于较低水平，短期紧缩预期并未明显升级。但从中期视角看，美国财政纪律偏弱、AI产业大规模资本开支带来的融资需求，仍会对长端利率形成持续约束，利率下行空间或相对有限。综合来看，9月A股大概率维持震荡偏强格局。国内经济盈利修复、政策持续托底构成市场核心支撑，美债利率波动、AI产业预期修正构成上行约束，市场整体上行斜率相对平缓，或更多以结构性机会呈现。  配置上，可关注三大方向：一是科技成长领域，聚焦竞争格局清晰、技术壁垒较高的细分赛道，比如国产算力、存储、半导体设备以及AI应用等方向；二是周期板块，把握地缘缓和与美元信用预期变化下的实物资产重估机会，关注贵金属、小金属以及基础化工品种；三是价值与内需方向，关注高股息红利资产以及券商、消费蓝筹等基本面边际改善的方向。", "originalSummary": "机构论后市丨市场磨底进程进入后半段；震荡博弈之下关注三大方向  |  沪指本周累计涨1.20%，深证成指跌1%，创业板指跌3.42%，科创综指跌0.71%。A股后市怎么走？看看机构怎么说：  ①中信证券：AI在Q2集中体现 而能化接下来可能逐步升温  中信证券研报指出，2022年后A股“结构性快速轮动”是常态，极高轮动速度持续时间一般在1~2个月，高速轮动背后的共性是盈利上修的广度不足，可持续的主线稀缺。当前，贸易摩擦步入高发期，汇兑损益的影响也在放大，出海作为A股最重要的业绩线索之一遭遇估值约束，制约了行情的宽度，容易形成行业快速轮动的市场状态。打破僵局需要新的变化，近期的AI进展强化了算力需求快速增长的既有趋势，但不足以改变远期商业化叙事，若后续看到类似RSI、防蒸馏等可能的新变化出现则有望打开远期估值空间。  在行情快速轮动的阶段，主要的风格策略当中，赢家大部分是“低估值系”策略，不过其中只有PB-ROE策略在快速轮动环境下明显占优，且策略收益率随着轮动速度提升而进一步增强，动量策略则是快速轮动阶段最受损的策略，高轮动下市场机会或将更多体现为具备业绩支撑品种的估值修复。配置上，我们在中期策略中提出“AI+能化”的杠铃结构，AI在Q2集中体现，而能化接下来可能逐步升温。  ②方正证券：市场磨底进程进入后半段，关注三方面配置机会  方正证券研报指出，市场磨底进程进入后半段，进入9月份之后方向性选择临近。从基本面来看，经济逐步进入旺季，7月政治局会议之后政策的落地效果迎来验证，新一轮增量政策出台的窗口期正在打开；流动性方面，9月以及全年美联储货币政策取向将水落石出，考虑到当前美债利率高企以及中期选举临近，加息的概率并不大；风险偏好方面，市场成交额较高点回落一半左右，基本可以认为是本轮调整的地量水平，指数底部逐渐清晰。此外，新一轮元首外交的窗口期即将到来，对于市场风险偏好的影响需要重点关注。结构上来看，指数走势的核心决定因素仍是科技，这和2021年-2022年的新能源是类似的，关注能创新高的细分赛道对科技整体情绪的带动作用。  磨底阶段市场主线不清晰，轮动加快，继续关注三方面配 le": "国内家电需求承压 美的上半年营收逆市同比增长3.6%", "originalTitle": "国内家电需求承压 美的上半年营收逆市同比增长3.6%", "summary": "美的集团的营收、利润同比双增，是国内“白电三巨头”中唯一业绩上扬的企业   \n     \n        \n      2026年8月28日，美的集团发布2026半年报，实现营收2600.42亿元，同比增长3.55%。图：IC photo \n     \n    \n        　　 【财新网】 国内家电大盘收缩， 美的集团 （000333.SZ/ 00300.HK）业绩逆势增长。2026年上半年，美的集团实现营收2600.42亿元，同比增长3.55%；归母净利润同比上涨1.66%，增至264.46亿元。8月28日晚间，美的集团发布2026半年报，披露上述信息。 \n 　　美的集团是中国家电龙头企业之一，尤其以白电见长。上半年，美的集团以家电产品为主的智能家居业务录得收入1743.41亿元，同比增长4.27%，在该公司总营收中占比约67%。", "originalSummary": "美的集团的营收、利润同比双增，是国内“白电三巨头”中唯一业绩上扬的企业   \n     \n        \n      2026年8月28日，美的集团发布2026半年报，实现营收2600.42亿元，同比增长3.55%。图：IC photo \n     \n    \n        　　 【财新网】 国内家电大盘收缩， 美的集团 （000333.SZ/ 00300.HK）业绩逆势增长。2026年上半年，美的集团实现营收2600.42亿元，同比增长3.55%；归母净利润同比上涨1.66%，增至264.46亿元。8月28日晚间，美的集团发布2026半年报，披露上述信息。 \n 　　美的集团是中国家电龙头企业之一，尤其以白电见长。上半年，美的集团以家电产品为主的智能家居业务录得收入1743.41亿元，同比增长4.27%，在该公司总营收中占比约67%。", "source": "财新网", "original": "https://www.caixin.com/2026-08-30/102479917.html", "translatedPage": ""}, {"idx": 14, "title": "销量回升未能改善盈利 广汽集团上半年亏损44.7亿元", "originalTitle": "销量回升未能改善盈利 广汽集团上半年亏损44.7亿元", "summary": "广汽集团的销量在上半年逆势同比增长2.35%，拉动营收增长9.4%，但该公司盈利未能同步改善   \n     \n        \n      2026年6月3日，广州，第15届中国（广州）国际金融交易·博览会（金交会）在广交会展馆开幕。广汽集团展位。图：视觉中国 \n     \n    \n        　　 【财新网】 2026年上半年， 广汽集团 （601238.SH/ 02238.HK）的销量逆势回升，拉动营收同比提升9.38%，增至461.21亿元。 \n 　　然而，广汽集团的盈利未能同步改善，归母净亏损同比上升75.98%，扩大至44.67亿元。8月28日晚间，广汽集团发布半年报，披露上述数据。 \n 　　整车制造是广汽集团的核心业务。国内车市在2026年遭遇逆风，据中国汽车工业协会统计，上半年汽车内销同比下滑21.1%，减少至992.1万辆。广汽集团的销量成功突围，在上半年同比增长2.35%，升至77.31万辆；特别是自主品牌销量，同比上涨35.69%，增至34.60万辆。", "originalSummary": "广汽集团的销量在上半年逆势同比增长2.35%，拉动营收增长9.4%，但该公司盈利未能同步改善   \n     \n        \n      2026年6月3日，广州，第15届中国（广州）国际金融交易·博览会（金交会）在广交会展馆开幕。广汽集团展位。图：视觉中国 \n     \n    \n        　　 【财新网】 2026年上半年， 广汽集团 （601238.SH/ 02238.HK）的销量逆势回升，拉动营收同比提升9.38%，增至461.21亿元。 \n 　　然而，广汽集团的盈利未能同步改善，归母净亏损同比上升75.98%，扩大至44.67亿元。8月28日晚间，广汽集团发布半年报，披露上述数据。 \n 　　整车制造是广汽集团的核心业务。国内车市在2026年遭遇逆风，据中国汽车工业协会统计，上半年汽车内销同比下滑21.1%，减少至992.1万辆。广汽集团的销量成功突围，在上半年同比增长2.35%，升至77.31万辆；特别是自 在与ChatGPT展开竞争。鉴于运行此类AI系统成本高昂，苹果最终希望对其收费，或者找到通过将第三方应用程序集成到语音助手中来盈利的方法。但要想让开发者或用户付费，Siri必须克服长期以来运行不稳定且实用性不高的负面评价。目前，Siri AI的早期评价普遍积极。", "originalSummary": "格隆汇8月31日｜美国科技记者古尔曼称，苹果(AAPL.O)今年的产品阵容将包括一系列格外雄心勃勃的设备，这些产品是9月1日即将上任的苹果CEO特努斯几个月来一直在公司内部推动的，其中包括首款折叠屏iPhone，以及一款能够识别说话者身份并根据不同用户调整内容的智能显示屏。古尔曼认为，特努斯面临最大的挑战是如何在人工智能时代延续其数十年的成功。9月份将迎来一场重大考验，届时苹果将全面部署其全新的Siri AI，旨在与ChatGPT展开竞争。鉴于运行此类AI系统成本高昂，苹果最终希望对其收费，或者找到通过将第三方应用程序集成到语音助手中来盈利的方法。但要想让开发者或用户付费，Siri必须克服长期以来运行不稳定且实用性不高的负面评价。目前，Siri AI的早期评价普遍积极。", "source": "格隆汇快讯", "original": "https://www.gelonghui.com/live/2641172", "translatedPage": ""}, {"idx": 19, "title": "2026数博会映照“十五五”数字经济发展新图景", "originalTitle": "2026数博会映照“十五五”数字经济发展新图景", "summary": "2026中国国际大数据产业博览会30日落幕，本届数博会以“词元——数据要素价值释放新路径”为年度主题，聚焦成果展示、行业交流、展产融合，举办各类活动89场，吸引1.6万余名嘉宾注册参会，观展人数超过9万人次。372家中外企业参展，展出新技术、新产品1100余项。机器人冲泡咖啡、大模型推演工厂产销等展示数字技术的时代脉搏。贵州数据宝网络科技有限公司推出词元一体机，并成立专门从事具身智能数据采集的子公司。业内认为，我国数字经济发展逻辑转向聚焦数据要素价值深度释放的精细化阶段。算力是本届数博会的重点展示内容，中科曙光展出十万卡AI超集群曙光8000系列产品。贵阳市入选全国首批新型电力系统建设能力提升试点，重点打造算电协同、数据中心绿电保障示范。数字技术赋能实体经济转型升级，贵阳本土老字号“徐家脆哨”经过数字化改造，破解手工接单出错等问题。中国电建集团贵阳勘测设计研究院有限公司发布城市排水管网诊断AI大模型“城脉·慧诊”，以数智手段破解管网治理痛点。《中国数据产业发展报告（2026）》指出，截至2025年底，中国数据企业达48.2万家，同比增长17.9%。（新华社）", "originalSummary": "2026中国国际大数据产业博览会30日落幕，本届数博会以“词元——数据要素价值释放新路径”为年度主题，聚焦成果展示、行业交流、展产融合，举办各类活动89场，吸引1.6万余名嘉宾注册参会，观展人数超过9万人次。372家中外企业参展，展出新技术、新产品1100余项。机器人冲泡咖啡、大模型推演工厂产销等展示数字技术的时代脉搏。贵州数据宝网络科技有限公司推出词元一体机，并成立专门从事具身智能数据采集的子公司。业内认为，我国数字经济发展逻辑转向聚焦数据要素价值深度释放的精细化阶段。算力是本届数博会的重点展示内容，中科曙光展出十万卡AI超集群曙光8000系列产品。贵阳市入选全国首批新型电力系统建设能力提升试点，重点打造算电协同、数据中心绿电保障示范。数字技术赋能实体经济转型升级，贵阳本土老字号“徐家脆哨”经过数字化改造，破解手工接单出错等问题。中国电建集团贵阳勘测设计研究院有限公司发布城市排水管网诊断AI大模型“城脉·慧诊”，以数智手段破解管网治理痛点。《中国数据产业发展报告（2026）》指出，截至2025年底，中国数据企业达48.2万家，同比增长17.9%。（新华社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421526.shtml", "translatedPage": ""}, {"idx": 20, "title": "德国各界人士看好德中经贸合作前景", "originalTitle": "德国各界人士看好德中经贸合作前景", "summary": "德国政商学界和体育界多名人士日前在德国纽伦堡举行的一场论坛上表示，面对全球经济格局调整和新一轮科技变革，德中经贸合作具有广阔空间。 中国驻法兰克福总领馆与德国乒乓球甲级联赛、德国世界市场领导者学院29日在纽伦堡联合举办乒乓球德国杯暨中德经济论坛。中国驻法兰克福总领事黄昳扬表示，合作需要用信任和信心来培育。只要中德双方不断交流、一起做事情，这份信任就会越来越深，就会对中德合作投下一张“信心票”。 德国经济研究所所长马塞尔·弗拉茨舍尔说，德国要提升竞争力，应重点解决自身问题，而中国始终是德国的重要伙伴。 德国前国防部长鲁道夫·沙尔平表示，中国正成为全球研发、设计和技术创新的重要中心。德国的未来在于合作，尤其是加强与中国的合作。 德国世界市场领导者学院创始人兼院长瓦尔特·多林说，德中两国良性竞争有助于推动双方发展。近年来，越来越多德国企业前往中国实地考察并达成具体合作协议。 中德企业在汽车领域的合作是本次论坛的一项重要议题。欧宝汽车首席执行官兼斯泰兰蒂斯集团德国公司总经理弗洛里安·许特尔表示，对德国车企而言，不应将中国企业单纯视为竞争对手，而应通过发展伙伴关系实现优势互补。 德国乒乓球甲级联赛总经理尼科·施特勒表示，乒乓球是连接德中两国的特殊纽带，希望以此为平台增进双方交流，为德中合作创造更多机遇。(新华社)", "originalSummary": "德国政商学界和体育界多名人士日前在德国纽伦堡举行的一场论坛上表示，面对全球经济格局调整和新一轮科技变革，德中经贸合作具有广阔空间。 中国驻法兰克福总领馆与德国乒乓球甲级联赛、德国世界市场领导者学院29日在纽伦堡联合举办乒乓球德国杯暨中德经济论坛。中国驻法兰克福总领事黄昳扬表示，合作需要用信任和信心来培育。只要中德双方不断交流、一起做事情，这份信任就会越来越深，就会对中德合作投下一张“信心票”。 德国经济研究所所长马塞尔·弗拉茨舍尔说，德国要提升竞争力，应重点解决自身问题，而中国始终是德国的重要伙伴。 德国前国防部长鲁道夫·沙尔平表示，中国正成为全球研发、设计和技术创新的重要中心。德国的未来在于合作，尤其是加强与中国的合作。 德国世界市场领导者学院创始人兼院长瓦尔特·多林说，德中两国良性竞争有助于推动双方发展。近年来，越来越多德国企业前往中国实地考察并达成具体合作协议。 中德企业在汽车领域的合作是本次论坛的一项重要议题。欧宝汽车首席执行官兼斯泰兰蒂斯集团德国公司总经理弗洛里安·许特尔表示，对德国车企而言，不应将中国企业单纯视为竞争对手，而应通过发展伙伴关系实现优势互补。 德国乒乓球甲级联赛总经理尼科·施特勒表示，乒乓球是连接德中两国的特殊纽带，希望以此为平台增进双方交流，为德中合作创造更多机遇。(新华社)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421492.shtml", "translatedPage": ""}, {"idx": 21, "title": "中国驻塞浦路斯大使馆：暂未发现中国公民乘坐涉事渡轮", "originalTitle": "中国驻塞浦路斯大使馆：暂未发现中国公民乘坐涉事渡轮", "summary": "中国驻塞浦路斯大使馆表示，暂未发现有中国籍公民乘坐当天在塞北部海域倾覆的渡轮。一艘载有约270名乘客的渡轮30日下午在塞北部附近海域倾覆。事发海域位于塞浦路斯北部基利尼亚港以北2公里处，海域和港口均位于塞浦路斯土族控制区，出事渡轮原本的目的港是土耳其塔苏科港。（央视新闻）", "originalSummary": "中国驻塞浦路斯大使馆表示，暂未发现有中国籍公民乘坐当天在塞北部海域倾覆的渡轮。一艘载有约270名乘客的渡轮30日下午在塞北部附近海域倾覆。事发海域位于塞浦路斯北部基利尼亚港以北2公里处，海域和港口均位于塞浦路斯土族控制区，出事渡轮原本的目的港是土耳其塔苏科港。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421197.shtml", "translatedPage": ""}, {"idx": 22, "title": "特斯拉在中国香港、中国澳门推出更平价版Model 3", "originalTitle": "特斯拉在中国香港、中国澳门推出更平价版Model 3", "summary": "特斯拉已正式在中国香港、中国澳门市场推出配置简化、售价更低的Model 3轿车版本。根据特斯拉官网信息，这款新车型在中国香港的起售价为20.5万港元（约合26150美元），比此前在售的基础版车型售价降低8.5%；在中国澳门的起售价为25.2万澳门元（约合31200美元）。该版本对部分内外饰配置进行了删减或降级，调整范围涵盖氛围灯、内饰纺织面料、轮毂等部件，同时官方标称的单次充电最大续航里程提升至572公里。（财联社）", "originalSummary": "特斯拉已正式在中国香港、中国澳门市场推出配置简化、售价更低的Model 3轿车版本。根据特斯拉官网信息，这款新车型在中国香港的起售价为20.5万港元（约合26150美元），比此前在售的基础版车型售价降低8.5%；在中国澳门的起售价为25.2万澳门元（约合31200美元）。该版本对部分内外饰配置进行了删减或降级，调整范围涵盖氛围灯、内饰纺织面料、轮毂等部件，同时官方标称的单次充电最大续航里程提升至572公里。（财联社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421072.shtml", "translatedPage": ""}, {"idx": 23, "title": "美国发射罗曼空间望远镜", "originalTitle": "美国发射罗曼空间望远镜", "summary": "美国航空航天局新一代空间望远镜——南希·格蕾丝·罗曼空间望远镜30日搭乘美国太空探索技术公司的“猎鹰”重型运载火箭升空，旨在助力科学家探索暗物质、暗能量、系外行星等宇宙奥秘。 美国东部时间30日7时26分（北京时间30日19时26分），搭载罗曼空间望远镜的“猎鹰”重型运载火箭从佛罗里达州肯尼迪航天中心发射升空。随后火箭一二级分离，火箭第二级继续飞行，将罗曼空间望远镜送入预定轨道。火箭的两枚侧助推器也成功实现陆地回收。 据美航空航天局介绍，罗曼空间望远镜以该机构首任首席天文学家的名字命名，其主镜直径约2.4米，与美航空航天局的哈勃空间望远镜相当，但视场可达后者的100倍以上。罗曼空间望远镜将借助其宽视场仪器和日冕仪开展大规模巡天观测。 按计划，罗曼空间望远镜将前往距离地球约150万公里的日地拉格朗日L2点展开观测，该点位于地球背向太阳一侧的引力平衡位置，罗曼空间望远镜将获得比哈勃等近地轨道望远镜更为开阔的视野。 美航空航天局表示，罗曼空间望远镜的设计运行时间为5年，可支持额外5年的延期任务，其拍摄的首批科学图像预计将于2027年初发布。(新华社)", "originalSummary": "美国航空航天局新一代空间望远镜——南希·格蕾丝·罗曼空间望远镜30日搭乘美国太空探索技术公司的“猎鹰”重型运载火箭升空，旨在助力科学家探索暗物质、暗能量、系外行星等宇宙奥秘。 美国东部时间30日7时26分（北京时间30日19时26分），搭载罗曼空间望远镜的“猎鹰”重型运载火箭从佛罗里达州肯尼迪航天中心发射升空。随后火箭一二级分离，火箭第二级继续飞行，将罗曼空间望远镜送入预定轨道。火箭的两枚侧助推器也成功实现陆地回收。 据美航空航天局介绍，罗曼空间望远镜以该机构首任首席天文学家的名字命名，其主镜直径约2.4米，与美航空航天局的哈勃空间望远镜相当，但视场可达后者的100倍以上。罗曼空间望远镜将借助其宽视场仪器和日冕仪开展大规模巡天观测。 按计划，罗曼空间望远镜将前往距离地球约150万公里的日地拉格朗日L2点展开观测，该点位于地球背向太阳一侧的引力平衡位置，罗曼空间望远镜将获得比哈勃等近地轨道望远镜更为开阔的视野。 美航空航天局表示，罗曼空间望远镜的设计运行时间为5年，可支持额外5年的延期任务，其拍摄的首批科学图像预计将于2027年初发布。(新华社)", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679420814.shtml", "translatedPage": ""}, {"idx": 24, "title": "西藏吉隆抢险救援工作持续推进", "originalTitle": "西藏吉隆抢险救援工作持续推进", "summary": "西藏日喀则市吉隆县泥石流灾害救援工作持续推进。截至29日18时，灾害已造成16人遇难，546人失联。目前，抢险救援救灾各项工作仍在紧张有序推进。今天举行的西藏吉隆“8·26”泥石流灾害新闻发布会介绍了此次灾害抢险救灾工作的最新进展。目前，已动员组织解放军、武警部队、中国消防救援队、边防、公安以及中国安能等各方救援力量2141人，调派救援车辆269辆、救援装备3922套。救援力量正“水陆空”三路并进，全力挺进受灾核心区。（央视新闻）", "originalSummary": "西藏日喀则市吉隆县泥石流灾害救援工作持续推进。截至29日18时，灾害已造成16人遇难，546人失联。目前，抢险救援救灾各项工作仍在紧张有序推进。今天举行的西藏吉隆“8·26”泥石流灾害新闻发布会介绍了此次灾害抢险救灾工作的最新进展。目前，已动员组织解放军、武警部队、中国消防救援队、边防、公安以及中国安能等各方救援力量2141人，调派救 局长被曝访俄期间提议举行美俄乌三方峰会", "summary": "美国中央情报局局长拉特克利夫日前访问俄罗斯时，提议举行由美国总统特朗普、俄罗斯总统普京和乌克兰总统泽连斯基参加的三方会晤，以推动结束俄乌战事。两名知情人士称，拉特克利夫此次访俄的目的之一，是评估俄情报部门负责人能否说服普京同意恢复由美国斡旋的俄乌谈判。拉特克利夫25日突访俄罗斯，分别会见俄罗斯对外情报局局长谢尔盖·纳雷什金和联邦安全局局长亚历山大·博尔特尼科夫，并向俄方提议重启和平谈判。泽连斯基28日通过美方官员得知拉特克利夫访俄情况及有关举行三方会晤的提议。（央视新闻）", "originalSummary": "美国中央情报局局长拉特克利夫日前访问俄罗斯时，提议举行由美国总统特朗普、俄罗斯总统普京和乌克兰总统泽连斯基参加的三方会晤，以推动结束俄乌战事。两名知情人士称，拉特克利夫此次访俄的目的之一，是评估俄情报部门负责人能否说服普京同意恢复由美国斡旋的俄乌谈判。拉特克利夫25日突访俄罗斯，分别会见俄罗斯对外情报局局长谢尔盖·纳雷什金和联邦安全局局长亚历山大·博尔特尼科夫，并向俄方提议重启和平谈判。泽连斯基28日通过美方官员得知拉特克利夫访俄情况及有关举行三方会晤的提议。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421264.shtml", "translatedPage": ""}, {"idx": 55, "title": "报告称AI公司每赚100美元近40美元流向云巨头", "originalTitle": "报告称AI公司每赚100美元近40美元流向云巨头", "summary": "英国巴克莱银行日前在一份有关AI行业的研究报告中指出，AI模型公司每获得100美元收入，其中约有35至40美元会以推理算力费用的形式流向三大云巨头，即亚马逊云科技公司、微软旗下Azure云服务平台和谷歌云平台。云服务商从中能够获得约10至20美元的营业利润，对应高达35%至45%的营业利润率。与此同时，AI实验室付费推理业务的利润率已经大幅攀升，从2025年的低双位数水平升至2026年的50%至65%甚至更高，调整后毛利率同比提升30至50个百分点。巴克莱分析师认为，实际利润率或高于报告中的估算，但随着前沿模型竞争加剧以及算力供给持续增加，利润率预计将逐步回落。（人民财讯）", "originalSummary": "英国巴克莱银行日前在一份有关AI行业的研究报告中指出，AI模型公司每获得100美元收入，其中约有35至40美元会以推理算力费用的形式流向三大云巨头，即亚马逊云科技公司、微软旗下Azure云服务平台和谷歌云平台。云服务商从中能够获得约10至20美元的营业利润，对应高达35%至45%的营业利润率。与此同时，AI实验室付费推理业务的利润率已经大幅攀升，从2025年的低双位数水平升至2026年的50%至65%甚至更高，调整后毛利率同比提升30至50个百分点。巴克莱分析师认为，实际利润率或高于报告中的估算，但随着前沿模型竞争加剧以及算力供给持续增加，利润率预计将逐步回落。（人民财讯）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679421164.shtml", "translatedPage": ""}, {"idx": 56, "title": "西藏吉隆口岸首个紧邻国门的应急基站开通投用", "originalTitle": "西藏吉隆口岸首个紧邻国门的应急基站开通投用", "summary": "记者从西藏自治区通信管理局了解到，吉隆口岸首个紧邻国门的应急基站开通投用。通信抢修人员通过距吉隆口岸热索桥约1.6公里左右新建的基站与在口岸的救援队员完成通话。截至目前，西藏电信企业已抢通修复1个基站，新增8个基站，其中吉隆县至吉隆镇方向新建2个基站、吉隆镇至吉隆口岸方向新建6个基站。（央视新闻）", "originalSummary": "记者从西藏自治区通信管理局了解到，吉隆口岸首个紧邻国门的应急基站开通投用。通信抢修人员通过距吉隆口岸热索桥约1.6公里左右新建的基站与在口岸的救援队员完成通话。截至目前，西藏电信企业已抢通修复1个基站，新增8个基站，其中吉隆县至吉隆镇方向新建2个基站、吉隆镇至吉隆口岸方向新建6个基站。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679420827.shtml", "translatedPage": ""}, {"idx": 57, "title": "塞浦路斯渡轮倾覆事故已有159人获救 至少6人死亡", "originalTitle": "塞浦路斯渡轮倾覆事故已有159人获救 至少6人死亡", "summary": "当地时间8月30日，塞浦路斯北部杰尔尼市市长辛库尔表示，当天早些时候在该市北部海面倾覆的渡轮上已有159人获救。事故已造成至少6人死亡，目前搜救行动仍在进行中。据悉，事发渡轮上共载有259名乘客和8名船员。事发海域位于塞浦路斯北部基利尼亚港以北2公里处，海域和港口均位于塞浦路斯土族控制区，出事渡轮原本的目的港是土耳其塔苏科港。（央视新闻）", "originalSummary": "当地时间8月30日，塞浦路斯北部杰尔尼市市长辛库尔表示，当天早些时候在该市北部海面倾覆的渡轮上已有159人获救。事故已造成至少6人死亡，目前搜救行动仍在进行中。据悉，事发渡轮上共载有259名乘客和8名船员。事发海域位于塞浦路斯北部基利尼亚港以北2公里处，海域和港口均位于塞浦路斯土族控制区，出事渡轮原本的目的港是土耳其塔苏科港。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679420748.shtml", "translatedPage": ""}, {"idx": 58, "title": "西藏吉隆口岸通信信号抢通", "originalTitle": "西藏吉隆口岸通信信号抢通", "summary": "西藏自治区通信管理局局长尼玛多吉30日18时告诉新华社记者，其所处位置距离吉隆口岸热索桥约1.6公里，通过道路抢修最前端新建的基站已与在口岸的救援队员完成通话，信号已经能够送达核心救援现场。30日13时30分，吉隆口岸首个紧邻国门的应急基站开通投用。截至目前，西藏电信企业已抢通修复1个基站，新增8个基站，其中吉隆县至吉隆镇方向新建2个基站、吉隆镇至吉隆口岸方向新建6个基站。（新华社）", "originalSummary": "西藏自治区通信管理局局长尼玛多吉30日18时告诉新华社记者，其所处位置距离吉隆口岸热索桥约1.6公里，通过道路抢修最前端新建的基站已与在口岸的救援队员完成通话，信号已经能够送达核心救援现场。30日13时30分，吉隆口岸首个紧邻国门的应急基站开通投用。截至目前，西藏电信企业已抢通修复1个基站，新增8个基站，其中吉隆县至吉隆镇方向新建2个基站、吉隆镇至吉隆口岸方向新建6个基站。（新华社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679420010.shtml", "translatedPage": ""}, {"idx": 59, "title": "多地宣布：生物、地理不再计入中考总分", "originalTitle": "多地宣布：生物、地理不再计入中考总分", "summary": "为优化考试评价，减轻学生课业负担，经调研论证，决定对中考部分事项进行调整。自2026年秋季学期八年级（初二）学生起，将生物学、地理、历史等3个科目，由考试科目调整为考查科目，考试结果以等级形式呈现，不计入中考总分，其他事项不变。（央视新闻）", "originalSummary": "为优化考试评价，减轻学生课业负担，经调研论证，决定对中考部分事项进行调整。自2026年秋季学期八年级（初二）学生起，将生物学、地理、历史等3个科目，由考试科目调整为考查科目，考试结果以等级形式呈现，不计入中考总分，其他事项不变。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679419924.shtml", "translatedPage": ""}, {"idx": 60, "title": "自然资源部：全面启动吉隆泥石流灾害区域风险隐患排查", "originalTitle": "自然资源部：全面启动吉隆泥石流灾害区域风险隐患排查", "summary": "记者今天（30日）从自然资源部了解到，目前自然资源部已全面启动吉隆泥石流灾害区域风险隐患排查工作，初步判定8处地质灾害高风险点。自然资源部表示，目前正持续调集专业技术力量，重点针对冰崩源区、堰塞湖、沟道沿线及流域周边，分区域对灾害影响范围实施应急测绘和风险隐患调查，并对应急救援通道、周边村庄和安置点等重点区域加强地质灾害巡查排查。前后方专家结合遥感解译和现场调查，在灾害影响区共解译出地质灾害隐患点60余处，初步判定高风险8处。自然资源部建议在搜救期间以无人机航测结合人工巡视的方式进行监测，并要求进一步加强泥石流物源区风险监测，对泥石流途径沟道铲刮导致的崩塌、滑坡隐患持续开展风险研判和监测预警。（央视新闻）", "originalSummary": "记者今天（30日）从自然资源部了解到，目前自然资源部已全面启动吉隆泥石流灾害区域风险隐患排查工作，初步判定8处地质灾害高风险点。自然资源部表示，目前正持续调集专业技术力量，重点针对冰崩源区、堰塞湖、沟道沿线及流域周边，分区域对灾害影响范围实施应急测绘和风险隐患调查，并对应急救援通道、周边村庄和安置点等重点区域加强地质灾害巡查排查。前后方专家结合遥感解译和现场调查，在灾害影响区共解译出地质灾害隐患点60余处，初步判定高风险8处。自然资源部建议在搜救期间以无人机航测结合人工巡视的方式进行监测，并要求进一步加强泥石流物源区风险监测，对泥石流途径沟道铲刮导致的崩塌、滑坡隐患持续开展风险研判和监测预警。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679419895.shtml", "translatedPage": ""}, {"idx": 61, "title": "塞浦路斯一艘载有约270名乘客的渡轮倾覆", "originalTitle": "塞浦路斯一艘载有约270名乘客的渡轮倾覆", "summary": "总台记者获悉，当地时间8月30日，塞浦路斯一艘载有约270名乘客的渡轮倾覆，人员伤亡情况不明。（央视新闻）", "originalSummary": "总台记者获悉，当地时间8月30日，塞浦路斯一艘载有约270名乘客的渡轮倾覆，人员伤亡情况不明。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679419894.shtml", "translatedPage": ""}, {"idx": 62, "title": "四川长虹：推出RGB MiniLED电视产品矩阵", "originalTitle": "四川长虹：推出RGB MiniLED电视产品矩阵", "summary": "8月30日，四川长虹在成都举办2026新品发布会，旗下长虹电视推出AI TV RGB MiniLED产品矩阵，包括旗舰机型金标T70S、追光Q60S Pro、D7S Ultra等新品，新品搭载了行业首个AI运动平台“长虹乐动”。", "originalSummary": "8月30日，四川长虹在成都举办2026新品发布会，旗下长虹电视推出AI TV RGB MiniLED产品矩阵，包括旗舰机型金标T70S、追光Q60S Pro、D7S Ultra等新品，新品搭载了行业首个AI运动平台“长虹乐动”。", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679419856.shtml", "translatedPage": ""}, {"idx": 63, "title": "欧盟天然气储备或降至13年来最低", "originalTitle": "欧盟天然气储备或降至13年来最低", "summary": "据英国方面29日消息，8月最后一周欧盟天然气储备量仅为63%，远低于近年同期约80%的平均水平。有专家分析指出，按照目前的情况，预计在进入冬季供暖季时，欧盟天然气储备可能将降至2013年以来的最低水平。据悉，美国和以色列对伊朗发动战事导致海湾地区能源出口受阻，欧盟天然气储备已经难以达到冬季开始前储备80%这一目标。而去年冬季末的严寒，以及今年夏季欧洲热浪期间天然气发电量增多，也造成欧盟天然气储备加速消耗。（央视新闻）", "originalSummary": "据英国方面29日消息，8月最后一周欧盟天然气储备量仅为63%，远低于近年同期约80%的平均水平。有专家分析指出，按照目前的情况，预计在进入冬季供暖季时，欧盟天然气储备可能将降至2013年以来的最低水平。据悉，美国和以色列对伊朗发动战事导致海湾地区能源出口受阻，欧盟天然气储备已经难以达到冬季开始前储备80%这一目标。而去年冬季末的严寒，以及今年夏季欧洲热浪期间天然气发电量增多，也造成欧盟天然气储备加速消耗。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260830/c679419717.shtml", "translatedPage": ""}, {"idx": 64, "title": "美军夜袭伊朗
