: "8月29日，南京住房公积金管理中心发布通知，进一步扩大住房公积金异地贷款范围。通知全文：为更好发挥住房公积金制度作用，进一步满足购房人跨区域住房消费需求，现将住房公积金异地贷款范围扩展至全国。全国范围内的住房公积金缴存人，在南京市购房均可向南京住房公积金管理中心申请住房公积金贷款。本通知自2026年9月1日起施行。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415562.shtml", "translatedPage": ""}, {"idx": 26, "title": "上海电气与巴斯夫集团共商绿色低碳合作", "originalTitle": "上海电气与巴斯夫集团共商绿色低碳合作", "summary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "originalSummary": "上海电气消息，当地时间8月27日上午，上海电气集团党委书记、董事长吴磊带队赴德国拜访巴斯夫集团，与巴斯夫全球采购部总裁马蒂亚斯·多恩举行会谈，双方围绕“双碳”目标下能源转型、绿色技术创新、产业链协同等深入交换意见。", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415552.shtml", "translatedPage": ""}, {"idx": 27, "title": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "originalTitle": "尼日尔首都发生激烈枪战 我使馆提醒在尼同胞远离危险区域", "summary": "当地时间8月29日凌晨起，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声，密集交火一直持续至天明。中国驻尼日尔大使馆对此发布安全提醒。我使馆提醒中国公民和在尼侨胞密切关注安全形势，提高安全警惕，加强安防意识，提升安保措施，做好应急储备，减少非必要外出，在公共场所切勿过多停留，避免夜间出行和单独行动，远离危险敏感区域。中资企业应切实加强安全措施，做好应急预案，在确保安全前提下开展工作，坚决杜绝户外高风险作业，确保员工人身安全和企业财产安全。（央视新闻）", "originalSummary": "当地时间8月29日凌晨起，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声，密集交火一直持续至天明。中国驻尼日尔大使馆对此发布安全提醒。我使馆提醒中国公民和在尼侨胞密切关注安全形势，提高安全警惕，加强安防意识，提升安保措施，做好应急储备，减少非必要外出，在公共场所切勿过多停留，避免夜间出行和单独行动，远离危险敏感区域。中资企业应切实加强安全措施，做好应急预案，在确保安全前提下开展工作，坚决杜绝户外高风险作业，确保员工人身安全和企业财产安全。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415542.shtml", "translatedPage": ""}, {"idx": 28, "title": "大港油田储气库群周期注气量突破20亿立方米，再创历史新高", "originalTitle": "大港油田储气库群周期注气量突破20亿立方米，再创历史新高", "summary": "据大港油田天津储气库分公司消息，截至目前，大港油田储气库群本轮注气周期累计注气量已超过20亿立方米，完成整体注气计划的90%，较去年同期增长8%，周期注气量再度刷新历史纪录，为京津冀地区冬季天然气保供蓄足“底气”。", "originalSummary": "据大港油田天津储气库分公司消息，截至目前，大港油田储气库群本轮注气周期累计注气量已超过20亿立方米，完成整体注气计划的90%，较去年同期增长8%，周期注气量再度刷新历史纪录，为京津冀地区冬季天然气保供蓄足“底气”。", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415525.shtml", "translatedPage": ""}, {"idx": 29, "title": "多项前沿技术成果在甬舟铁路金塘海底隧道应用", "originalTitle": "多项前沿技术成果在甬舟铁路金塘海底隧道应用", "summary": "在中铁十四局集团有限公司的介绍中，记者29日了解到，在甬舟铁路金塘海底隧道建设现场，多项盾构前沿技术成果得到应用，覆盖智能掘进、智能装备等关键环节，推动这条世界最长海底高铁隧道建设向无人化、智能化方向发展。金塘海底隧道是甬舟铁路全线控制性工程，西起宁波北仑、东至舟山金塘，全长16.18公里，其中盾构段长11.21公里，采用两台超大直径盾构机分别从宁波、舟山两侧相向掘进，最终在海底实现高精度对接。面对超深高水压、复杂地层等极端工况，建设团队在施工中应用多项国产自主研发前沿技术。（新华社）", "originalSummary": "在中铁十四局集团有限公司的介绍中，记者29日了解到，在甬舟铁路金塘海底隧道建设现场，多项盾构前沿技术成果得到应用，覆盖智能掘进、智能装备等关键环节，推动这条世界最长海底高铁隧道建设向无人化、智能化方向发展。金塘海底隧道是甬舟铁路全线控制性工程，西起宁波北仑、东至舟山金塘，全长16.18公里，其中盾构段长11.21公里，采用两台超大直径盾构机分别从宁波、舟山两侧相向掘进，最终在海底实现高精度对接。面对超深高水压、复杂地层等极端工况，建设团队在施工中应用多项国产自主研发前沿技术。（新华社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415502.shtml", "translatedPage": ""}, {"idx": 30, "title": "尼日尔军政府发布声明呼吁民众保持冷静", "originalTitle": "尼日尔军政府发布声明呼吁民众保持冷静", "summary": "当地时间8月29日8时许，尼日尔保卫祖国国家委员会发布官方海报及声明，表示国防与安全部队已全面动员保卫祖国。声明呼吁广大民众面对当前突发事件保持冷静、团结与警惕，切勿传播未经证实的信息。当天凌晨1时左右，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声。武装分子针对迪奥里·哈马尼国际机场、101空军基地展开袭击，并试图强行突破总统府周边的安全警戒线，密集交火一直持续至天明。当天9时左右，尼日尔国家电视台信号突然中断。目前，首都安全局势仍不稳定。（央视新闻）", "originalSummary": "当地时间8月29日8时许，尼日尔保卫祖国国家委员会发布官方海报及声明，表示国防与安全部队已全面动员保卫祖国。声明呼吁广大民众面对当前突发事件保持冷静、团结与警惕，切勿传播未经证实的信息。当天凌晨1时左右，尼日尔首都尼亚美多个核心区域传出剧烈枪炮与爆炸声。武装分子针对迪奥里·哈马尼国际机场、101空军基地展开袭击，并试图强行突破总统府周边的安全警戒线，密集交火一直持续至天明。当天9时左右，尼日尔国家电视台信号突然中断。目前，首都安全局势仍不稳定。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415497.shtml", "translatedPage": ""}, {"idx": 31, "title": "乌称基辅近郊遭无人机袭击 已致27人遇难", "originalTitle": "乌称基辅近郊遭无人机袭击 已致27人遇难", "summary": "当地时间8月29日，乌克兰总统泽连斯基通报，基辅近郊米拉村自昨夜起持续遭遇俄军无人机袭击，目前各项善后处置工作正在有序推进。此次袭击击中村内一处仓库并引发爆炸，造成大量人员伤亡和基础设施损毁。截至目前，本次袭击已造成27人遇难、数十人受伤，超370名民众完成紧急疏散，相关疏散工作仍在持续推进。乌方表示，按照规定，弹药禁止存放于居民区及民用建筑周边，后续将依据调查结论，对相关决策及履职失职人员依法追责。据悉，乌克兰总理、内务部长已就本次袭击事件完成专项工作汇报。（央视新闻）", "originalSummary": "当地时间8月29日，乌克兰总统泽连斯基通报，基辅近郊米拉村自昨夜起持续遭遇俄军无人机袭击，目前各项善后处置工作正在有序推进。此次袭击击中村内一处仓库并引发爆炸，造成大量人员伤亡和基础设施损毁。截至目前，本次袭击已造成27人遇难、数十人受伤，超370名民众完成紧急疏散，相关疏散工作仍在持续推进。乌方表示，按照规定，弹药禁止存放于居民区及民用建筑周边，后续将依据调查结论，对相关决策及履职失职人员依法追责。据悉，乌克兰总理、内务部长已就本次袭击事件完成专项工作汇报。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679415491.shtml", "tran 仪式按惯例不安排政治人物演讲而改赴五角大楼的报道，痛批《纽约时报》记者玛吉·哈伯曼捏造消息。   4.  批评纽约州州长霍赫尔“站在加拿大一边” ——特朗普批评纽约州州长霍赫尔“站在加拿大一边”，不愿使用“美国湖”这一名称、“宁愿让加拿大赢”，并力挺布莱克曼成为纽约州下一任州长。   5.  悼念挪威国王哈拉尔 ——特朗普发文称：听到挪威国王哈拉尔逝世的消息，我们深感悲痛。他是一位坚强、自豪且备受尊敬的人。他热爱自己的国家，也深受人民的爱戴和尊敬。在这一艰难时刻，我们的心与挪威王室及全体挪威人民同在。这真是一个巨大的损失。   6.  纽约“封口费”案移交联邦法院的请求被驳回 ——美国联邦法官驳回特朗普将纽约“封口费”案移交联邦法院的请求。法官认定案件涉及特朗普个人行为，不适用总统豁免权。特朗普方面表示将提出上诉。   7.  美政府就邮寄投票新规被叫停正式提起上诉 ——当地时间8月28日，特朗普政府当日正式就一项阻止其邮寄投票行政令生效的联邦法院裁决提起上诉。波士顿联邦地区法官英迪拉·塔尔瓦尼于8月27日晚签发一项为期14天的临时限制令，暂停美国邮政署执行相关邮寄投票新规，并定于9月3日举行听证会，考虑是否实施更长期的禁令。", "originalSummary": "1.  宣布获得逾650亿桶委石油储量“多数控制权” ——特朗普28日在社交媒体发文宣布，美国已与委内瑞拉达成协议，获得对委内瑞拉已探明石油储量中逾650亿桶的“多数控制权”。特朗普说，这一交易“将使美国石油储备增加一倍以上，大幅提高石油供应，并在未来很长时间显著降低美国汽油价格”。   2.  签署行政令创建美国太空学院 ——特朗普签署行政令，启动创建“美国太空学院”的程序，称该学院将同时服务于美国太空军、美国航空航天局（NASA）和民用航天产业，并将以西点军校和美国海军学院等军事院校为参照，“吸引、培养并让美国最优秀的人才毕业”。   3.  否认因无法演讲而改赴五角大楼 ——特朗普否认因纽约世贸中心“9·11”纪念仪式按惯例不安排政治人物演讲而改赴五角大楼的报道，痛批《纽约时报》记者玛吉·哈伯曼捏造消息。   4.  批评纽约州州长霍赫尔“站在加拿大一边” ——特朗普批评纽约州州长霍赫尔“站在加拿大一边”，不愿使用“美国湖”这一名称、“宁愿让加拿大赢”，并力挺布莱克曼成为纽约州下一任州长。   5.  悼念挪威国王哈拉尔 ——特朗普发文称：听到挪威国王哈拉尔逝世的消息，我们深感悲痛。他是一位坚强、自豪且备受尊敬的人。他热爱自己的国家，也深受人民的爱戴和尊敬。在这一艰难时刻，我们的心与挪威王室及全体挪威人民同在。这真是一个巨大的损失。   6.  纽约“封口费”案移交联邦法院的请求被驳回 ——美国联邦法官驳回特朗普将纽约“封口费”案移交联邦法院的请求。法官认定案件涉及特朗普个人行为，不适用总统豁免权。特朗普方面表示将提出上诉。   7.  美政府就邮寄投票新规被叫停正式提起上诉 ——当地时间8月28日，特朗普政府当日正式就一项阻止其邮寄投票行政令生效的联邦法院裁决提起上诉。波士顿联邦地区法官英迪拉·塔尔瓦尼于8月27日晚签发一项为期14天的临时限制令，暂停美国邮政署执行相关邮寄投票新规，并定于9月3日举行听证会，考虑是否实施更长期的禁令。", "source": "金十数据", "original": "", "translatedPage": ""}, {"idx": 36, "title": "Nike hires former Foot Locker exec to lead Converse brand: Bloomberg", "originalTitle": "Nike hires former Foot Locker exec to lead Converse brand: Bloomberg", "summary": "", "originalSummary": "", "source": "Seeking Alpha", "original": "https://seekingalpha.com/news/4638038-nike-hires-former-foot-locker-exec-run-converse?utm_source=feed_news_all&utm_medium=referral&feed_item_type=news", "translatedPage": ""}, {"idx": 37, "title": "Nvidia and SpaceX form heavenly relationship with plan to launch Vera into orbit", "originalTitle": "Nv function fmtBeijing(iso, opts){try{const dt=new Date(iso);const o=Object.assign({timeZone:'Asia/Shanghai',hour12:false},opts||{});return new Intl.DateTimeFormat('zh-CN',o).format(dt);}catch(e){return iso;}}
function truncate(s,n){const arr=Array.from(s||'');if(arr.length<=n)return s||'';return arr.slice(0,n-1).join('')+'…';}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){try{const p=new URL(u,location.href).protocol;return (p==='http:'||p==='https:')?u:'#';}catch(e){return '#';}}

  document.getElementById('heroWindow').textContent='收录窗口：'+fmtBeijing(meta.windowStart,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' — '+fmtBeijing(meta.windowEnd,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+'（北京时间，过去 24 小时）';

    return '<span class="quote '+cls+'"><span class="qn">'+esc(q.name)+'</span><span class="qp">'+q.price+'</span><span class="qc">'+sign+q.pct.toFixed(2)+'%</span></span>';
  }).join('');
  let st='<div class="stat total"><div class="num">'+meta.total+'</div><div class="lbl">总条数</div></div>';

  document.getElementById('heroStats').innerHTML=st;

  let main='';sections.forEach((s,i)=>{main+='<section class="section" id="sec-'+i+'"><div class="section-head"><h2>'+esc(s.label)+'</h2><span class="count">'+s.items.length+' 条</span></div><div class="grid">';
    s.items.forEach(it=>{const orig=safeUrl(it.original||'#');const tp=safeUrl(it.translatedPage||'');
