资的新方向。上半年，卫生和社会工作、批发和零售业、住宿和餐饮业新设外商投资企业增速分别为27.1%、11.9%和11.7%，中国庞大市场对外资吸引力持续提升。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679414348.shtml", "translatedPage": ""}, {"idx": 39, "title": "贵州省副省长罗强：贵州总算力规模突破176EFLOPS，智算占比超98%", "originalTitle": "贵州省副省长罗强：贵州总算力规模突破176EFLOPS，智算占比超98%", "summary": "在2026中国国际大数据产业博览会“高质量数据集和数据标注主题交流活动”上，贵州省副省长罗强表示，贵州在建及投运的数据中心已经达到50个，算力总规模达到176EFLOPS，智算的占比超过了98%，集聚数据标注的企业达到135家，从事数据标注人员超过1.6万人。（财联社）", "originalSummary": "在2026中国国际大数据产业博览会“高质量数据集和数据标注主题交流活动”上，贵州省副省长罗强表示，贵州在建及投运的数据中心已经达到50个，算力总规模达到176EFLOPS，智算的占比超过了98%，集聚数据标注的企业达到135家，从事数据标注人员超过1.6万人。（财联社）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679414302.shtml", "translatedPage": ""}, {"idx": 40, "title": "水利部：普热普强藏布堰塞湖水面面积继续减小", "originalTitle": "水利部：普热普强藏布堰塞湖水面面积继续减小", "summary": "受8月26日尼泊尔一侧发生泥石流灾害影响，尼泊尔错坚河汇入我国境内普热普强藏布的交汇处附近形成堰塞湖。记者今天（29日）从水利部了解到，根据8月29日7时38分的卫星遥感影像，普热普强藏布堰塞湖水面面积9.9万平方米，比28日12时减小0.5万平方米，比27日减少了2.1万平方米，这意味着堰塞体正在缓慢过流，水量逐渐减少。（央视新闻）", "originalSummary": "受8月26日尼泊尔一侧发生泥石流灾害影响，尼泊尔错坚河汇入我国境内普热普强藏布的交汇处附近形成堰塞湖。记者今天（29日）从水利部了解到，根据8月29日7时38分的卫星遥感影像，普热普强藏布堰塞湖水面面积9.9万平方米，比28日12时减小0.5万平方米，比27日减少了2.1万平方米，这意味着堰塞体正在缓慢过流，水量逐渐减少。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679414293.shtml", "translatedPage": ""}, {"idx": 41, "title": "四川多地强降雨，提前避险转移45001人", "originalTitle": "四川多地强降雨，提前避险转移45001人", "summary": "记者从四川省地质灾害防治指挥部办公室获悉，8月28日8时至8月29日8时，四川乐山市、宜宾市、泸州市、资阳市、自贡市、广元市、广安市、雅安市、眉山市等地降大到暴雨，局部大暴雨，最大降雨为乐山市沐川县桃花站185毫米。强降雨未引发地质灾害。到今天（29日）7时，24小时内四川17个市（州）87个县（市、区）共提前转移避险45001人（其中比较多的有：雅安14601人、宜宾8728人、凉山5338人）。至此，入汛以来四川全省共提前转移避险121.47万人次。（央视新闻）", "originalSummary": "记者从四川省地质灾害防治指挥部办公室获悉，8月28日8时至8月29日8时，四川乐山市、宜宾市、泸州市、资阳市、自贡市、广元市、广安市、雅安市、眉山市等地降大到暴雨，局部大暴雨，最大降雨为乐山市沐川县桃花站185毫米。强降雨未引发地质灾害。到今天（29日）7时，24小时内四川17个市（州）87个县（市、区）共提前转移避险45001人（其中比较多的有：雅安14601人、宜宾8728人、凉山5338人）。至此，入汛以来四川全省共提前转移避险121.47万人次。（央视新闻）", "source": "同花顺快讯", "original": "https://news.10jqka.com.cn/20260829/c679414274.shtml", "translatedPa
