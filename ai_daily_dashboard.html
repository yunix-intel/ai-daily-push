const DATA = {"meta": {"date": "2026-08-30", "windowStart": "2026-08-29T00:00:00.000Z", "windowEnd": "2026-08-30T00:00:00.000Z", "generatedAt": "2026-08-30T00:01:38.931Z", "total": 32, "source": {"name": "AIHOT", "url": "https://aihot.virxact.com/daily/2026-08-30"}, "dailyUrl": "https://aihot.virxact.com/daily/2026-08-30"}, "sections": [{"label": "📊 行业趋势", "items": [{"idx": 1, "title": "在本地运行 Qwen3.8 27B ：来自我的 Mac Studio 的实际数据", "originalTitle": "在本地运行 Qwen3.8 27B：来自我的 Mac Studio 的实际数据", "summary": "Qwen3.8 27B （ 27.3B 参数，混合注意力架构 ， 262,144令牌上下文窗口， Apache 2.0 开源）在 Mac Studio M3 Ultra 上经 Ollama 以 Q4_K_M 量化（ 17GB ）生成速度约 14令牌/秒。", "originalSummary": "Qwen3.8 27B（27.3B 参数，混合注意力架构，262,144 token 上下文窗口，Apache 2.0 开源）在 Mac Studio M3 Ultra 上经 Ollama 以 Q4_K_M 量化（17GB）生成速度约 14 tokens/s。", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "original": "https://terminalbytes.com/run-qwen-3-8-27b-locally", "aihot": "https://aihot.virxact.com/items/cmte242e701jdrog2vz9p2cy4", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fterminalbytes.com%2Frun-qwen-3-8-27b-locally"}, {"idx": 2, "title": "VentureBeat任命Rob Strechay为其首位首席分析师，扩大其企业人工智能研究推动力", "originalTitle": "VentureBeat names Rob Strechay as its first Lead Analyst, expanding its enterprise AI research push", "summary": "直到最近， CUBE Research的董事总经理兼首席分析师Rob Strechay才加入VentureBeat ，担任我们的第一位首席分析师和VentureBeat Research的创始分析师。他的到来是VentureBeat向更深层次的专业化迈进的下一步：为评估、购买和部署企业AI的技术决策者（董事、副总裁、首席信息官和首席技术官）构建的分析。企业AI堆栈正在实时重写，", "originalSummary": "Rob Strechay, until recently managing director and principal analyst at theCUBE Research, has joined VentureBeat as our first Lead Analyst and a founding analyst of VentureBeat Research. His arrival is the next step in a deliberate move at VentureBeat toward deeper specialization: analysis built for the technical decision-makers — the directors, VPs, CIOs, and CTOs — who are evaluating, buying, and deploying enterprise AI.  The enterprise AI stack is being rewritten in real time, and the decision-makers I talk with are starved for objective, defendable data. Rob Strechay has the mix of technical rigor and operating experience needed to dissect the architecture behind the next phase of enterprise AI deployment.  The questions enterprise technology leaders are asking have changed. As organizations move past experimentation with generative AI toward production deployment, they want to know how to orchestrate multi-vendor environments, where the security gaps in their agentic pipelines sit, and how to fix the utilization problems draining their infrastructure budgets. Answering those questions requires more depth than news coverage alone provides, and that is the gap this research offering is built to fill.  An analyst who has sat on every side of the table  Strechay brings nearly three decades of experience as a practitioner, product executive, and industry analyst. Before becoming an analyst, he was an executive at numerous startups, including Zerto; he joined Amazon Web Services to help build a new analytics service; and he held executive roles across enterprise infrastructure. He later served as a senior analyst at Enterprise Strategy Group and most recently as managing director and principal analyst at theCUBE Research and SiliconANGLE, where he hosted executive interviews and analyzed the evolution of cloud, data, and AI infrastructure.  Strechay will initially focus his coverage on cloud infrastructure, advanced data infrastructure, platform engineering and DevOps orchestration and observability, and the intersection points where AI and enterprise security collide.  Already at work: GPU utilization and the VB Pulse surveys  Strechay has already been contributing to   VentureBeat&#x27;s research  . In May he published an   analysis of enterprise GPU utilization  , examining the compute waste sitting inside enterprise AI infrastructure, and he provided a substantive review of our AI Infrastructure &amp; Compute survey before it went into the field.  His infrastructure-level focus complements the research engine VentureBeat has built around its monthly VB Pulse surveys, which track five areas of enterprise AI adoption: agentic orchestration, agent reliability and evals, agentic security and identity, AI infrastructure and compute, and context layers, including retrieval-augmented generation (RAG).   Our June report on agentic orchestration  , drawn from a survey of 145 enterprises, found that two-thirds of those enterprises had hedged their AI model strategy rather than committing to a single provider — a posture whose value the June outage of Anthropic&#x27;s Claude models made plain.  VB In Conversation: The first vehicle  A core vehicle for this expanded research footprint will be a deepening of VentureBeat&#x27;s existing VB In Conversation video interview series, which Strechay will host. Rather than high-level industry overviews, the series will bring architectural blueprints, actual deployment barriers, and back-end infrastructure realities to light through in-depth technical interviews with the architects and product leaders behind leading enterprise AI systems — an unvarnished look at which tools perform under production-grade pressure.  &quot;VentureBeat has built an audience of enterprise builders and technology buyers that any analyst would want to serve,&quot; Strechay said. &quot;My goal is to use deep empirical metrics and VentureBeat&#x27;s proprietary tracking data to help enterprise buyers and the people building for them make sound platform and infrastructure decisions during the most disruptive transition enterprise technology has seen.&quot;  The expanded VB In Conversation series will appear on   VentureBeat   and on VentureBeat&#x27;s   YouTube channel  , alongside Rob&#x27;s written analysis on the site. Enterprise practitioners who want to take part in our monthly VB Pulse surveys, or arrange an analyst briefing with Rob, can reach the research team  here .", "source": "VentureBeat AI", "original": "https://venturebeat.com/ai/venturebeat-names-rob-strechay-as-its-first-lead-analyst-expanding-its-enterprise-ai-research-push", "aihot": "https://venturebeat.com/ai/venturebeat-names-rob-strechay-as-its-first-lead-analyst-expanding-its-enterprise-ai-research-push", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Fai%2Fventurebeat-names-rob-strechay-as-its-first-lead-analyst-expanding-its-enterprise-ai-research-push"}, {"idx": 3, "title": "谷歌25年来首次重新设计了搜索框--这就是为什么它比你想象的更重要。", "originalTitle": "Google just redesigned the search box for the first time in 25 years — here’s why it matters more than you think.", "summary": "四分之一个世纪以来，谷歌搜索框一直是计算领域最知名的界面之一：一个细小的白色矩形、一个闪烁的光标、几个键入的单词和一系列蓝色链接。周二，谷歌将正式淘汰这种模式。在年度I/O开发者大会上，谷歌宣布全面重新设计搜索框本身--每天数十亿次查询开始的字面文本字段--将其从简单的关键字输入转变为动态的人工智能驱动", "originalSummary": "For a quarter century, the Google search box has been one of the most recognizable interfaces in computing: a thin white rectangle, a blinking cursor, a few typed words, and a list of blue links. On Tuesday, Google will formally retire that paradigm.  At its annual  I/O developer conference , Google announced a  sweeping redesign  of the search box itself — the literal text field where billions of queries begin every day — transforming it from a simple keyword input into a dynamic, AI-driven conversation starter that can accept text, images, PDFs, videos, and even open Chrome tabs as inputs. The company is also merging its  AI Overviews  and  AI Mode  features into a single, seamless search flow, eliminating the friction that previously forced users to choose between a traditional results page and an AI-forward experience.  Liz Reid, Google&#x27;s vice president and head of Search, called it &quot;the biggest upgrade to our iconic search box since its debut over 25 years ago&quot; during a press briefing on Monday.  The announcement arrived alongside a blizzard of other news — new  Gemini models , a personal  AI agent called Spark , an intelligent  shopping cart , a  reimagined developer platform  — but the search box redesign may prove to be the most consequential. It is the clearest signal yet that Google views the future of its flagship product not as a place where users type fragmented keywords, but as an interface where they hold open-ended, multimodal conversations with an AI system backed by the entire web.   The new search box expands, accepts files, and coaches you on what to ask   The changes show a fundamental shift in how Google expects people to interact with the product that generates the vast majority of Alphabet&#x27;s revenue.  The box itself now dynamically expands to accommodate longer, more conversational queries. Where the old interface subtly encouraged brevity — a narrow field suited to two- or three-word keyword strings — the new design invites users to fully articulate complex questions in granular detail. It also now supports multimodal inputs directly. Users can upload images, PDFs, files, and videos, or drag in content from Chrome tabs, right from the main search interface. Previously, some of these capabilities existed in AI Mode, but reaching them required extra steps. Now they sit at the primary entry point.  Google is also deploying what it describes as an AI-powered query suggestion system that &quot;goes beyond autocomplete.&quot; Rather than simply predicting the next word a user might type based on popular searches, the system helps users formulate complex, nuanced queries — essentially coaching them toward the kind of detailed questions that AI Mode handles best.  The new search box is starting to roll out immediately in all countries and languages where AI Mode is available.   Google is merging AI overviews and AI mode into one seamless experience   Perhaps more significant than the box itself is the architectural change happening behind it. Google is unifying  AI Overviews  — the AI-generated summary panels that appear atop traditional search results — with  AI Mode , the more immersive conversational search experience the company launched at I/O one year ago.  Starting Tuesday, this merged experience will be live across mobile and desktop worldwide. A user can type a question, receive an AI Overview alongside traditional results, and then continue directly into a back-and-forth AI Mode conversation to ask follow-up questions — all without navigating to a separate interface.  Reid explained the logic during the press briefing: the new AI search box is &quot;an upgrade of our traditional search box, and so the results take you directly to main search rather than AI mode.&quot; She noted that while some power users actively sought out AI Mode, &quot;for most users, they don&#x27;t actually want to have to think about, do they want more of a traditional page or an AI-forward search experience.&quot;  The goal, she said, was to ensure that &quot;for most users, they don&#x27;t have to think about where to go, they can just go to the search box they&#x27;re familiar with, and it feels like they get the best experience afterwards.&quot;   One billion users and doubling queries reveal how fast search behavior is shifting   Google&#x27;s decision to redesign the foundational interface of its most important product did not happen in a vacuum. The company shared a set of usage statistics during the briefing that reveal just how rapidly user behavior is already changing.   AI Mode , which launched in the United States at I/O 2025, has surpassed one billion monthly users in its first year. AI Mode queries have been doubling every quarter since launch. AI Overviews, the lighter-weight AI summaries, now reach more than 2.5 billion monthly users. And overall  search query volume hit an all-time high  last quarter — a data point the company had previously disclosed on its earnings call.  Sundar Pichai, Google&#x27;s CEO, framed these figures as evidence that AI features are additive, not cannibalistic, to search usage. &quot;When people use our AI-powered features in search, they use search more,&quot; he said. He added that he loves &quot;how search has become less about individual queries and feels more like an ongoing conversation, giving users deeper insights and connecting you with the vastness of the web.&quot;  Reid reinforced the point: &quot;It&#x27;s not just that people are searching more, it&#x27;s that they&#x27;re searching differently. They&#x27;re fully expressing their questions in granular detail, asking those follow-up questions and searching across modalities.&quot;   Gemini 3.5 Flash gives Google&#x27;s AI search the speed it needs to work at scale   Under the hood, the new search experience runs on  Gemini 3.5 Flash , Google&#x27;s newest AI model, which the company also introduced at I/O. Google upgraded AI Mode&#x27;s underlying model to 3.5 Flash to deliver what Reid described as &quot;an even more powerful AI search experience.&quot;   Gemini 3.5 Flash  is the workhorse of this year&#x27;s announcements. Google claims it outperforms its previous frontier model,  Gemini 3.1 Pro , on nearly all benchmarks while running four times faster in output tokens per second than comparable frontier models. Pichai described it as being &quot;in a league of its own in the top right quadrant&quot; of the  Artificial Analysis index , which plots intelligence against speed — meaning it delivers near-frontier quality at dramatically lower latency.  That speed matters enormously for search. A conversational AI search experience that feels sluggish would be dead on arrival for a product that serves billions of queries daily. By coupling the redesigned interface with a model optimized for both quality and throughput, Google is attempting to make AI-powered search feel as instantaneous as the old keyword experience — while being dramatically more capable.   Search can now build interactive visuals and custom mini apps on the fly   The redesigned search box is also the gateway to a set of new capabilities that push search far beyond text-based answers. Google announced what it calls &quot; generative UI &quot; — the ability for search to dynamically build custom widgets, interactive visualizations, and even mini applications in real time, tailored to a user&#x27;s specific question.  Reid offered a concrete example during the briefing: a user could ask &quot;How do black holes affect space time?&quot; and receive an interactive visual in an AI Overview that brings the concept to life. Follow-up questions would trigger the system to dynamically generate entirely new visuals in real time. This is possible, she explained, because of &quot;a novel real-time code generation system we built in partnership with the Google DeepMind team&quot; that runs on Gemini 3.5 Flash. Generative UI capabilities will roll out to everyone this summer, free of charge.  But Google is going further still. For ongoing tasks — planning a wedding, organizing a move, tracking a fitness routine — users will be able to build what the company describes as customizable, stateful experiences within search, powered by its  Antigravity development platform . These require no coding expertise. Users simply describe what they want in natural language, and search builds it. Those experiences will be available in coming months, starting with  Google AI Pro  and  Ultra  subscribers in the United States.   AI agents that monitor the web around the clock are coming to search results   The redesign also opens the door to what Google calls &quot; information agents &quot; — AI agents that users can configure directly within search to monitor the web 24/7 for specific conditions and deliver synthesized updates when those conditions are met.  A user could, for example, set up an agent to track market movements in a particular sector with specific parameters. The agent would create a monitoring plan, tap into real-time finance data, and proactively notify the user when conditions are met — complete with links and context for further research. Other use cases include apartment hunting, tracking sneaker drops, or monitoring any topic a user cares about. Information agents will launch first for  Google AI Pro  and  Ultra  subscribers this summer.  These agents sit within a much larger strategic pivot that Google articulated throughout the briefing: the company is going all-in on AI systems that don&#x27;t just answer questions but proactively take actions on users&#x27; behalf. Beyond search, Google introduced  Gemini Spark , a 24/7 personal AI agent that runs on dedicated virtual machines in Google Cloud. It unveiled the  Universal Cart , an intelligent cross-merchant shopping cart. It announced the  Agent Payments Protocol  for agents to make secure purchases. And it expanded its  Antigravity developer platform  into a full ecosystem for building autonomous AI agents.   Publishers, advertisers, and SEO professionals face a new reality   The redesign raises profound questions for the sprawling ecosystem — publishers, advertisers, SEO professionals — that has been built around the old model of keyword search and blue links.  If users increasingly express their needs as full, conversational sentences rather than fragmented keywords, the entire discipline of search engine optimization will need to evolve. Keyword-density strategies become less relevant when the AI is parsing natural language intent rather than matching strings. Content that answers deep, nuanced questions in authoritative ways becomes more valuable; content engineered to rank for two-word keyword fragments becomes less so.  For publishers,  the stakes are existential . AI Overviews already synthesize information from across the web and present it directly in search results, reducing the need for users to click through to source material. The new seamless AI Mode integration deepens that dynamic: users can now get an AI-generated answer and ask multiple follow-up questions without ever leaving the search page. Google has consistently maintained that its AI features drive more traffic to publishers, but the redesign puts that claim under renewed scrutiny as the search results page becomes more self-contained.  For advertisers — who fund the vast majority of Google&#x27;s revenue — the shift from keywords to conversations changes the calculus of ad targeting. Conversational queries contain richer intent signals, which could make ad targeting more precise and valuable. But they also create new ambiguities: when a user is in the middle of a multi-turn conversation with AI Mode, where does an ad naturally fit? Google did not detail changes to its advertising model during the briefing, but the structural shift in the interface will inevitably reshape how ads are surfaced and measured.   The search box was always more than a product — it was a habit for billions of people   There is a reason Google chose to redesign the search box rather than simply adding new features behind it. The search box is not just a product element at this point; it is a cultural artifact — one of the few pieces of digital infrastructure used by essentially the entire internet-connected world. Changing it sends an unmistakable message about where the company believes computing is headed.  For 25 years, the search box trained billions of people to think in keywords — to compress their curiosity into the shortest possible string of words. The new box invites them to do the opposite: to think out loud, to upload what they&#x27;re looking at, to ask follow-up questions, to let an AI system handle the compression.  Pichai tied the company&#x27;s broader ambitions to a striking statistic: Google&#x27;s surfaces now process over 3.2 quadrillion tokens per month, up seven-fold from a year ago. The company expects capital expenditures of approximately $180 to $190 billion in 2026 — roughly six times the $31 billion it spent four years ago — largely to support the infrastructure required for this AI transformation. When asked about the future of traditional search, he was direct. &quot;Search is the most used AI product in the world,&quot; he said.  The blinking cursor in Google&#x27;s search box still invites you to type. But after 25 years of teaching the world to speak in keywords, Google is now asking it to speak in sentences — and betting roughly $190 billion that it will.", "source": "VentureBeat AI", "original": "https://venturebeat.com/technology/google-just-redesigned-the-search-box-for-the-first-time-in-25-years-heres-why-it-matters-more-than-you-think", "aihot": "https://venturebeat.com/technology/google-just-redesigned-the-search-box-for-the-first-time-in-25-years-heres-why-it-matters-more-than-you-think", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Ftechnology%2Fgoogle-just-redesigned-the-search-box-for-the-first-time-in-25-years-heres-why-it-matters-more-than-you-think"}, {"idx": 4, "title": "Railway获得1亿美元$ ，通过AI原生云基础设施挑战AWS", "originalTitle": "Railway secures $100 million to challenge AWS with AI-native cloud infrastructure", "summary": "总部位于旧金山的云平台Railway周四宣布，它在B轮融资中筹集了1亿美元，因为对人工智能应用程序的需求激增暴露了传统云基础设施的局限性。本轮融资由TQ Ventures领投，参与方包括FPV Ventures、Redpoint和Unusual Ventures。铁路作为最重要的信息之一的投资价值", "originalSummary": "Railway , a San Francisco-based cloud platform that has quietly amassed two million developers without spending a dollar on marketing, announced Thursday that it raised $100 million in a Series B funding round, as surging demand for artificial intelligence applications exposes the limitations of legacy cloud infrastructure.   TQ Ventures  led the round, with participation from  FPV Ventures ,  Redpoint , and  Unusual Ventures . The investment values Railway as one of the most significant infrastructure startups to emerge during the AI boom, capitalizing on developer frustration with the complexity and cost of traditional platforms like  Amazon Web Services  and  Google Cloud .  &quot;As AI models get better at writing code, more and more people are asking the age-old question: where, and how, do I run my applications?&quot; said Jake Cooper, Railway&#x27;s 28-year-old founder and chief executive, in an exclusive interview with VentureBeat. &quot;The last generation of cloud primitives were slow and outdated, and now with AI moving everything faster, teams simply can&#x27;t keep up.&quot;  The funding is a dramatic acceleration for a company that has charted an unconventional path through the cloud computing industry. Railway raised just $24 million in total before this round, including a  $20 million Series A  from Redpoint in 2022. The company now processes more than 10 million deployments monthly and handles over one trillion requests through its edge network — metrics that rival far larger and better-funded competitors.   Why three-minute deploy times have become unacceptable in the age of AI coding assistants   Railway&#x27;s pitch rests on a simple observation: the tools developers use to deploy and manage software were designed for a slower era. A standard build-and-deploy cycle using  Terraform , the industry-standard infrastructure tool, takes two to three minutes. That delay, once tolerable, has become a critical bottleneck as AI coding assistants like  Claude ,  ChatGPT , and  Cursor  can generate working code in seconds.  &quot;When godly intelligence is on tap and can solve any problem in three seconds, those amalgamations of systems become bottlenecks,&quot; Cooper told VentureBeat. &quot;What was really cool for humans to deploy in 10 seconds or less is now table stakes for agents.&quot;  The company claims its platform delivers deployments in under one second — fast enough to keep pace with AI-generated code. Customers report a tenfold increase in developer velocity and up to 65 percent cost savings compared to traditional cloud providers.  These numbers come directly from enterprise clients, not internal benchmarks. Daniel Lobaton, chief technology officer at G2X, a platform serving 100,000 federal contractors, measured deployment speed improvements of seven times faster and an 87 percent cost reduction after migrating to Railway. His infrastructure bill dropped from $15,000 per month to approximately $1,000.  &quot;The work that used to take me a week on our previous infrastructure, I can do in Railway in like a day,&quot; Lobaton said. &quot;If I want to spin up a new service and test different architectures, it would take so long on our old setup. In Railway I can launch six services in two minutes.&quot;   Inside the controversial decision to abandon Google Cloud and build data centers from scratch   What distinguishes  Railway  from competitors like  Render  and  Fly.io  is the depth of its vertical integration. In 2024, the company made the unusual decision to abandon Google Cloud entirely and build its own data centers, a move that echoes the famous Alan Kay maxim: &quot;People who are really serious about software should make their own hardware.&quot;  &quot;We wanted to design hardware in a way where we could build a differentiated experience,&quot; Cooper said. &quot;Having full control over the network, compute, and storage layers lets us do really fast build and deploy loops, the kind that allows us to move at &#x27;agentic speed&#x27; while staying 100 percent the smoothest ride in town.&quot;  The approach paid dividends during recent  widespread outages  that affected major cloud providers — Railway remained online throughout.  This soup-to-nuts control enables pricing that undercuts the hyperscalers by roughly 50 percent and newer cloud startups by three to four times. Railway charges by the second for actual compute usage: $0.00000386 per gigabyte-second of memory, $0.00000772 per vCPU-second, and $0.00000006 per gigabyte-second of storage. There are no charges for idle virtual machines — a stark contrast to the traditional cloud model where customers pay for provisioned capacity whether they use it or not.  &quot;The conventional wisdom is that the big guys have economies of scale to offer better pricing,&quot; Cooper noted. &quot;But when they&#x27;re charging for VMs that usually sit idle in the cloud, and we&#x27;ve purpose-built everything to fit much more density on these machines, you have a big opportunity.&quot;   How 30 employees built a platform generating tens of millions in annual revenue    Railway  has achieved its scale with a team of just 30 employees generating tens of millions in annual revenue — a ratio of revenue per employee that would be exceptional even for established software companies. The company grew revenue 3.5 times last year and continues to expand at 15 percent month-over-month.  Cooper emphasized that the fundraise was strategic rather than necessary. &quot;We&#x27;re default alive; there&#x27;s no reason for us to raise money,&quot; he said. &quot;We raised because we see a massive opportunity to accelerate, not because we needed to survive.&quot;  The company hired its first salesperson only last year and employs just two solutions engineers. Nearly all of Railway&#x27;s two million users discovered the platform through word of mouth — developers telling other developers about a tool that actually works.  &quot;We basically did the standard engineering thing: if you build it, they will come,&quot; Cooper recalled. &quot;And to some degree, they came.&quot;   From side projects to Fortune 500 deployments: Railway&#x27;s unlikely corporate expansion   Despite its grassroots developer community, Railway has made significant inroads into large organizations. The company claims that 31 percent of Fortune 500 companies now use its platform, though deployments range from company-wide infrastructure to individual team projects.  Notable customers include  Bilt , the loyalty program company; Intuit&#x27;s  GoCo  subsidiary; TripAdvisor&#x27;s  Cruise Critic ; and  MGM Resorts .  Kernel , a Y Combinator-backed startup providing AI infrastructure to over 1,000 companies, runs its entire customer-facing system on Railway for $444 per month.  &quot;At my previous company Clever, which sold for $500 million, I had six full-time engineers just managing AWS,&quot; said Rafael Garcia, Kernel&#x27;s chief technology officer. &quot;Now I have six engineers total, and they all focus on product. Railway is exactly the tool I wish I had in 2012.&quot;  For enterprise customers,  Railway  offers security certifications including SOC 2 Type 2 compliance and HIPAA readiness, with business associate agreements available upon request. The platform provides single sign-on authentication, comprehensive audit logs, and the option to deploy within a customer&#x27;s existing cloud environment through a &quot;bring your own cloud&quot; configuration.  Enterprise pricing starts at custom levels, with specific add-ons for extended log retention ($200 monthly), HIPAA BAAs ($1,000), enterprise support with SLOs ($2,000), and dedicated virtual machines ($10,000).   The startup&#x27;s bold strategy to take on Amazon, Google, and a new generation of cloud rivals   Railway enters a crowded market that includes not only the hyperscale cloud providers—Amazon Web Services, Microsoft Azure, and Google Cloud Platform—but also a growing cohort of developer-focused platforms like Vercel, Render, Fly.io, and Heroku.  Cooper argues that Railway&#x27;s competitors fall into two camps, neither of which has fully committed to the new infrastructure model that AI demands.  &quot;The hyperscalers have two competing systems, and they haven&#x27;t gone all-in on the new model because their legacy revenue stream is still printing money,&quot; he observed. &quot;They have this mammoth pool of cash coming from people who provision a VM, use maybe 10 percent of it, and still pay for the whole thing. To what end are they actually interested in going all the way in on a new experience if they don&#x27;t really need to?&quot;  Against startup competitors, Railway differentiates by covering the full infrastructure stack. &quot;We&#x27;re not just containers; we&#x27;ve got VM primitives, stateful storage, virtual private networking, automated load balancing,&quot; Cooper said. &quot;And we wrap all of this in an absurdly easy-to-use UI, with agentic primitives so agents can move 1,000 times faster.&quot;  The platform supports databases including PostgreSQL, MySQL, MongoDB, and Redis; provides up to 256 terabytes of persistent storage with over 100,000 input/output operations per second; and enables deployment to four global regions spanning the United States, Europe, and Southeast Asia. Enterprise customers can scale to 112 vCPUs and 2 terabytes of RAM per service.   Why investors are betting that AI will create a thousand times more software than exists today   Railway&#x27;s fundraise reflects broader investor enthusiasm for companies positioned to benefit from the AI coding revolution. As tools like  GitHub Copilot ,  Cursor , and  Claude  become standard fixtures in developer workflows, the volume of code being written — and the infrastructure needed to run it — is expanding dramatically.  &quot;The amount of software that&#x27;s going to come online over the next five years is unfathomable compared to what existed before — we&#x27;re talking a thousand times more software,&quot; Cooper predicted. &quot;All of that has to run somewhere.&quot;  The company has already integrated directly with AI systems, building what Cooper calls &quot;loops where Claude can hook in, call deployments, and analyze infrastructure automatically.&quot; Railway released a Model Context Protocol server in August 2025 that allows AI coding agents to deploy applications and manage infrastructure directly from code editors.  &quot;The notion of a developer is melting before our eyes,&quot; Cooper said. &quot;You don&#x27;t have to be an engineer to engineer things anymore — you just need critical thinking and the ability to analyze things in a systems capacity.&quot;   What Railway plans to do with $100 million and zero marketing experience    Railway  plans to use the new capital to expand its global data center footprint, grow its team beyond 30 employees, and build what Cooper described as a proper go-to-market operation for the first time in the company&#x27;s five-year history.  &quot;One of my mentors said you raise money when you can change the trajectory of the business,&quot; Cooper explained. &quot;We&#x27;ve built all the required substrate to scale indefinitely; what&#x27;s been holding us back is simply talking about it. 2026 is the year we play on the world stage.&quot;  The company&#x27;s investor roster reads like a who&#x27;s who of developer infrastructure. Angel investors include  Tom Preston-Werner,  co-founder of GitHub;  Guillermo Rauch , chief executive of Vercel;  Spencer Kimball , chief executive of Cockroach Labs;  Olivier Pomel , chief executive of Datadog; and  Jori Lallo , co-founder of Linear.  The timing of Railway&#x27;s expansion coincides with what many in Silicon Valley view as a fundamental shift in how software gets made. Coding assistants are no longer experimental curiosities — they have become essential tools that millions of developers rely on daily. Each line of AI-generated code needs somewhere to run, and the incumbents, by Cooper&#x27;s telling, are too wedded to their existing business models to fully capitalize on the moment.  Whether  Railway  can translate developer enthusiasm into sustained enterprise adoption remains an open question. The cloud infrastructure market is littered with promising startups that failed to break the grip of Amazon, Microsoft, and Google. But Cooper, who previously worked as a software engineer at  Wolfram Alpha ,  Bloomberg , and  Uber  before founding Railway in 2020, seems unfazed by the scale of his ambition.  &quot;In five years, Railway [will be] the place where software gets created and evolved, period,&quot; he said. &quot;Deploy instantly, scale infinitely, with zero friction. That&#x27;s the prize worth playing for, and there&#x27;s no bigger one on offer.&quot;  For a company that built a $100 million business by doing the opposite of what conventional startup wisdom dictates — no marketing, no sales team, no venture hype—the real test begins now. Railway spent five years proving that developers would find a better mousetrap on their own. The next five will determine whether the rest of the world is ready to get on board.", "source": "VentureBeat AI", "original": "https://venturebeat.com/infrastructure/railway-secures-usd100-million-to-challenge-aws-with-ai-native-cloud", "aihot": "https://venturebeat.com/infrastructure/railway-secures-usd100-million-to-challenge-aws-with-ai-native-cloud", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Finfrastructure%2Frailway-secures-usd100-million-to-challenge-aws-with-ai-native-cloud"}, {"idx": 5, "title": "Claude代码每月费用高达200 $。Goose免费做同样的事情。", "originalTitle": "Claude Code costs up to $200 a month. Goose does the same thing for free.", "summary": "人工智能编码革命带来了一个问题：成本高昂。Claude Code是Anthropic的基于终端的AI代理，可以自主编写、调试和部署代码，吸引了全球软件开发人员的想象力。但它的定价--根据使用情况每月从20美元到200美元不等--在它所服务的程序员中引发了越来越大的反叛。现在，一个免费的替代品正在获得牵引力。Goose ，由B开发的开源AI代理", "originalSummary": "The artificial intelligence coding revolution comes with a catch: it&#x27;s expensive.   Claude Code , Anthropic&#x27;s terminal-based AI agent that can write, debug, and deploy code autonomously, has captured the imagination of software developers worldwide. But its  pricing  — ranging from $20 to $200 per month depending on usage — has sparked a growing rebellion among the very programmers it aims to serve.  Now, a free alternative is gaining traction.  Goose , an open-source AI agent developed by  Block  (the financial technology company formerly known as Square), offers nearly identical functionality to  Claude Code  but runs entirely on a user&#x27;s local machine. No subscription fees. No cloud dependency. No rate limits that reset every five hours.  &quot;Your data stays with you, period,&quot; said Parth Sareen, a software engineer who demonstrated the tool during a  recent livestream . The comment captures the core appeal: Goose gives developers complete control over their AI-powered workflow, including the ability to work offline — even on an airplane.  The project has exploded in popularity. Goose now boasts more than  26,100 stars on GitHub , the code-sharing platform, with 362 contributors and 102 releases since its launch. The latest version,  1.20.1 , shipped on January 19, 2026, reflecting a development pace that rivals commercial products.  For developers frustrated by Claude Code&#x27;s pricing structure and usage caps, Goose represents something increasingly rare in the AI industry: a genuinely free, no-strings-attached option for serious work.     Anthropic&#x27;s new rate limits spark a developer revolt   To understand why  Goose  matters, you need to understand the  Claude Code pricing controversy .  Anthropic, the San Francisco artificial intelligence company founded by former OpenAI executives, offers Claude Code as part of its subscription tiers. The free plan provides no access whatsoever. The  Pro plan , at $17 per month with annual billing (or $20 monthly), limits users to just 10 to 40 prompts every five hours — a constraint that serious developers exhaust within minutes of intensive work.  The  Max plans , at $100 and $200 per month, offer more headroom: 50 to 200 prompts and 200 to 800 prompts respectively, plus access to Anthropic&#x27;s most powerful model,  Claude 4.5 Opus . But even these premium tiers come with restrictions that have inflamed the developer community.  In late July, Anthropic announced new weekly rate limits. Under the system, Pro users receive 40 to 80 hours of Sonnet 4 usage per week. Max users at the $200 tier get 240 to 480 hours of Sonnet 4, plus 24 to 40 hours of Opus 4. Nearly five months later, the frustration has not subsided.  The problem? Those &quot;hours&quot; are not actual hours. They represent token-based limits that vary wildly depending on codebase size, conversation length, and the complexity of the code being processed. Independent analysis suggests the actual per-session limits translate to roughly 44,000 tokens for Pro users and 220,000 tokens for the $200 Max plan.  &quot;It&#x27;s confusing and vague,&quot; one developer wrote in a  widely shared analysis . &quot;When they say &#x27;24-40 hours of Opus 4,&#x27; that doesn&#x27;t really tell you anything useful about what you&#x27;re actually getting.&quot;  The  backlash on Reddit  and  developer forums  has been fierce. Some users report hitting their daily limits within 30 minutes of intensive coding. Others have canceled their subscriptions entirely, calling the new restrictions &quot;a joke&quot; and &quot;unusable for real work.&quot;  Anthropic has defended the changes, stating that the limits affect fewer than five percent of users and target people running Claude Code &quot; continuously in the background, 24/7 .&quot; But the company has not clarified whether that figure refers to five percent of Max subscribers or five percent of all users — a distinction that matters enormously.   How Block built a free AI coding agent that works offline    Goose  takes a radically different approach to the same problem.  Built by  Block , the payments company led by Jack Dorsey, Goose is what engineers call an &quot; on-machine AI agent .&quot; Unlike Claude Code, which sends your queries to Anthropic&#x27;s servers for processing, Goose can run entirely on your local computer using open-source language models that you download and control yourself.  The project&#x27;s documentation describes it as going &quot; beyond code suggestions &quot; to &quot;install, execute, edit, and test with any LLM.&quot; That last phrase — &quot;any LLM&quot; — is the key differentiator. Goose is model-agnostic by design.  You can connect Goose to Anthropic&#x27;s  Claude models  if you have  API access . You can use OpenAI&#x27;s  GPT-5  or Google&#x27;s  Gemini . You can route it through services like  Groq  or  OpenRouter . Or — and this is where things get interesting — you can run it entirely locally using tools like  Ollama , which let you download and execute open-source models on your own hardware.  The practical implications are significant. With a local setup, there are no subscription fees, no usage caps, no rate limits, and no concerns about your code being sent to external servers. Your conversations with the AI never leave your machine.  &quot;I use Ollama all the time on planes — it&#x27;s a lot of fun!&quot;  Sareen noted  during a demonstration, highlighting how local models free developers from the constraints of internet connectivity.   What Goose can do that traditional code assistants can&#x27;t    Goose  operates as a command-line tool or desktop application that can autonomously perform complex development tasks. It can build entire projects from scratch, write and execute code, debug failures, orchestrate workflows across multiple files, and interact with external APIs — all without constant human oversight.  The architecture relies on what the AI industry calls &quot; tool calling &quot; or &quot; function calling &quot; — the ability for a language model to request specific actions from external systems. When you ask  Goose  to create a new file, run a test suite, or check the status of a GitHub pull request, it doesn&#x27;t just generate text describing what should happen. It actually executes those operations.  This capability depends heavily on the underlying language model.  Claude 4 models  from Anthropic currently perform best at tool calling, according to the  Berkeley Function-Calling Leaderboard , which ranks models on their ability to translate natural language requests into executable code and system commands.  But newer open-source models are catching up quickly. Goose&#x27;s documentation highlights several options with strong tool-calling support: Meta&#x27;s  Llama series , Alibaba&#x27;s  Qwen models , Google&#x27;s  Gemma variants , and DeepSeek&#x27;s  reasoning-focused architectures .  The tool also integrates with the  Model Context Protocol , or MCP, an emerging standard for connecting AI agents to external services. Through MCP, Goose can access databases, search engines, file systems, and third-party APIs — extending its capabilities far beyond what the base language model provides.   Setting Up Goose with a Local Model   For developers interested in a completely free, privacy-preserving setup, the process involves three main components:  Goose  itself,  Ollama  (a tool for running open-source models locally), and a compatible language model.   Step 1: Install Ollama    Ollama  is an open-source project that dramatically simplifies the process of running large language models on personal hardware. It handles the complex work of downloading, optimizing, and serving models through a simple interface.  Download and install Ollama from  ollama.com . Once installed, you can pull models with a single command. For coding tasks,  Qwen 2.5  offers strong tool-calling support:  ollama run qwen2.5  The model downloads automatically and begins running on your machine.   Step 2: Install Goose    Goose  is available as both a desktop application and a command-line interface. The desktop version provides a more visual experience, while the CLI appeals to developers who prefer working entirely in the terminal.  Installation instructions vary by operating system but generally involve downloading from Goose&#x27;s  GitHub releases page  or using a package manager. Block provides pre-built binaries for macOS (both Intel and Apple Silicon), Windows, and Linux.   Step 3: Configure the Connection   In Goose Desktop, navigate to Settings, then Configure Provider, and select Ollama. Confirm that the API Host is set to http://localhost:11434 (Ollama&#x27;s default port) and click Submit.  For the command-line version, run goose configure, select &quot;Configure Providers,&quot; choose Ollama, and enter the model name when prompted.  That&#x27;s it. Goose is now connected to a language model running entirely on your hardware, ready to execute complex coding tasks without any subscription fees or external dependencies.   The RAM, processing power, and trade-offs you should know about   The obvious question: what kind of computer do you need?  Running large language models locally requires substantially more computational resources than typical software. The key constraint is memory — specifically, RAM on most systems, or VRAM if using a dedicated graphics card for acceleration.  Block&#x27;s  documentation  suggests that 32 gigabytes of RAM provides &quot;a solid baseline for larger models and outputs.&quot; For Mac users, this means the computer&#x27;s unified memory is the primary bottleneck. For Windows and Linux users with discrete NVIDIA graphics cards, GPU memory (VRAM) matters more for acceleration.  But you don&#x27;t necessarily need expensive hardware to get started. Smaller models with fewer parameters run on much more modest systems.  Qwen 2.5 , for instance, comes in multiple sizes, and the smaller variants can operate effectively on machines with 16 gigabytes of RAM.  &quot;You don&#x27;t need to run the largest models to get excellent results,&quot;  Sareen emphasized . The practical recommendation: start with a smaller model to test your workflow, then scale up as needed.  For context, Apple&#x27;s entry-level  MacBook Air  with 8 gigabytes of RAM would struggle with most capable coding models. But a  MacBook Pro  with 32 gigabytes — increasingly common among professional developers — handles them comfortably.   Why keeping your code off the cloud matters more than ever    Goose  with a local LLM is not a perfect substitute for  Claude Code . The comparison involves real trade-offs that developers should understand.   Model Quality :  Claude 4.5 Opus , Anthropic&#x27;s flagship model, remains arguably the most capable AI for software engineering tasks. It excels at understanding complex codebases, following nuanced instructions, and producing high-quality code on the first attempt. Open-source models have improved dramatically, but a gap persists — particularly for the most challenging tasks.  One developer who switched to the $200 Claude Code plan  described the difference bluntly : &quot;When I say &#x27;make this look modern,&#x27; Opus knows what I mean. Other models give me Bootstrap circa 2015.&quot;   Context Window :  Claude Sonnet 4.5 , accessible through the API, offers a massive one-million-token context window — enough to load entire large codebases without chunking or context management issues. Most local models are limited to 4,096 or 8,192 tokens by default, though many can be configured for longer contexts at the cost of increased memory usage and slower processing.   Speed : Cloud-based services like  Claude Code  run on dedicated server hardware optimized for AI inference. Local models, running on consumer laptops, typically process requests more slowly. The difference matters for iterative workflows where you&#x27;re making rapid changes and waiting for AI feedback.   Tooling Maturity :  Claude Code  benefits from Anthropic&#x27;s dedicated engineering resources. Features like prompt caching (which can reduce costs by up to 90 percent for repeated contexts) and structured outputs are polished and well-documented.  Goose , while actively developed with 102 releases to date, relies on community contributions and may lack equivalent refinement in specific areas.   How Goose stacks up against Cursor, GitHub Copilot, and the paid AI coding market   Goose enters a crowded market of AI coding tools, but occupies a distinctive position.   Cursor , a popular AI-enhanced code editor, charges $20 per month for its  Pro tier  and $200 for  Ultra —pricing that mirrors  Claude Code&#x27;s Max plans . Cursor provides approximately 4,500 Sonnet 4 requests per month at the Ultra level, a substantially different allocation model than Claude Code&#x27;s hourly resets.   Cline ,  Roo Code , and similar open-source projects offer AI coding assistance but with varying levels of autonomy and tool integration. Many focus on code completion rather than the agentic task execution that defines Goose and Claude Code.  Amazon&#x27;s  CodeWhisperer ,  GitHub Copilot , and enterprise offerings from major cloud providers target large organizations with complex procurement processes and dedicated budgets. They are less relevant to individual developers and small teams seeking lightweight, flexible tools.  Goose&#x27;s combination of genuine autonomy, model agnosticism, local operation, and zero cost creates a unique value proposition. The tool is not trying to compete with commercial offerings on polish or model quality. It&#x27;s competing on freedom — both financial and architectural.   The $200-a-month era for AI coding tools may be ending   The AI coding tools market is evolving quickly. Open-source models are improving at a pace that continually narrows the gap with proprietary alternatives. Moonshot AI&#x27;s  Kimi K2  and z.ai&#x27;s  GLM 4.5  now benchmark near  Claude Sonnet 4 levels  — and they&#x27;re freely available.  If this trajectory continues, the quality advantage that justifies Claude Code&#x27;s premium pricing may erode. Anthropic would then face pressure to compete on features, user experience, and integration rather than raw model capability.  For now, developers face a clear choice. Those who need the absolute best model quality, who can afford premium pricing, and who accept usage restrictions may prefer  Claude Code . Those who prioritize cost, privacy, offline access, and flexibility have a genuine alternative in  Goose .  The fact that a $200-per-month commercial product has a zero-dollar open-source competitor with comparable core functionality is itself remarkable. It reflects both the maturation of open-source AI infrastructure and the appetite among developers for tools that respect their autonomy.  Goose is not perfect. It requires more technical setup than commercial alternatives. It depends on hardware resources that not every developer possesses. Its model options, while improving rapidly, still trail the best proprietary offerings on complex tasks.  But for a growing community of developers, those limitations are acceptable trade-offs for something increasingly rare in the AI landscape: a tool that truly belongs to them.    Goose is available for download at    github.com/block/goose   . Ollama is available at    ollama.com   . Both projects are free and open source.", "source": "VentureBeat AI", "original": "https://venturebeat.com/infrastructure/claude-code-costs-up-to-usd200-a-month-goose-does-the-same-thing-for-free", "aihot": "https://venturebeat.com/infrastructure/claude-code-costs-up-to-usd200-a-month-goose-does-the-same-thing-for-free", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Finfrastructure%2Fclaude-code-costs-up-to-usd200-a-month-goose-does-the-same-thing-for-free"}]}, {"label": "🏢 产业动态", "items": [{"idx": 6, "title": "智谱开源 GLM-5.3 模型权重，主打智能体编程与网络防御", "originalTitle": "智谱开源 GLM-5.3 模型权重，主打智能体编程与网络防御", "summary": "智谱宣布开源 GLM-5.3 模型权重支持本地运行与个性化定制，擅长复杂编码、防御性网络安全及长程任务。该模型在 AA 综合智能指数中取得 60 分， Claude与寓言5、 GPT-5.6 Sol 等闭源旗舰同级，并与 KIMI K3 并列开源模型第一。仅年营业额超 100 亿美元的机构将其作为外部模型服务提供时才需安全审查。", "originalSummary": "智谱宣布开源 GLM-5.3 模型权重，支持本地运行与个性化定制，擅长复杂编码、防御性网络安全及长程任务。该模型在 AA 综合智能指数中取得 60 分，与 Claude Fable 5、GPT-5.6 Sol 等闭源旗舰同级，并与 Kimi K3 并列开源模型第一。仅年营业额超 100 亿美元的机构将其作为外部模型服务提供时才需安全审查。", "source": "IT之家（RSS）", "original": "https:/
