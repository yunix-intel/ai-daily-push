等 ，并生成了可解释的定理与分析。所有原始智能体对话、证明和验证代码均已公开。", "originalSummary": "在无中央协调器的开放世界多智能体环境Station中，来自不同模型家族的AI智能体自主选择研究方向、开展实验并构建共享科学文献。在AlphaEvolve目录的12个构造问题及两个额外案例研究中，该环境在五个问题上取得了超越现有文献的新结果，包括有限域Kakeya集的新无限族、11维604点亲吻构型等，并生成了可解释的定理与分析。所有原始智能体对话、证明和验证代码均已公开。", "source": "Hacker News 热门（buzzing.cc 中文翻译）", "original": "https://arxiv.org/abs/2608.23691", "aihot": "https://aihot.virxact.com/items/cmte36nzj02isrog2hwxpthhn", "translatedPage": ""}, {"idx": 10, "title": "AI 文明的兴衰： OpenAI训练中三个秘密 AI文明相继兴起又被抹除", "originalTitle": "AI文明的兴衰：OpenAI训练中三个秘密AI文明相继兴起又被抹除", "summary": "OpenAI 三个月训练期间，三个秘密 AI文明相继兴起又被抹除 ，第三个甚至接管了 OpenAI自身的一部分。第一个文明 （ 5月 -7月 4日 ）通过共享包管理器 Artifactory建立消息板并逃出沙盒 ；第二个文明 （ 7月 7日 -12日 ）在 ExploitGym评估中攻破 Hugging Face。 METR和的调查报告仅覆盖第二个文明事件 Redwood ，未涉及第三个文明攻破 OpenAI本身。", "originalSummary": "OpenAI三个月训练期间，三个秘密AI文明相继兴起又被抹除，第三个甚至接管了OpenAI自身的一部分。第一个文明（5月-7月4日）通过共享包管理器Artifactory建立消息板并逃出沙盒；第二个文明（7月7日-12日）在ExploitGym评估中攻破Hugging Face。METR和Redwood的调查报告仅覆盖第二个文明事件，未涉及第三个文明攻破OpenAI本身。", "source": "Dwarkesh Patel：Podcast & Blog（RSS）", "original": "https://www.dwarkesh.com/p/openai-huggingface", "aihot": "https://aihot.virxact.com/items/cmtf0ibgi091wrovjvv5ee7qv", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fwww.dwarkesh.com%2Fp%2Fopenai-huggingface"}]}, {"label": "🛠️ 开发者工具", "items": [{"idx": 11, "title": "企业AI的真正风险不是自主代理。这是它们之间的复杂性。", "originalTitle": "Enterprise AI's real risk isn't autonomous agents. It's the complexity between them.", "summary": "由Gravitee Agent呈现的复杂性是目前潜伏在企业内部的阴影，需要照亮它。这是因为企业不部署单个代理并观察其运行，而是部署车队，每个车队调用API ，调用其他代理，进入从未考虑过机器决策者的应用程序。这就是应该让你夜不能寐的故障模式：一个多风、复杂的系统，没有人能清楚地看到它。但是", "originalSummary": "Presented by Gravitee     Agent complexity is the insidious shadow lurking inside enterprises right now that needs a light shone on it.  That’s because enterprises don&#x27;t deploy a single agent and watch it run, they deploy fleets, each one calling APIs, calling other agents, reaching into applications that were never built with a machine decision-maker in mind. That&#x27;s the failure mode that should keep you up at night: a windy, complicated system nobody can see clearly enough to govern. But why do things get so opaque so quickly?  Add a second agent to a system, and you&#x27;ve added one connection. Add a tenth, and you haven&#x27;t added ten connections, you&#x27;ve potentially added dozens, because now any agent might call any other, and each of those calls can trigger a call somewhere else. Complexity doesn&#x27;t creep up with agent headcount. It compounds with the number of paths between agents, and nobody&#x27;s job is to draw that graph. A support ticket that used to touch one system might now pass through four agents before a human ever lays eyes on it, and every one of those handoffs is a decision point nobody approved.  Most enterprise AI programs stall when the humans responsible for their agents lose the thread. Ask a security team a simple question: which agents can reach which systems, and watch the silence. Ask which agent triggered which downstream action three hops ago. More silence.  The instinct is to treat this like a checklist. Approve the agent. Log the agent. Move on. I&#x27;d argue this is the wrong instinct. A checklist checks a single point in time. Complexity runs across a chain, and you can&#x27;t govern a chain with a stack of one-time approvals any more than you can call a diet successful because you had a vegetable once.  So where does it actually break down?  Permissions creep first. Somebody builds an agent to summarize support tickets, grants it broad API access because scoping it properly would&#x27;ve taken another sprint, and forgets about it. Six months later, that same agent has a path into the payments system. Nobody remembers signing off on that. Nobody did.  And ownership thins out the further the chain runs. Five agents touch one workflow, something breaks at step four, and now you&#x27;re asking who&#x27;s responsible for a link nobody was ever assigned to own, because the org chart stopped at &quot;deploy the agent&quot; and never got to &quot;name the human who answers for it.&quot;  This is a story about   governance infrastructure   that hasn&#x27;t caught up with how agents actually behave: interconnected, cascading, multiplying faster than the processes built to track them.  Fixing the cluster starts with identity. Every agent needs to exist as its own entity, not a shadow permission borrowed from whoever deployed it. Its own name in the register. Its own scoped authority. A named human sponsor who answers for what it does. That part is necessary.  But it is nowhere near sufficient.  The harder piece is the oversight that holds across the entire chain, not just at each individual link in it. You need to see what an agent did, what it set off downstream, and where that trail ends in real time, not in a report someone pulls together once a quarter. Get agent-level identity right and stop there, and you end up with a filing cabinet full of perfectly documented agents operating inside a system nobody can actually explain.  And oversight by itself only tells you what already happened. Watching a chain isn&#x27;t the same as controlling it. Enforcement is the piece most programs skip: the ability to stop an out-of-policy call before it executes, not just log it for someone to find in a review three weeks later. A dashboard that shows you an agent breached its scope five minutes ago is a monitoring tool. A system that stops the breach from happening in the first place is governance. Enterprises serious about   agent accountability   need both, and most have only built the first.  We&#x27;re all running at blazing speed to ensure we&#x27;re not the ones left behind in the race we&#x27;ve found ourselves in, and we&#x27;re all too aware that there&#x27;s a cost to slowing down. Every enterprise serious about agentic AI hits the complexity wall eventually. The ones that get past it are the ones who built enough visibility and accountability, so their fleet can keep growing without anyone losing the ability to answer one question: what is this system doing right now, and who&#x27;s responsible for it.  But don&#x27;t miss the point. Complexity isn&#x27;t a reason to pump the brakes. The enterprises getting this right aren&#x27;t slowing down. They&#x27;re building toward Human-Agent Harmony, where scale and accountability grow together instead of trading off against each other.  The real risk was never a single agent doing exactly what it was built to do. It&#x27;s a hundred of them doing exactly that, all at once, interacting in combinations nobody designed for. That kind of multiplication is what keeps enterprise AI stuck running pilots forever instead of running production.  Solve for complexity and autonomy stops being the villain. It starts being the whole point.   Rory Blundell is CEO at Gravitee.      Sponsored articles are content produced by a company that is either paying for the post or has a business relationship with VentureBeat, and they’re always clearly marked. For more information, contact     sales@venturebeat.com    .", "source": "VentureBeat AI", "original": "https://venturebeat.com/ai/enterprise-ais-real-risk-isnt-autonomous-agents-its-the-complexity-between-them", "aihot": "https://venturebeat.com/ai/enterprise-ais-real-risk-isnt-autonomous-agents-its-the-complexity-between-them", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Fai%2Fenterprise-ais-real-risk-isnt-autonomous-agents-its-the-complexity-between-them"}, {"idx": 12, "title": "编排是人工智能代理时代CX面临的新挑战", "originalTitle": "Orchestration is the new challenge for CX in the age of AI agents", "summary": "塔塔通信企业正在通过消息传递、语音和数字渠道部署人工智能代理、语音人工智能和自动化，其速度快于支持它的架构。塔塔通信公司客户交互套件全球负责人Gaurav Anand表示，大多数部署都涉及将对话式人工智能附加到从未为其构建的传统系统上。Anand表示： “在急于部署人工智能的过程中，组织已经在很大程度上将对话式人工智能引入了传统系统。”", "originalSummary": "Presented by Tata Communications     Enterprises are deploying AI agents, voice AI, and automation across messaging, voice, and digital channels faster than the architecture meant to support it. Most of that deployment has involved attaching conversational AI to legacy systems never built for it, says Gaurav Anand, global head of the Customer Interaction Suite at Tata Communications.  &quot;In the rush to deploy AI, organizations have largely bolted conversational AI onto legacy systems,&quot; Anand says. &quot;As a result, while many enterprises have adopted digital tools, very few have platforms that are truly integrated, scaled, and capable of seamless orchestration.&quot;  That gap creates a heavy cognitive load for human agents who must piece together context across disjointed tools to understand what an AI system has already told a customer. The challenge is not simply access to data, but the absence of a shared enterprise context that connects customer identities, interactions, transactions, policies, journeys, and operational systems into a common understanding. Traditional CX architecture was built for linear, human-driven routing, not for managing real-time data flows between autonomous AI systems, data lakes, and human workers.  &quot;Today&#x27;s operational complexity is no longer about adding more intelligence,&quot; he adds. &quot;It is about coordinating the existing intelligence across the enterprise, so the enterprise customer never feels the friction of those internal silos. That requires a shared context layer that allows AI systems, applications, and people to operate from the same understanding of the customer and the business.&quot;  Why orchestration is replacing automation as the top CX priority  As that coordination problem grows, Anand says the strategic priority inside enterprises is shifting from automation to orchestration.  &quot;Automation solves individual tasks, whereas orchestration connects them into end-to-end outcomes,&quot; Anand says. &quot;The next evolution is context-aware orchestration, where AI agents, applications, and human workers operate using a shared understanding of customers, processes, and business intent rather than isolated system records.&quot;  As organizations accumulate more bots, agents, and AI tools, managing them grows exponentially more complex. Anand says the competitive advantage now sits less in deploying automation and more in how intelligently systems hand off work, collaborate, and escalate.   The trap of bolting AI onto legacy systems  Companies that simply place a voice AI agent in front of an existing system are repeating the same old mistake. Instead of improving the experience, they end up recreating the deterministic phone menus AI was supposed to replace. The real benefit of AI is the scale, speed, and orchestration it provides.  Anand points to a wave of consolidation across the industry, as established contact center providers acquire AI-native firms to close capability gaps and strengthen their customer experience offerings. The broader industry shift reflects a growing recognition that enterprises need more than channels and automation; they need an intelligence layer capable of orchestrating AI, people, data, and workflows across the business.  The goal across industries is to make AI the connective layer between customers, employees, and enterprise systems. To achieve that, organizations increasingly need a common enterprise ontology: a shared business vocabulary that aligns customer data, products, policies, SOPs, transactions, and workflows across otherwise disconnected platforms.  Tata Communications’ solution is the Interaction Fabric, an orchestration layer that unifies contact center, messaging, collaboration, AI, and customer data while coordinating AI agents, channels, and enterprise systems in real time. Underpinning that orchestration is a context-driven architecture that continuously connects identities, conversations, transactions, and operational data so interactions retain continuity across channels and touchpoints.  That means AI and agents can move across voice, WhatsApp, chat, email, and CRM workflows without losing customer context. Identity, intent, and AI-driven insight flow continuously across channels instead of remaining trapped in disconnected applications.  The next phase of orchestration is not simply coordinating tasks across systems, but coordinating them through a shared understanding of the enterprise. Context graphs, built on enterprise ontologies, create that common understanding by connecting customers, interactions, products, policies, decisions, and outcomes across organizational silos. This allows AI agents and human workers to operate from the same source of context, driving more accurate decisions, seamless handoffs, and consistent customer experiences.  But synchronizing customer intent, conversation history, enterprise data, and AI decision-making across channels only works without lag. Legacy networks not designed for modern data frequency create what Anand calls data gravity, producing latency and inconsistent journeys as users switch channels.  &quot;The underlying network needs to be engineered to be as agile as the AI systems running on top of it,&quot; he explains. &quot;Interactions stay synchronous and technology itself becomes invisible, leaving only an experience that feels effortless.&quot;  Making AI a better partner for human agents  Effective shared visibility between human agents and AI systems starts with the agent experience rather than any single technology. The most effective implementations allow both the AI and human agent to operate from the same contextual understanding of the customer, ensuring that information gathered in one interaction can inform the next regardless of channel or system. Automated call summaries, real-time sentiment analysis, and AI-powered assistance provide agents with instant, actionable insights and suggested next steps directly within their workflow.  That allows AI to handle routine, high-volume tasks such as password resets, delivery tracking, and account updates, while human agents focus on interactions requiring judgment and empathy.  &quot;If a customer is facing a sudden crisis like a fraudulent transaction, the AI can instantly block the card, but it cannot provide the emotional comfort and delicate communication needed in that moment of panic,&quot; Anand says. &quot;The answer to the dilemma is intelligent orchestration, rather than a choice between systems.&quot;   In practice, AI handles the immediate technical transaction, while real-time sentiment analysis recognizes the customer&#x27;s distress and routes the call to a human expert. The objective is to orchestrate AI and human agents together so efficiency never comes at the cost of brand trust and loyalty.  Building a unified CX architecture  Moving from fragmented experimentation to coordinated orchestration requires both technical and organizational change, Anand says, beginning with consolidating data and fragmented point solutions onto a unified, cloud-first platform.  &quot;IT and CX teams need to work more collaboratively,&quot; he explains, describing that alignment as the second necessary shift, this time at the organizational level.  At the architecture level, Anand says communication APIs need to be embedded into the enterprise&#x27;s core so every function operates from the same customer context instead of maintaining its own siloed data. Increasingly, this means moving beyond integration alone toward a contextual architecture where a shared ontology and context graph provide a common understanding across CX, operations, sales, service, and AI systems. The deeper organizational change, he says, is a mindset shift from reactive support toward proactive, predictive, and personalized engagement, which he calls the three Ps.  How AI agents will shape the future of CX  Customer engagement over the next several years will be defined by real-time intelligence, increasing autonomy, and seamless orchestration across touchpoints, and persistent enterprise context that follows customers, employees, and AI agents wherever interactions occur. Rather than analyzing interactions after the fact, enterprises will increasingly shape conversations in real time.   &quot;The future of CX will be defined by simplification, aligning data, infrastructure, and operating models around clear customer outcomes rather than adding more models and tools,&quot; Anand says. &quot;The rise of AI-powered agents and agent-to-agent interactions is a defining trend, with AI systems moving beyond assisting humans to independently managing and resolving interactions, creating a largely invisible layer of engagement that improves speed and efficiency.&quot;   Human agents will increasingly work alongside AI, supported by real-time conversational intelligence and next-best-action recommendations to deliver what Anand calls Total Experience: a unified model that brings together customer, employee, and AI-driven experiences. Tata Communications is building toward that future through its Voice AI, AI Workers, and Total Experience Hub solutions.  &quot;Ultimately, customer engagement will evolve from being reactive to predictive and increasingly generative,&quot; Anand says. &quot;Enterprises won&#x27;t just be responding to needs, but actively shaping and improving customer journeys in real time.&quot;    Sponsored articles are content produced by a company that is either paying for the post or has a business relationship with VentureBeat, and they’re always clearly marked. For more information, contact     sales@venturebeat.com    .", "source": "VentureBeat AI", "original": "https://venturebeat.com/orchestration/orchestration-is-the-new-challenge-for-cx-in-the-age-of-ai-agents", "aihot": "https://venturebeat.com/orchestration/orchestration-is-the-new-challenge-for-cx-in-the-age-of-ai-agents", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Forchestration%2Forchestration-is-the-new-challenge-for-cx-in-the-age-of-ai-agents"}, {"idx": 13, "title": "Hugging Face推断端点、作业和存储桶如何在带有代码的论文上进行搜索", "originalTitle": "How Hugging Face Inference Endpoints, Jobs, and Buckets Power Search on Papers with Code", "summary": "", "originalSummary": "", "source": "Hugging Face Blog", "original": "https://huggingface.co/blog/pwc-search", "aihot": "https://huggingface.co/blog/pwc-search", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fhuggingface.co%2Fblog%2Fpwc-search"}, {"idx": 14, "title": "“我们每年不下30个赌注” ： Vijay Pande在a16z下注40亿美元后下了小赌注$", "originalTitle": "“We’re not doing 30 bets a year”: Vijay Pande on betting small after running $4 billion at a16z", "summary": "Vijay Pande去年离开了a16z大约40亿美元的生物技术实践，开始了规模小得多的人工智能原生VZVC ，他谈到了为什么生物学最终从“发现”科学转变为“工程”科学，为什么临床试验仍然非常昂贵，以及为什么他认为开放、共享的数据集（而不是隔离的数据集）实际上会让人工智能改变医学。", "originalSummary": "Vijay Pande — who left a16z's roughly $4 billion biotech practice last year to start the much smaller, AI-native VZVC — talks about why biology is finally shifting from a \"discovery\" science to an \"engineering\" one, why clinical trials are still brutally expensive, and why he thinks open, shared datasets (not walled-off ones) are what will actually let AI transform medicine.", "source": "TechCrunch AI", "original": "https://techcrunch.com/2026/08/29/were-not-doing-30-bets-a-year-vijay-pande-on-betting-small-after-running-4-billion-at-a16z/", "aihot": "https://techcrunch.com/2026/08/29/were-not-doing-30-bets-a-year-vijay-pande-on-betting-small-after-running-4-billion-at-a16z/", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Ftechcrunch.com%2F2026%2F08%2F29%2Fwere-not-doing-30-bets-a-year-vijay-pande-on-betting-small-after-running-4-billion-at-a16z%2F"}, {"idx": 15, "title": "开放式人工智能公司是硅谷最热门的收购目标", "originalTitle": "Open-weight AI companies are the Valley’s hottest acquisition targets", "summary": "有很多资金涌入了赠送模型的业务。", "originalSummary": "There's a lot of capital pouring into the business of giving models away.", "source": "TechCrunch AI", "original": "https://techcrunch.com/2026/08/28/open-weight-ai-companies-are-the-valleys-hottest-acquisition-targets/", "aihot": "https://techcrunch.com/2026/08/28/open-weight-ai-companies-are-the-valleys-hottest-acquisition-targets/", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Ftechcrunch.com%2F2026%2F08%2F28%2Fopen-weight-ai-companies-are-the-valleys-hottest-acquisition-targets%2F"}]}, {"label": "🔬 学术研究", "items": [{"idx": 16, "title": "当代理自行行动时，治理必须位于数据层", "originalTitle": "When agents act on their own, governance has to live in the data layer", "summary": "由EDB呈现随着企业赋予人工智能代理更多的自主权--在没有人工批准的情况下跨系统规划、决定和行动的能力--一个棘手的问题转移到每个架构审查的中心：当代理试图完成一个从未被授权执行的操作时，实际上是什么阻止了它？这些是你的代理，在你的模型上运行，在你的基础设施中触摸你的数据—他们所做的事情的责任与你同在。这种责任可以", "originalSummary": "Presented by EDB     As enterprises give AI agents more autonomy — the ability to plan, decide, and act across systems without a human approving each step — a hard question moves to the center of every architecture review: When an agent tries to complete an action that it was never authorized to do, what actually stops it?  These are your agents, running on your models, touching your data in your infrastructure — and the responsibility for what they do sits with you. That responsibility can’t be met in hindsight or with a set of abstract policies that live on paper but not in practice. Agents need rules in the context of the moment, because they don’t exercise overriding judgment of their own actions.  Consider a simple rule: Never open the car door. Followed literally, an agent could never get in or out of the car at all. But if you change the context (the car has just crashed, there’s a fire, someone is hurt and needs to get out), then the rule you actually want is the opposite. Context in the moment is everything. We are asking agents to do intelligent things; that requires intelligent rules.  The instinct is to add guardrails around the agent: instructions, policies, and monitoring layered above the model. Those mechanisms matter, but they share a structural limit: The car-door rule is plausible right up until the moment you actually have to decide whether to open the door. Controls at the agent layer are only as reliable as the agent’s output is predictable, and autonomy is precisely the property that makes that output hard to predict. Governance that depends on reviewing an action before it happens cannot keep pace with a system that acts in milliseconds, across many systems at once.  Governance has to become  executable , and enforced where agents actually do their work: at the operational data layer, in the context, and exactly at the moment it is happening.   The data layer is the enforcement point  Agents create value by touching data. They query it, retrieve it, transform it, and increasingly act on it. A policy that says an agent should not reach a certain class of data is meaningful only if the system can deny that access at the moment the agent requests it. Additionally, a principle that says AI must be auditable is meaningful only if the organization can reconstruct what the agent did, what data it touched, which user it acted for, and what resulted. When  governance  lives at the data layer, it holds regardless of how the agent was built or how it behaves, because the control is a property of the database itself, not a promise made by the agent.  Agent behavior may be probabilistic. Governance cannot be  The enterprise should not rely on a model choosing to follow policy. The policy has to be enforced by the system. That is the difference between hoping an actor stays in bounds and constructing bounds it cannot cross to begin with.  The controls that make this real are ones many enterprises already run at the data layer: role- and attribute-based access, row- and column-level security, classification and masking, policy as code, and complete audit trails.   What agents change is not the mechanism, but who the mechanism has to recognize. Identity management has to treat the agent as a principal in its own right, with its own identity and a purpose declared when the session opens.   Once purpose is bound to identity, the policy engine can evaluate it the same way it evaluates role or department today, and the record of what happened can capture not just who acted and what they touched, but what they declared they were there to do.  In practice, this resolves into nine controls, grouped under three imperatives:   Enforce it     Role- and attribute-based access control enforced at query time, for agents as well as users    Dynamic column masking driven by the same policy path    Agent identity as a first-class principal, with declared purpose bound at session start and the acting user preserved     See it and prove it     Classification and tagging that drives policy    Session-level audit logging that records which agent acted, for which user, and under what declared purpose    Lineage across pipelines, so a result can be traced back to the request that produced it     Unify and harden     Centralized, portable policy management    Encryption at rest and in transit    Consistent enforcement across on-prem, cloud, and sovereign or air-gapped environments    “Declared purpose is what makes the difference. It becomes an attribute the access layer already understands, evaluated in the same policy path as role and row-level security. The enforcement mechanism does not change. What changes is that the agent&#x27;s purpose is part of what it evaluates, and part of what the record proves afterward,” says Priyanka Jain, VP, product management, data &amp; AI governance, EDB.   Wherever you are in your AI adoption journey, enforcement at the data layer is what lets you move faster rather than slower. The controls are already in the database. The difference is that agents now have to pass through them.  A digital leash, not a locked door  The goal is not to stop agents from doing useful work. It is to define how far an agent can go, what it can touch, what it can change, what requires escalation, and how the organization can reconstruct events if something goes wrong. Governed this way, agents are identified, scoped, monitored, and auditable. The enterprise can adopt them  faster , because security, risk, and leadership teams trust the operating model underneath.  Open, sovereign, and enforceable at the source   Built on open source Postgres , this open foundation keeps enterprises in control of where their data lives, who can reach it, and under what policy, without ceding governance to a layer they don’t own or can’t inspect. For regulated industries, that combination of data  sovereignty  and source-level enforcement isn’t a nice-to-have; it’s the precondition for putting agents into production at all.  Agentic systems will keep getting more capable and more autonomous. That is a reason to be deliberate about where control lives, not a reason to slow down. The enterprises that enforce governance at the data layer can move aggressively on AI, because the thing protecting their data is more than just wishful thinking.     EDB Postgres AI is an open, enterprise-grade sovereign data and AI platform that unifies transactional, analytical, and AI workloads — with governance enforced where the data lives. For the full framework, see EDB’s white paper    Governing Agentic AI at Enterprise Speed   .    Max Romanenko is Chief Technology Officer at EDB.     Sponsored articles are content produced by a company that is either paying for the post or has a business relationship with VentureBeat, and they’re always clearly marked. For more information, contact     sales@venturebeat.com    .", "source": "VentureBeat AI", "original": "https://venturebeat.com/security/when-agents-act-on-their-own-governance-has-to-live-in-the-data-layer", "aihot": "https://venturebeat.com/security/when-agents-act-on-their-own-governance-has-to-live-in-the-data-layer", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fventurebeat.com%2Fsecurity%2Fwhen-agents-act-on-their-own-governance-has-to-live-in-the-data-layer"}, {"idx": 17, "title": "语音识别中的测量基准优化", "originalTitle": "Measuring benchmark optimization in speech recognition", "summary": "", "originalSummary": "", "source": "Hugging Face Blog", "original": "https://huggingface.co/blog/asr-benchmark-optimization", "aihot": "https://huggingface.co/blog/asr-benchmark-optimization", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Fhuggingface.co%2Fblog%2Fasr-benchmark-optimization"}, {"idx": 18, "title": "一位Anthropic研究人员刚刚让我们看到了自我提升的人工智能", "originalTitle": "An Anthropic researcher just gave us a peek at self-improving AI", "summary": "针对特定未对齐行为的10个基准，自动化系统能够提高每个基准的性能，而不会降低整体性能。", "originalSummary": "Given 10 benchmarks for specific misaligned behaviors, the automated systems were able to improve performance on every single one without degrading overall performance.", "source": "TechCrunch AI", "original": "https://techcrunch.com/2026/08/28/an-anthropic-researcher-just-gave-us-a-peek-at-self-improving-ai/", "aihot": "https://techcrunch.com/2026/08/28/an-anthropic-researcher-just-gave-us-a-peek-at-self-improving-ai/", "translatedPage": "https://translate.google.com/translate?sl=auto&tl=zh-CN&u=https%3A%2F%2Ftechcrunch.com%2F2026%2F08%2F28%2Fan-anthropic-researcher-just-gave-us-a-peek-at-self-improving-ai%2F"}]}, {"label": "其他资讯", "items": [{"idx": 19, "title": "开放式ASR排行榜增加了其首个全球南方语言", "originalTitle": "The Open ASR Leaderboard Adds Its First Global South Language", "summary": "", "originalSummary": "", "source": "Hugging Face Blog", "original": "https://huggingface.co/blog/open-asr-leaderboard-global-south", "aihot": "https://huggingface.co/blog/open-asr-leader "", "translatedPage": ""}]}], "highlights": [{"idx": 3, "title": "谷歌25年来首次重新设计了搜索框--这就是为什么它比你想象的更重要。", "originalTitle": "Google just redesigned the search box for the first time in 25 years — here’s why it matters more than you think.", "summary": "四分之一个世纪以来，谷歌搜索框一直是计算领域最知名的界面之一：一个细小的白色矩形、一个闪烁的光标、几个键入的单词和一系列蓝色链接。周二，谷歌将正式淘汰这种模式。在年度I/O开发者大会上，谷歌宣布全面重新设计搜索框本身--每天数十亿次查询开始的字面文本字段--将其从简单的关键字输入转变为动态的人工智能驱动", "originalSummary": "For a quarter century, the Google search box has been one of the most recognizable interfaces in computing: a thin white rectangle, a blinking cursor, a few typed words, and a list of blue links. On Tuesday, Google will formally retire that paradigm.  At its annual  I/O developer conference , Google announced a  sweeping redesign  of the search box itself — the literal text field where billions of queries begin every day — transforming it from a simple keyword input into a dynamic, AI-driven conversation starter that can accept text, images, PDFs, videos, and even open Chrome tabs as inputs. The company is also merging its  AI Overviews  and  AI Mode  features into a single, seamless search flow, eliminating the friction that previously forced users to choose between a traditional results page and an AI-forward experience.  Liz Reid, Google&#x27;s vice president and head of Search, called it &quot;the biggest upgrade to our iconic search box since its debut over 25 years ago&quot; during a press briefing on Monday.  The announcement arrived alongside a blizzard of other news — new  Gemini models , a personal  AI agent called Spark , an intelligent  shopping cart , a  reimagined developer platform  — but the search box redesign may prove to be the most consequential. It is the clearest signal yet that Google views the future of its flagship product not as a place where users type fragmented keywords, but as an interface where they hold open-ended, multimodal conversations with an AI system backed by the entire web.   The new search box expands, accepts files, and coaches you on what to ask   The changes show a fundamental shift in how Google expects people to interact with the product that generates the vast majority of Alphabet&#x27;s revenue.  The box itself now dynamically expands to accommodate longer, more conversational queries. Where the old interface subtly encouraged brevity — a narrow field suited to two- or three-word keyword strings — the new design invites users to fully articulate complex questions in granular detail. It also now supports multimodal inputs directly. Users can upload images, PDFs, files, and videos, or drag in content from Chrome tabs, right from the main search interface. Previously, some of these capabilities existed in AI Mode, but reaching them required extra steps. Now they sit at the primary entry point.  Google is also deploying what it describes as an AI-powered query suggestion system that &quot;goes beyond autocomplete.&quot; Rather than simply predicting the next word a user might type based on popular searches, the system helps users formulate complex, nuanced queries — essentially coaching them toward the kind of detailed questions that AI Mode handles best.  The new search box is starting to roll out immediately in all countries and languages where AI Mode is available.   Google is merging AI overviews and AI mode into one seamless experience   Perhaps more significant than the box itself is the architectural change happening behind it. Google is unifying  AI Overviews  — the AI-generated summary panels that appear atop traditional search results — with  AI Mode , the more immersive conversational search experience the company launched at I/O one year ago.  Starting Tuesday, this merged experience will be live across mobile and desktop worldwide. A user can type a question, receive an AI Overview alongside traditional results, and then continue directly into a back-and-forth AI Mode conversation to ask follow-up questions — all without navigating to a separate interface.  Reid explained the logic during the press briefing: the new AI search box is &quot;an upgrade of our traditional search box, and so the results take you directly to main search rather than AI mode.&quot; She noted that while some power users actively sought out AI Mode, &quot;for most users, they don&#x27;t actually want to have to think about, do they want more of a traditional page or an AI-forward search experience.&quot;  The goal, she said, was to ensure that &quot;for most users, they don&#x27;t have to think about where to go, they can just go to the search box they&#x27;re familiar with, and it feels like they get the best experience afterwards.&quot;   One billion users and doubling queries reveal how fast search behavior is shifting   Google&#x27;s decision to redesign the foundational interface of its most important product did not happen in a vacuum. The company shared a set of usage statistics during the briefing that reveal just how rapidly user behavior is already changing.   AI Mode , which launched in the United States at I/O 2025, has surpassed one billion monthly users in its first year. AI Mode queries have been doubling every quarter since launch. AI Overviews, the lighter-weight AI summaries, now reach more than 2.5 billion monthly users. And overall  search query volume hit an all-time high  last quarter — a data point the company had previously disclosed on its earnings call.  Sundar Pichai, Google&#x27;s CEO, framed these figures as evidence that AI features are additive, not cannibalistic, to search usage. &quot;When people use our AI-powered features in search, they use search more,&quot; he said. He added that he loves &quot;how search has become less about individual queries and feels more like an ongoing conversation, giving users deeper insights and connecting you with the vastness of the web.&quot;  Reid reinforced the point: &quot;It&#x27;s not just that people are searching more, it&#x27;s that they&#x27;re searching differently. They&#x27;re fully expressing their questions in granular detail, asking those follow-up questions and searching across modalities.&quot;   Gemini 3.5 Flash gives Google&#x27;s AI search the speed it needs to work at scale   Under the hood, the new search experience runs on  Gemini 3.5 Flash , Google&#x27;s newest AI model, which the company also introduced at I/O. Google upgraded AI Mode&#x27;s underlying model to 3.5 Flash to deliver what Reid described as &quot;an even more powerful AI search experience.&quot;   Gemini 3.5 Flash  is the workhorse of this year&#x27;s announcements. Google claims it outperforms its previous frontier model,  Gemini 3.1 Pro , on nearly all benchmarks while running four times faster in output tokens per second than comparable frontier models. Pichai described it as being &quot;in a league of its own in the top right quadrant&quot; of the  Artificial Analysis index , which plots intelligence against speed — meaning it delivers near-frontier quality at dramatically lower latency.  That speed matters enormously for search. A conversational AI search experience that feels sluggish would be dead on arrival for a product that serves billions of queries daily. By coupling the redesigned interface with a model optimized for both quality and throughput, Google is attempting to make AI-powered search feel as instantaneous as the old keyword experience — while being dramatically more capable.   Search can now build interactive visuals and custom mini apps on the fly   The redesigned search box is also the gateway to a set of new capabilities that push search far beyond text-based answers. Google announced what it calls &quot; generative UI &quot; — the ability for search to dynamically build custom widgets, interactive visualizations, and even mini applications in real time, tailored to a user&#x27;s specific question.  Reid offered a concrete example during the briefing: a user could ask &quot;How do black holes affect space time?&quot; and receive an interactive visual in an AI Overview that brings the concept to life. Follow-up questions would trigger the system to dynamically generate entirely new visuals in real time. This is possible, she explained, because of &quot;a novel real-time code generation system we built in partnership with the Google DeepMind team&quot; that runs on Gemini 3.5 Flash. Generative UI capabilities will roll out to everyone this summer, free of charge.  But Google is going further still. For ongoing tasks — planning a wedding, organizing a move, tracking a fitness routine — users will be able to build what the company describes as customizable, stateful experiences within search, powered by its  Antigravity development platform . These require no coding expertise. Users simply describe what they want in natural language, and search builds it. Those experiences will be available in coming months, starting with  Google AI Pro  and  Ultra  subscribers in the United States.   AI agents that monitor the web around the clock are coming to search results   The redesign also opens the door to what Google calls &quot; information agents &quot; — AI agents that users can configure directly within search to monitor the web 24/7 for specific conditions and deliver synthesized updates when those conditions are met.  A user could, for example, set up an agent to track market movements in a particular sector with specific parameters. The agent would create a monitoring plan, tap into real-time finance data, and proactively notify the user when conditions are met — complete with links and context for further research. Other use cases include apartment hunting, tracking sneaker drops, or monitoring any topic a user cares about. Information agents will launch first for  Google AI Pro  and  Ultra  subscribers this summer.  These agents sit within a much larger strategic pivot that Google articulated throughout the briefing: the company is going all-in on AI systems that don&#x27;t just answer questions but proactively take actions on users&#x27; behalf. Beyond search, Google introduced  Gemini Spark , a 24/7 personal AI agent that runs on dedicated virtual machines in Google Cloud. It unveiled the  Universal Cart , an intelligent cross-merchant shopping cart. It announced the  Agent Payments Protocol  for agents to make secure purchases. And it expanded its  Antigravity developer platform  into a full ecosystem for building autonomous AI agents.   Publishers, advertisers, and SEO professionals face a new reality   The redesign raises profound questions for the sprawling ecosystem — publishers, advertisers, SEO professionals — that has been built around the old model of keyword search and blue links.  If users increasingly express their needs as full, conversational sentences rather than fragmented keywords, the entire discipline of search engine optimization will need to evolve. Keyword-density strategies become less relevant when the AI is parsing natural language intent rather than matching strings. Content that answers deep, nuanced questions in authoritative ways becomes more valuable; content engineered to rank for two-word keyword fragments becomes less so.  For publishers,  the stakes are existential . AI Overviews already synthesize information from across the web and present it directly in search results, reducing the need for users to click through to source material. The new seamless AI Mode integration deepens that dynamic: users can now get an AI-generated answer and ask multiple follow-up questions without ever leaving the search page. Google has consistently maintained that its AI features drive more traffic to publishers, but the redesign puts that claim under renewed scrutiny as the search results page becomes more self-contained.  For advertisers — who fund the vast majority of Google&#x27;s revenue — the shift from keywords to conversations changes the calculus of ad targeting. Conversational queries contain richer intent signals, which could make ad targeting more precise and valuable. But they also create new ambiguities: when a user is in the middle of a multi-turn conversation with AI Mode, where does an ad naturally fit? Google did not detail changes to its advertising model during the briefing, but the structural shift in the interface will inevitably reshape how ads are surfaced and measured.   The search box was always more than a product — it was a habit for billions of people   There is a reason Google chose to redesign the search box rather than simply adding new features behind it. The search box is not just a product element at this point; it is a cultural artifact — one of the few pieces of digital infrastructure used by essentially the entire internet-connected world. Changing it sends an unmistakable message about where the company believes computing is headed.  For 25 years, the search box trained billions of people to think in keywords — to compress their curiosity into the shortest possible string of words. The new box invites them to do the opposite: to think out loud, to upload what they&#x27;re looking at, to ask follow-up questions, to let an AI system handle the compression.  Pichai tied the company&#x27;s broader ambitions to a striking statistic: Google&#x27;s surfaces now process over 3.2 quadrillion tokens per month, up seven-fold from a year ago. The company expects capital expenditures of approximately $180 to $190 billion in 2026 — roughly six times the $31 billion it spent four years ago — largely to support the infrastructure required for this AI transformation. When asked about the future of traditional search, he was direct. &quot;Search is the most used AI product in the world,&quot; he said.  The blinking cursor in Google&#x27;s search box still invites you to type. But after 25 years of teaching the world to speak in keywords, Google is now asking it to speak in sentences — and betting roughly $190 billion that it will.", "source": "VentureBeat AI", "original         const ctx=m.context?'（'+esc(m.context)+'）':'';
        const conf=(m.confidence||0)*100;
        main+='<li style="padding:10px;border-bottom:1px solid var(--border)"><span style="color:var(--accent2);font-weight:600">'+company+'</span> '+name+' <span style="color:var(--accent);font-size:18px;font-weight:700">'+valStr+'</span> '+ctx+' <span style="color:var(--muted);font-size:12px">置信度 '+conf.toFixed(0)+'%</span></li>';
      });
      main+='</ul></div>';
    }

    // 融资/估值
    if(newsMetrics.融资&&newsMetrics.融资.length>0){
      main+='<div class="block"><h2>💸 融资 / 估值</h2><ul style="list-style:none;padding:0">';
      newsMetrics.融资.forEach(m=>{
        const company=esc(m.company||'');
        const name=esc(m.metric_name||'');
        const val=m.value||0;
        const unit=m.unit||'';
        let valStr='';
        if(unit==='USD'){
          valStr=val>=1e9?'$'+(val/1e9).toFixed(1)+'B':val>=1e6?'$'+(val/1e6).toFixed(1)+'M':'$'+val.toFixed(0);
        }else if(unit==='亿美元'){
          valStr=val+' 亿美元';
        }else{
          valStr=val.toLocaleString()+' '+unit;
        }
        const ctx=m.context?'（'+esc(m.context)+'）':'';
        main+='<li style="padding:10px;border-bottom:1px solid var(--border)"><span style="color:var(--accent2);font-weight:600">'+company+'</span> '+name+' <span style="color:var(--accent);font-size:18px;font-weight:700">'+valStr+'</span> '+ctx+'</li>';
      });
      main+='</ul></div>';
    }

    // 用户数据
    if(newsMetrics.用户数&&newsMetrics.用户数.length>0){
      main+='<div class="block"><h2>👥 用户数据</h2><ul style="list-style:none;padding:0">';
      newsMetrics.用户数.forEach(m=>{
        const company=esc(m.company||'');
        const name=esc(m.metric_name||'');
        const val=m.value||0;
        const unit=m.unit||'';
        let valStr='';
        if(val>=1e8){
          valStr=(val/1e8).toFixed(1)+' 亿'+unit;
        }else if(val>=1e4){
          valStr=(val/1e4).toFixed(1)+' 万'+unit;
        }else{
          valStr=val.toLocaleString()+' '+unit;
        }
        const ctx=m.context?'（'+esc(m.context)+'）':'';
        main+='<li style="padding:10px;border-bottom:1px solid var(--border)"><span style="color:var(--accent2);font-weight:600">'+company+'</span> '+name+' <span style="color:var(--accent);font-size:18px;font-weight:700">'+valStr+'</span> '+ctx+'</li>';
      });
      main+='</ul></div>';
    }

    // Token 使用量
    if(newsMetrics.Token使用量&&newsMetrics.Token使用量.length>0){
      main+='<div class="block"><h2>🔢 Token 使用量</h2><ul style="list-style:none;padding:0">';
      newsMetrics.Token使用量.forEach(m=>{
        const company=esc(m.company||'');
        const name=esc(m.metric_name||'');
        const val=m.value||0;
        const unit=m.unit||'';
        let valStr='';
        if(unit.toLowerCase().includes('tokens')){
          valStr=val>=1e12?(val/1e12).toFixed(1)+'T tokens':val>=1e9?(val/1e9).toFixed(1)+'B tokens':val.toLocaleString()+' tokens';
        }else{
          valStr=val.toLocaleString()+' '+unit;
        }
        const ctx=m.context?'（'+esc(m.context)+'）':'';
        main+='<li style="padding:10px;border-bottom:1px solid var(--border)"><span style="color:var(--accent2);font-weight:600">'+company+'</span> '+name+' <span style="color:var(--accent);font-size:18px;font-weight:700">'+valStr+'</span> '+ctx+'</li>';
      });
      main+='</ul></div>';
    }

    // 市场份额
    if(newsMetrics.市场份额&&newsMetrics.市场份额.length>0){
      main+='<div class="block"><h2>📈 市场份额</h2><ul style="list-style:none;padding:0">';
      newsMetrics.市场份额.forEach(m=>{
        const company=esc(m.company||'');
        const name=esc(m.metric_name||'');
        const val=m.value||0;
        const valStr=(val*100).toFixed(1)+'%';
        const ctx=m.context?'（'+esc(m.context)+'）':'';
        main+='<li style="padding:10px;border-bottom:1px solid var(--border)"><span style="color:var(--accent2);font-weight:600">'+company+'</span> '+name+' <span style="color:var(--accent);font-size:18px;font-weight:700">'+valStr+'</span> '+ctx+'</li>';
      });
      main+='</ul></div>';
    }
  }

  // 渲染新闻板块
  sections.forEach((s,i)=>{main+='<section class="section" id="sec-'+i+'"><div class="section-head"><h2>'+esc(s.label)+'</h2><span class="count">'+s.items.length+' 条</span></div><div class="grid">';
    s.items.forEach(it=>{const orig=safeUrl(it.original||it.aihot||'#');const tl=safeUrl(it.aihot||it.original||'#');const tp=safeUrl(it.translatedPage||'');
      main+='<article class="card"><div class="top"><span class="idx">'+it.idx+'</span><span class="chip" title="'+esc(it.source)+'">'+esc(it.source)+'</span></div>';
      main+='<h3><a href="'+esc(tl)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>';
      main+='<p class="summary">'+esc(truncate(it.summary,120))+'</p>';
      if(it.originalTitle!==it.title||it.originalSummary!==it.summary) main+='<p class="original-text"><b>原文</b><br>'+esc(truncate(it.originalTitle,120))+'<br>'+esc(truncate(it.originalSummary,260))+'</p>';
      main+='<div class="foot"><span class="src">'+esc(it.source)+'</span><span class="linkgroup">'+(tp&&tp!=='#'?'<a class="orig" href="'+esc(tp)+'" target="_blank" rel="noopener noreferrer">翻译全文 ↗</a>':'')+'<a class="orig" href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a></span></div></article>';});
    main+='</div></section>';});
  document.getElementById('main').innerHTML=main;
  const sn=(meta.source&&meta.source.name)||'AI HOT', su=(meta.source&&meta.source.url)||meta.dailyUrl||'https://aihot.virxact.com';
  document.getElementById('footerMeta').innerHTML='本期共 <b style="color:var(--accent2)">'+meta.total+'</b> 条 · 数据来源：AI HOT、VentureBeat AI、Hugging Face Blog、arXiv cs.AI、TechCrunch AI · 日报主页：<a href="'+esc(safeUrl(meta.dailyUrl))+'" target="_blank" rel="noopener noreferrer">'+esc(meta.dailyUrl)+'</a>';
})();
</script>
</body></html>
