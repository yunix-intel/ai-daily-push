<script>
const DATA = {"meta": {"date": "2026-08-27", "windowStart": "2026-08-26T00:00:00.000Z", "windowEnd": "2026-08-27T00:00:00.000Z", "generatedAt": "2026-08-27T00:00:30.389Z", "total": 28, "source": {"name": "AIHOT", "url": "https://aihot.virxact.com/daily/2026-08-27"}, "dailyUrl": "https://aihot.virxact.com/daily/2026-08-27"}, "sections": [{"label": "模型发布/更新", "items": [{"idx": 1, "title": "GLM-5.3-Flash 开源：320B 总参数、AA 指数 57 分，定价为 Opus 4.8 的 1/40", "summary": "智谱上线并开源 GLM-5.3-Flash（320B-A18B），这是 GLM-5 系列首个原生多模态模型，AA 综合智能指数 57 分，与 Claude Opus 4.8 持平。其定价为 GLM-5.3 的 1/10，限时折扣内为 Opus 4.8 的 1/40，并已接入 ZCode 等平台开放 API 调用。该模型采用稀疏注意力与线性注意力混合架构，推理服务已跑在国产芯片集群上。", "source": "公众号：智谱（GLM）", "original": "https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&mid=2247494157&idx=1&sn=6837b15a07d2518842eb6c6b53a3eb3c", "aihot": "https://aihot.virxact.com/items/cmta7bh1k04u6roj2e4pt7bob"}, {"idx": 2, "title": "Qwen3.8-Flash-Next 开源：Qwen4 架构早期预览", "summary": "通义千问开源 Qwen3.8-Flash-Next，一款多模态 MoE 模型，也是 Qwen4 架构的早期预览。该模型采用 GDN + QSA 混合注意力等四项升级，总参数 125B，每 token 激活 6B，训练成本约为 Qwen3.7-Plus 的 1/9，编码与办公任务能力更强。", "source": "Qwen：Blog Retrieval（API）", "original": "https://qwen.ai/blog?id=qwen3.8-flash-next", "aihot": "https://aihot.virxact.com/items/cmta2veap03nmrolwxllvp4ay"}, {"idx": 3, "title": "Gemini 3.5 Transcribe 发布：面向实时语音交互的高精度语音转文本模型", "summary": "Google DeepMind 推出 Gemini 3.5 Transcribe 语音转文本模型，支持流式与非流式两种 API。据 Artificial Analysis 评测，其流式与非流式平均词错率分别为 4.0% 和 2.6%，支持超 85 种语言、自定义词汇及最多三人说话人识别。", "source": "Google DeepMind：Blog（RSS）", "original": "https://deepmind.google/blog/intelligent-transcription-with-gemini-3-5-transcribe", "aihot": "https://aihot.virxact.com/items/cmtacq8vz0aedroj24bcix9go"}, {"idx": 4, "title": "腾讯混元将端侧翻译模型 Hy-MT2-1.8B 压缩至 440MB，已落地哔哩哔哩直播弹幕翻译", "summary": "腾讯混元将端侧翻译模型 Hy-MT2-1.8B 通过 2-bit 与 1.25-bit 量化方案压缩至 574MB 和 440MB，翻译质量几乎无损，在 FLORES-200 上优于 Microsoft Translator 等商业 API。该模型已联合英特尔完成 x86 适配，并在哔哩哔哩直播弹幕实时翻译中落地，单条弹幕翻译耗时 500~800ms。", "source": "公众号：腾讯混元", "original": "https://mp.weixin.qq.com/s?__biz=MzkwODU2OTQyNQ%3D%3D&mid=2247498367&idx=1&sn=f1a5cf87eb06015cbe995bd5ef8b5d0a", "aihot": "https://aihot.virxact.com/items/cmta7honk0553roj21gque0zw"}, {"idx": 5, "title": "GlucoFM：面向连续血糖监测的基础模型", "summary": "Google Research 推出 GlucoFM，一款轻量级自监督 CGM 基础模型，采用双流设计分别建模缓慢血糖趋势与短期波动。在四个队列、七项临床预测任务的 14 项评估中，其 PR-AUC 较最优 GluFormer 变体平均高出 5.8 个百分点，并在 PPGR 预测中取得最低 MAE。模型在 109,066 小时无标注 CGM 数据上预训练，具备跨数据集迁移与少样本适应能力。", "source": "Google Research：Blog（网页）", "original": "https://research.google/blog/glucofm-foundation-model-for-continuous-glucose-monitoring", "aihot": "https://aihot.virxact.com/items/cmtaj3732034urovudls0byfe"}]}, {"label": "产品发布/更新", "items": [{"idx": 6, "title": "Claude in Chrome 正式全面上线", "summary": "Anthropic 宣布 Claude in Chrome 现已面向所有付费 Claude 套餐全面开放，Claude 可在浏览器中自主执行操作，无需逐步审批。系统通过安全分类器在每次操作前验证其安全性及是否符合用户请求，并强化了针对提示注入攻击的防御。最新评测显示，在启用探测与安全分类器后，自 Opus 4.8 起的所有模型均未出现攻击成功案例。", "source": "Claude：Blog（网页）", "original": "https://claude.com/blog/claude-in-chrome-generally-available", "aihot": "https://aihot.virxact.com/items/cmtaej1vz0czhroj2aybdbq26"}, {"idx": 7, "title": "Claude Cowork 内置浏览器上线：Claude 可在桌面应用中自主浏览网页", "summary": "Anthropic 在 Claude Cowork 桌面应用中为 Claude 新增内置浏览器，可自动导航网页、阅读页面、点击并填写表单，无需扩展或额外设置。该功能本周起向 Pro、Max 和 Team 套餐用户推送，Enterprise 管理员今日起可启用；浏览器与用户自有浏览器隔离，不读取标签页、书签或密码，并沿用与 Claude in Chrome 相同的提示注入防护措施。", "source": "Claude：Blog（网页）", "original": "https://claude.com/blog/cowork-built-in-browser", "aihot": "https://aihot.virxact.com/items/cmtan3q5v03ydroam6r1a92zn"}, {"idx": 8, "title": "NVIDIA 扩展 NVLink Fusion，推出 NVHBM 定制高带宽内存技术", "summary": "NVIDIA 今日扩展 NVLink Fusion，推出下一代高带宽内存技术 NVHBM，将定制内存控制器集成到 HBM 基础裸片上。相比标准 HBM4E，该技术可提升至高 30% 内存带宽、降低 15% HBM 功耗，并释放 XPU 计算裸片上至多 25% 面积。", "source": "NVIDIA Blog（RSS）", "original": "https://blogs.nvidia.com/blog/nvlink-fusion-nvhbm-custom-high-bandwidth-memory", "aihot": "https://aihot.virxact.com/items/cmtalrp9a01mdroamzq0idcvm"}, {"idx": 9, "title": "Databricks 推出 Governance Hub：面向整个数据资产的智能账
