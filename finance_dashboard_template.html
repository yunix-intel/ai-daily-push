<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财经日报 · 晨报仪表盘</title>
<style>
  :root{--bg:#0e1014;--bg2:#151922;--card:#171c26;--card-hover:#1e2531;--border:#272f3d;--text:#e8ecf3;--muted:#9aa4b2;--accent:#f0b429;--accent2:#37e0b0;--up:#ff5b5b;--down:#3ddc84;--warn:#ff7a45;--chip:#222b39;--shadow:rgba(0,0,0,.45);--domestic:#5b9eff;--intl:#ff8c42;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(1200px 600px at 80% -10%, #2a2213 0%, var(--bg) 55%) fixed;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding-top:56px}
  a{color:inherit;text-decoration:none}
  .global-nav{position:fixed;top:0;left:0;right:0;background:rgba(14,16,20,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);z-index:1000;padding:12px 0}
  .global-nav .wrap{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;gap:20px;align-items:center}
  .global-nav a{color:var(--text);text-decoration:none;font-size:14px;font-weight:600;padding:6px 12px;border-radius:6px;transition:all .2s}
  .global-nav a:hover{background:var(--card-hover);color:var(--accent)}
  .global-nav a.active{background:var(--accent);color:#0c1320}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .hero{padding:30px 0 16px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.18em;color:var(--accent);border:1px solid var(--border);padding:5px 12px;border-radius:999px;background:var(--bg2)}
  .hero h1{font-size:clamp(24px,4vw,36px);font-weight:800;margin:12px 0 4px;letter-spacing:-.5px}
  .hero h1 .sub{color:var(--accent)}
  .hero .date{font-size:15px;color:var(--text);font-weight:600}
  .hero .window{font-size:13px;color:var(--muted);margin-top:2px}
  .quotes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .quote{display:inline-flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 13px}
  .quote .qn{font-size:12.5px;color:var(--muted)}
  .quote .qp{font-size:15px;font-weight:800}
  .quote .qc{font-size:12.5px;font-weight:700}
  .quote.up .qp,.quote.up .qc{color:var(--up)}
  .quote.down .qp,.quote.down .qc{color:var(--down)}
  .quotes-note{font-size:11.5px;color:var(--muted);margin-top:7px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .stat .num{font-size:14px;font-weight:800;color:var(--accent)}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat.total .num{color:var(--accent2)}
  .stat.domestic .num{color:var(--domestic)}
  .stat.intl .num{color:var(--intl)}
  .block{margin:14px 0 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .block h2{font-size:14px;font-weight:800;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .block p{font-size:13.5px;color:#c9d1dc;margin-bottom:8px;text-align:justify}
  .block p:last-child{margin-bottom:0}
  .block .sub-h{font-size:12.5px;font-weight:800;color:var(--accent);margin:10px 0 3px}
  .block.emergency{background:linear-gradient(135deg,#33210f,#1d1710);border-color:var(--warn)}
  .block.emergency h2{color:var(--warn)}
  .block.emergency ol{list-style:none;counter-reset:ev}
  .block.emergency li{counter-increment:ev;display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}
  .block.emergency li:last-child{border-bottom:none}
  .block.emergency li::before{content:counter(ev);flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--warn);color:#1a1109;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .ev-t{font-size:13.5px;font-weight:700;text-align:justify}
  .ev-d{font-size:12.5px;color:#c9d1dc;text-align:justify}
  .ev-i{font-size:12px;color:var(--accent);text-align:justify}
  .block.strategy{background:linear-gradient(135deg,#12281f,#141a18);border-color:var(--accent2)}
  .risk{font-size:12px;color:#9aa4b2;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
  .market-divider{margin:32px 0 24px;padding:16px 20px;background:linear-gradient(90deg,rgba(91,158,255,.15),transparent);border-left:4px solid var(--domestic);border-radius:8px}
  .market-divider.intl{background:linear-gradient(90deg,rgba(255,140,66,.15),transparent);border-left-color:var(--intl)}
  .market-divider h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
  .market-divider h2 .badge{font-size:13px;background:var(--domestic);color:#fff;padding:4px 10px;border-radius:999px;font-weight:700}
  .market-divider.intl h2 .badge{background:var(--intl)}
  .mustread{background:linear-gradient(135deg,#33280f,#1d1a10);border:1px solid var(--accent);border-radius:12px;padding:16px 20px}
  .mustread h2{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .mustread ol{list-style:none;counter-reset:mr;margin:0;padding:0}
  .mustread li{counter-increment:mr;display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
  .mustread li:last-child{border-bottom:none}
  .mustread li::before{content:counter(mr);flex:0 0 auto;width:20px;height:20px;background:var(--accent);color:#1a1109;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .mustread .mr-t{flex:1;font-size:14px;font-weight:600;line-height:1.5;text-align:justify}
  .mustread .mr-t a:hover{color:var(--accent)}
  .mustread .mr-s{font-size:12px;color:var(--muted);white-space:nowrap}
  .blogger{border-left:3px solid var(--accent)}
  .blogger .bg-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .blogger .bg-nm{font-size:15px;font-weight:800}
  .blogger .bg-tone{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
  .blogger .bg-tone.up{color:var(--up);border-color:var(--up)}
  .blogger .bg-tone.down{color:var(--down);border-color:var(--down)}
  .blogger .bg-view{font-size:14px;line-height:1.75;text-align:justify}
  .blogger .bg-focus{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .blogger .bg-focus span{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--bg2);border:1px solid var(--border);color:var(--muted)}
  .blogger .bg-src{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .blogger .bg-src a{color:var(--muted)}
  .blogger .bg-src a:hover{color:var(--accent)}
  .blogger .bg-live{display:inline-block;font-size:10.5px;font-weight:700;color:#1a1109;background:var(--accent);border-radius:4px;padding:1px 5px;margin-right:5px}
  .bg-note{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic}
  .nav{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin-top:14px}
  .nav .wrap{display:flex;gap:10px;overflow-x:auto;padding:12px 18px;scrollbar-width:thin}
  .nav a{flex:0 0 auto;font-size:13.5px;color:var(--muted);border:1px solid var(--border);background:var(--bg2);padding:7px 13px;border-radius:999px;white-space:nowrap;transition:.15s}
  .nav a:hover{color:var(--text);border-color:var(--accent)}
  .nav a b{color:var(--accent);font-weight:700;margin-left:6px}
  .tabs{display:flex;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:24px}
  .tab{background:transparent;border:none;color:var(--muted);font-size:15px;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;transition:.2s;position:relative}
  .tab:hover{color:var(--text);background:var(--bg2)}
  .tab.active{color:var(--text);background:var(--card)}
  .tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent)}
  .tab .count{display:inline-block;margin-left:6px;padding:2px 8px;background:var(--chip);border-radius:12px;font-size:12px;font-weight:700}
  .tab.active .count{background:var(--accent);color:#0c1320}
  .sub-tabs{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}
  .sub-tab{background:var(--bg2);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;transition:.2s}
  .sub-tab:hover{color:var(--text);border-color:var(--accent)}
  .sub-tab.active{color:var(--text);background:var(--card);border-color:var(--accent)}
  .sub-tab .count{display:inline-block;margin-left:4px;font-size:11px;opacity:.7}
  .section.hidden{display:none}
  main{padding:28px 0 10px}
  .section{margin-bottom:38px;scroll-margin-top:64px}
  .section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;border-left:4px solid var(--accent);padding-left:12px}
  .section-head h2{font-size:21px;font-weight:750}
  .section-head .count{font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.18s}
  .card:hover{background:var(--card-hover);border-color:#4a4230;transform:translateY(-2px);box-shadow:0 10px 26px var(--shadow)}
  .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .card .idx{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c98f10);color:#1a1109;font-weight:800;font-size:15px;flex:0 0 auto}
  .chip{font-size:12px;color:var(--muted);background:var(--chip);border:1px solid var(--border);padding:4px 10px;border-radius:999px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card h3{font-size:16.5px;font-weight:700;line-height:1.45;margin-bottom:9px;text-align:justify}
  .card h3 a:hover{color:var(--accent)}
  .card .summary{font-size:14px;color:#c4ccd8;flex:1;margin-bottom:10px;text-align:justify}
  .card .original-text{font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-bottom:14px;text-align:justify}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkgroup{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .orig{font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--border);padding:6px 12px;border-radius:10px;background:var(--bg2);white-space:nowrap;transition:.15s}
  .orig:hover{background:var(--accent);color:#1a1109;border-color:var(--accent)}
  footer{border-top:1px solid var(--border);margin-top:18px;padding:26px 0 50px;color:var(--muted);font-size:13.5px}
  .note{font-size:12.5px;color:#6f7a8a;margin-top:10px}
  @media (max-width:560px){.hero{padding:22px 0 12px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="global-nav"><div class="wrap">
  <a href="index.html">AI 日报</a>
  <a href="finance.html" class="active">财经日报</a>
  <a href="monitor.html">推送监控</a>
</div></nav>
<header class="hero"><div class="wrap">
  <span class="kicker">● 财经日报 · 多来源聚合</span>
  <h1>财经日报 <span class="sub">晨报仪表盘</span></h1>
  <div class="date" id="heroDate">—</div>
  <div class="window" id="heroWindow">—</div>
  <div class="quotes" id="heroQuotes"></div>
  <div class="quotes-note" id="heroQuotesNote" hidden></div>
  <div class="stats" id="heroStats"></div>
  <div class="block strategy" id="strategyBlock" style="display:none">
    <h2>🎯 今日策略建议</h2>
    <div id="strategyBody"></div>
  </div>
</div></header>
<nav class="nav"><div class="wrap" id="navLinks"></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap">
  <div id="footerMeta">—</div>
  <div class="note">本站仅作信息聚合与自动化分析展示，资讯版权归原作者所有；分析与策略由程序自动生成，不构成投资建议。</div>
</div></footer>
<script>
const DATA = __DATA_PLACEHOLDER__;
function fmtBeijing(iso, opts){try{const dt=new Date(iso);const o=Object.assign({timeZone:'Asia/Shanghai',hour12:false},opts||{});return new Intl.DateTimeFormat('zh-CN',o).format(dt);}catch(e){return iso;}}
function truncate(s,n){const arr=Array.from(s||'');if(arr.length<=n)return s||'';return arr.slice(0,n-1).join('')+'…';}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){try{const p=new URL(u,location.href).protocol;return (p==='http:'||p==='https:')?u:'#';}catch(e){return '#';}}
(function render(){
  const meta=DATA.meta, domestic=DATA.domestic||{}, international=DATA.international||{};
  document.getElementById('heroDate').textContent=fmtBeijing(meta.date+'T00:00:00+08:00',{year:'numeric',month:'long',day:'numeric',weekday:'long'})+'（北京时间）';
  document.getElementById('heroWindow').textContent='收录窗口：'+fmtBeijing(meta.windowStart,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+' — '+fmtBeijing(meta.windowEnd,{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})+'（北京时间，过去 24 小时）';
  const quotes=DATA.quotes||[];
  document.getElementById('heroQuotes').innerHTML=quotes.map(q=>{
    const cls=q.pct>0?'up':(q.pct<0?'down':'');
    const sign=q.pct>0?'+':'';
    return '<span class="quote '+cls+'"><span class="qn">'+esc(q.name)+'</span><span class="qp">'+q.price+'</span><span class="qc">'+sign+q.pct.toFixed(2)+'%</span></span>';
  }).join('');
  // 未开盘时行情取的是上一交易日收盘，标注清楚，避免读者误以为是实时价
  const asOf=(quotes.find(q=>q.as_of)||{}).as_of;
  if(asOf){
    const note=document.getElementById('heroQuotesNote');
    note.textContent='指数为截至 '+asOf+' 收盘数据（推送时尚未开盘）';
    note.hidden=false;
  }
  let st='<div class="stat total"><div class="num">'+meta.total+'</div><div class="lbl">总条数</div></div>';
  st+='<div class="stat domestic"><div class="num">'+meta.domesticCount+'</div><div class="lbl">国内要闻</div></div>';
  st+='<div class="stat intl"><div class="num">'+meta.internationalCount+'</div><div class="lbl">国际要闻</div></div>';
  document.getElementById('heroStats').innerHTML=st;
  const sg=DATA.strategy||{};
  let sb='';
  // 节后首日：先放假期要闻回顾，再放今日策略——用户开盘前最先要知道休市期间发生了什么。
  if(sg.holidaySummary) sb+='<div class="sub-h">🏖 休市期间要闻回顾</div><p>'+esc(sg.holidaySummary)+'</p>';
  if(sg.aShare) sb+='<div class="sub-h">A 股</div><p>'+esc(sg.aShare)+'</p>';
  if(sg.hkShare) sb+='<div class="sub-h">港股</div><p>'+esc(sg.hkShare)+'</p>';
  if(sg.risk) sb+='<div class="risk">'+esc(sg.risk)+'</div>';
  if(sb){document.getElementById('strategyBlock').style.display='';document.getElementById('strategyBody').innerHTML=sb;}
  let nav='<a href="#domestic-section">国内要闻<b>'+meta.domesticCount+'</b></a><a href="#intl-section">国际要闻<b>'+meta.internationalCount+'</b></a>';
  const bloggerViews=DATA.bloggerViews||[];
  if(bloggerViews.length) nav+='<a href="#blogger-section">博主观点<b>'+bloggerViews.length+'</b></a>';
  const twitter = DATA.twitter || {};
  const twitterCount = (twitter.rumors||[]).length + (twitter.media||[]).length;
  if(twitterCount > 0) nav+='<a href="#twitter-section">Twitter观察<b>'+twitterCount+'</b></a>';
  document.getElementById('navLinks').innerHTML=nav;
  let main='';

  // Tab 导航（国内/国际分类切换）
  const totalCount = meta.total || 0;
  main+='<div class="tabs">';
  main+='<button class="tab active" data-filter="all">全部新闻<span class="count">'+totalCount+'</span></button>';
  main+='<button class="tab" data-filter="domestic">国内要闻<span class="count">'+meta.domesticCount+'</span></button>';
  main+='<button class="tab" data-filter="intl">国际要闻<span class="count">'+meta.internationalCount+'</span></button>';
  main+='</div>';

  // 追踪博主观点。刻意放在要闻之前、策略之后：这是个人判断不是事实，
  // 读者应该先看完客观信息再看别人怎么想；但它又比逐条快讯更浓缩，
  // 所以不埋到页面底部。每人独立成块，绝不合并成「市场共识」。
  if(bloggerViews.length){
    main+='<div class="market-divider" id="blogger-section"><h2>👤 追踪博主观点<span class="badge">'+bloggerViews.length+' 位</span></h2></div>';
    bloggerViews.forEach(b=>{
      const toneCls = b.tone==='偏积极' ? 'up' : (b.tone==='偏谨慎' ? 'down' : '');
      main+='<div class="block blogger">';
      main+='<div class="bg-hd"><span class="bg-nm">'+esc(b.name||'')+'</span>';
      if(b.tone) main+='<span class="bg-tone '+toneCls+'">'+esc(b.tone)+'</span>';
      main+='</div>';
      if(b.viewpoint){
        main+='<div class="bg-view">'+esc(b.viewpoint)+'</div>';
      }else{
        main+='<div class="bg-note">观点摘要生成失败，可点击下方原文自行查看。</div>';
      }
      const focus=b.focus||[];
      if(focus.length){
        main+='<div class="bg-focus">';
        focus.forEach(f=>{ main+='<span>'+esc(f)+'</span>'; });
        main+='</div>';
      }
      const arts=b.articles||[];
      if(arts.length){
        main+='<div class="bg-src">';
        arts.forEach(a=>{
          const u=safeUrl(a.url||'');
          const tag=a.isLive?'<span class="bg-live">直播</span>':'';
          const t=esc(a.title||'');
          main+='<div>'+tag+(u&&u!=='#'?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+t+'</a>':t)
              +' <span style="opacity:.7">'+esc(a.published||'')+'</span></div>';
        });
        main+='</div>';
      }
      main+='</div>';
    });
  }
  function renderMarket(marketData, marketId, marketLabel, badgeColor){
    const events=marketData.emergencyEvents||[];
    const an=marketData.analysis||{};
    const sections=marketData.sections||[];
    const mustRead=marketData.mustRead||[];
    if(!sections.length && !an.summary && !events.length) return '';
    let html='<div class="market-divider'+(marketId==='intl'?' intl':'')+'" id="'+marketId+'-section"><h2>'+marketLabel+'<span class="badge">'+sections.reduce((s,sec)=>s+sec.items.length,0)+' 条</span></h2></div>';

    // 二级tab导航（section切换）
    if(sections.length > 1){
      html+='<div class="sub-tabs" data-market="'+marketId+'">';
      html+='<button class="sub-tab active" data-section="all-'+marketId+'">全部<span class="count">'+sections.reduce((s,sec)=>s+sec.items.length,0)+'</span></button>';
      sections.forEach((s,i)=>{
        html+='<button class="sub-tab" data-section="'+marketId+'-sec-'+i+'">'+esc(s.label)+'<span class="count">'+s.items.length+'</span></button>';
      });
      html+='</div>';
    }

    // 核心必读：按重要性评分挑出的 5-10 条，置于该市场所有板块最前面。
    if(mustRead.length){
      html+='<div class="block mustread"><h2>⭐ 核心必读 · 最重要 '+mustRead.length+' 条</h2><ol>';
      mustRead.forEach(m=>{
        const u=safeUrl(m.original||'');
        const t=esc(m.title);
        html+='<li><div class="mr-t">'+(u&&u!=='#'?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+t+'</a>':t)+'</div>'
            +'<div class="mr-s">'+esc(m.source||'')+'</div></li>';
      });
      html+='</ol></div>';
    }
    if(events.length){
      html+='<div class="block emergency"><h2>🚨 突发事件</h2><ol>';
      events.forEach(e=>{
        html+='<li><div><div class="ev-t">'+esc(e.title)+'</div><div class="ev-d">'+esc(e.desc)+'</div>';

        // 影响分析展示
        if(e.impact) {
          const imp = e.impact;
          html+='<div class="ev-i" style="margin-top:8px;padding:8px;background:var(--bg2);border-radius:4px">';

          // 影响级别和方向
          if(imp.impact_level || imp.impact_direction) {
            html+='<div style="margin-bottom:4px">';
            if(imp.impact_level) {
              const levelColor = imp.impact_level==='重大'?'var(--warn)':(imp.impact_level==='中等'?'var(--accent)':'var(--muted)');
              html+='<span style="color:'+levelColor+';font-weight:600">'+esc(imp.impact_level)+'</span>';
            }
            if(imp.impact_direction) {
              const dirColor = imp.impact_direction==='利好'?'var(--up)':(imp.impact_direction==='利空'?'var(--down)':'var(--muted)');
              html+=' <span style="color:'+dirColor+';font-weight:600">'+esc(imp.impact_direction)+'</span>';
            }
            if(imp.duration) {
              html+=' <span style="color:var(--muted);font-size:12px">（'+esc(imp.duration)+'）</span>';
            }
            html+='</div>';
          }

          // 受益/受损行业
          if(imp.beneficiary_sectors && imp.beneficiary_sectors.length > 0) {
            html+='<div style="margin-top:6px;font-size:13px"><span style="color:var(--up)">▲ 受益：</span>'+imp.beneficiary_sectors.map(s=>esc(s)).join('、')+'</div>';
          }
          if(imp.damaged_sectors && imp.damaged_sectors.length > 0) {
            html+='<div style="margin-top:4px;font-size:13px"><span style="color:var(--down)">▼ 受损：</span>'+imp.damaged_sectors.map(s=>esc(s)).join('、')+'</div>';
          }

          // 操作建议
          if(imp.operation_advice) {
            html+='<div style="margin-top:6px;font-size:13px;color:var(--accent2)">💡 '+esc(imp.operation_advice)+'</div>';
          }

          // 风险提示
          if(imp.risk_warning) {
            html+='<div style="margin-top:6px;font-size:12px;color:var(--warn)">⚠️ '+esc(imp.risk_warning)+'</div>';
          }

          html+='</div>';
        } else if(e.impact) {
          // 兼容旧格式（纯文本）
          html+='<div class="ev-i">影响：'+esc(e.impact)+'</div>';
        }

        html+='</div></li>';
      });
      html+='</ol></div>';
    }
    if(an.summary){html+='<div class="block"><h2>📝 市场总结</h2><p>'+esc(an.summary)+'</p></div>';}
    if(an.macro||an.sector){
      html+='<div class="block"><h2>📈 市场分析</h2>';
      if(an.macro) html+='<div class="sub-h">宏观与资金面</div><p>'+esc(an.macro)+'</p>';
      if(an.sector) html+='<div class="sub-h">板块与行业</div><p>'+esc(an.sector)+'</p>';
      html+='</div>';
    }
    sections.forEach((s,i)=>{html+='<section class="section" id="'+marketId+'-sec-'+i+'"><div class="section-head"><h2>'+esc(s.label)+'</h2><span class="count">'+s.items.length+' 条</span></div><div class="grid">';
      s.items.forEach(it=>{const orig=safeUrl(it.original||'#');const tp=safeUrl(it.translatedPage||'');
        const hasTranslation = it.originalTitle && (it.originalTitle!==it.title||it.originalSummary!==it.summary);
        const hasFullTranslation = it.translated_content && it.translated_content.length > 0;
        const itemId = 'item-'+marketId+'-'+it.idx;

        html+='<article class="card"><div class="top"><span class="idx">'+it.idx+'</span><span class="chip" title="'+esc(it.source)+'">'+esc(it.source)+'</span></div>';
        html+='<h3><a href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></h3>';
        html+='<p class="summary">'+esc(truncate(it.summary,120))+'</p>';

        if(hasTranslation) {
          html+='<p class="original-text"><b>原文</b><br>'+esc(truncate(it.originalTitle,120))+'<br>'+esc(truncate(it.originalSummary,260))+' <a class="orig" href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a></p>';
        }

        // 翻译全文区域（可展开/折叠）
        if(hasFullTranslation) {
          html+='<div id="'+itemId+'-content" style="display:none;margin-top:12px;padding:12px;background:var(--bg2);border-radius:6px;max-height:400px;overflow-y:auto">';
          html+='<div style="color:var(--muted);font-size:12px;margin-bottom:8px">中文全文翻译</div>';
          html+='<div style="white-space:pre-wrap;line-height:1.8;font-size:14px">'+esc(it.translated_content)+'</div>';
          html+='</div>';
        }

        html+='<div class="foot"><span class="src">'+esc(it.source)+'</span>';
        html+='<span class="linkgroup">';

        // 翻译全文按钮（展开/折叠）
        if(hasFullTranslation) {
          html+='<a class="orig" href="javascript:void(0)" onclick="toggleTranslation(\''+itemId+'-content\',this)">查看中文全文 ↓</a>';
        } else if(tp&&tp!=='#') {
          html+='<a class="orig" href="'+esc(tp)+'" target="_blank" rel="noopener noreferrer">翻译全文 ↗</a>';
        }

        if(!hasTranslation) {
          html+='<a class="orig" href="'+esc(orig)+'" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>';
        }

        html+='</span></div></article>';
      });
      html+='</div></section>';});
    return html;
  }
  main+=renderMarket(domestic,'domestic','🇨🇳 国内要闻');
  main+=renderMarket(international,'intl','🌍 国际要闻');

  // Twitter 财经传言与媒体报道
  const twitter = DATA.twitter || {};
  const rumors = twitter.rumors || [];
  const media = twitter.media || [];
  const twitterAvailable = twitter.available !== false;

  if(rumors.length || media.length || !twitterAvailable) {
    main+='<div class="market-divider" id="twitter-section"><h2>🐦 Twitter 财经观察';
    if(rumors.length || media.length) main+='<span class="badge">'+(rumors.length + media.length)+' 条</span>';
    main+='</h2></div>';

    // 数据源不可用提示
    if(!twitterAvailable && !rumors.length && !media.length) {
      const errors = twitter.errors || {};
      const errorMsg = errors.rumors || errors.media || errors.general || 'RSSHub 服务暂不可用';
      main+='<div class="block"><div style="color:var(--muted);font-size:13px;padding:12px;background:var(--card);border-radius:8px">';
      main+='🔺 Twitter 数据源：'+esc(errorMsg)+'</div></div>';
    }

    // 小道消息板块
    if(rumors.length) {
      main+='<div class="block" style="border-left:3px solid var(--warn)"><h2>⚡ 市场传言</h2>';
      main+='<div style="font-size:12px;color:var(--muted);margin-bottom:12px">⚠️ <strong>未经证实</strong>，来自期权异动监测、做空机构爆料等渠道，仅作线索参考</div>';
      rumors.forEach((r,idx)=>{
        main+='<div style="padding:12px 0;border-bottom:1px dashed var(--border)">';
        if(idx===rumors.length-1) main=main.slice(0,-55); // 移除最后一个的border
        main+='<div style="font-size:14px;font-weight:700;margin-bottom:6px">'+esc(r.title||'')+'</div>';
        main+='<div style="font-size:13.5px;color:#c9d1dc;margin-bottom:8px;text-align:justify">'+esc(r.summary||'')+'</div>';
        if(r.impact) main+='<div style="font-size:12.5px;color:var(--accent);margin-bottom:6px">📊 '+esc(r.impact)+'</div>';
        main+='<div style="display:flex;justify-content:space-between;align-items:center">';
        main+='<span style="font-size:12px;color:var(--muted)">'+esc(r.source||'');
        if(r.verification) main+=' · <span style="color:var(--warn)">'+esc(r.verification === 'unverified' ? '未经证实' : r.verification)+'</span>';
        main+='</span>';
        if(r.link && r.link !== '#') main+='<a href="'+safeUrl(r.link)+'" target="_blank" style="font-size:12px;color:var(--accent);text-decoration:none">查看原文 →</a>';
        main+='</div></div>';
      });
      main+='</div>';
    }

    // 正规媒体板块
    if(media.length) {
      main+='<div class="block" style="border-left:3px solid var(--accent2)"><h2>📰 媒体速递</h2>';
      main+='<div style="font-size:12px;color:var(--muted);margin-bottom:12px">华尔街日报、彭博社、金融时报等权威媒体报道</div>';
      media.forEach((m,idx)=>{
        main+='<div style="padding:12px 0;border-bottom:1px dashed var(--border)">';
        if(idx===media.length-1) main=main.slice(0,-55); // 移除最后一个的border
        main+='<div style="font-size:14px;font-weight:700;margin-bottom:6px">'+esc(m.title||'')+'</div>';
        main+='<div style="font-size:13.5px;color:#c9d1dc;margin-bottom:8px;text-align:justify">'+esc(m.summary||'')+'</div>';
        if(m.impact) main+='<div style="font-size:12.5px;color:var(--accent2);margin-bottom:6px">📈 '+esc(m.impact)+'</div>';
        main+='<div style="display:flex;justify-content:space-between;align-items:center">';
        main+='<span style="font-size:12px;color:var(--muted)">'+esc(m.source||'')+'</span>';
        if(m.link && m.link !== '#') main+='<a href="'+safeUrl(m.link)+'" target="_blank" style="font-size:12px;color:var(--accent2);text-decoration:none">查看原文 →</a>';
        main+='</div></div>';
      });
      main+='</div>';
    }
  }

  // 资金流向板块
  const moneyFlow = DATA.moneyFlow || {};
  const north = moneyFlow.north_flow || {};
  const showNorth = north.available && north.total_flow !== undefined;
  const hasNorthStatus = !showNorth && (north.reason || north.error || north.collection_mode === 'post_close');
  const hasSector = moneyFlow.sector_flow && ((moneyFlow.sector_flow.top_inflow||[]).length
                    || (moneyFlow.sector_flow.top_outflow||[]).length);
  const hasStock = moneyFlow.stock_flow && ((moneyFlow.stock_flow.top_inflow||[]).length
                   || (moneyFlow.stock_flow.top_outflow||[]).length);
  if(showNorth || hasNorthStatus || hasSector || hasStock) {
    main+='<div class="market-divider" id="money-flow-section"><h2>💰 资金流向</h2></div>';

    // 北向资金
    if(showNorth) {
      const nf = moneyFlow.north_flow;
      const totalCls = nf.total_flow > 0 ? 'up' : (nf.total_flow < 0 ? 'down' : '');
      const shCls = nf.sh_flow > 0 ? 'up' : (nf.sh_flow < 0 ? 'down' : '');
      const szCls = nf.sz_flow > 0 ? 'up' : (nf.sz_flow < 0 ? 'down' : '');
      main+='<div class="block"><h2>🔺 北向资金</h2>';
      main+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px">';
      main+='<div style="background:var(--card);padding:15px;border-radius:8px;text-align:center">';
      main+='<div style="color:var(--muted);font-size:13px;margin-bottom:6px">沪股通</div>';
      main+='<div class="'+shCls+'" style="font-size:20px;font-weight:600">'+(nf.sh_flow>0?'+':'')+nf.sh_flow.toFixed(2)+' 亿</div>';
      main+='</div>';
      main+='<div style="background:var(--card);padding:15px;border-radius:8px;text-align:center">';
      main+='<div style="color:var(--muted);font-size:13px;margin-bottom:6px">深股通</div>';
      main+='<div class="'+szCls+'" style="font-size:20px;font-weight:600">'+(nf.sz_flow>0?'+':'')+nf.sz_flow.toFixed(2)+' 亿</div>';
      main+='</div>';
      main+='<div style="background:var(--card);padding:15px;border-radius:8px;text-align:center">';
      main+='<div style="color:var(--muted);font-size:13px;margin-bottom:6px">合计</div>';
      main+='<div class="'+totalCls+'" style="font-size:20px;font-weight:600">'+(nf.total_flow>0?'+':'')+nf.total_flow.toFixed(2)+' 亿</div>';
      main+='</div>';
      main+='</div></div>';
    }
    // 北向不可用时渲染说明行，避免读者误以为抓取失败
    else if(moneyFlow.north_flow && !moneyFlow.north_flow.available && (moneyFlow.north_flow.reason || moneyFlow.north_flow.error)) {
      main+='<div class="block"><div style="color:var(--muted);font-size:13px;padding:12px;background:var(--card);border-radius:8px">';
      main+='🔵 盘后北向资金：'+esc(moneyFlow.north_flow.reason || moneyFlow.north_flow.error)+'</div></div>';
    }

    // 行业资金流向
    if(moneyFlow.sector_flow && (moneyFlow.sector_flow.top_inflow || moneyFlow.sector_flow.top_outflow)) {
      const sf = moneyFlow.sector_flow;
      main+='<div class="block"><h2>🏭 行业资金流向</h2>';
      if(sf.top_inflow && sf.top_inflow.length > 0) {
        main+='<div class="sub-h">资金净流入 Top 5</div>';
        main+='<div style="margin:10px 0"><table style="width:100%;border-collapse:collapse">';
        main+='<thead><tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:13px"><th style="text-align:left;padding:8px">行业</th><th style="text-align:right;padding:8px">净流入</th><th style="text-align:right;padding:8px">涨跌幅</th></tr></thead><tbody>';
        sf.top_inflow.forEach(item=>{
          const flowCls = item.net_inflow > 0 ? 'up' : 'down';
          const pctCls = item.change_pct > 0 ? 'up' : (item.change_pct < 0 ? 'down' : '');
          main+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px">'+esc(item.name)+'</td>';
          main+='<td class="'+flowCls+'" style="text-align:right;padding:10px;font-weight:600">'+(item.net_inflow>0?'+':'')+item.net_inflow.toFixed(2)+' 亿</td>';
          main+='<td class="'+pctCls+'" style="text-align:right;padding:10px">'+(item.change_pct>0?'+':'')+item.change_pct.toFixed(2)+'%</td></tr>';
        });
        main+='</tbody></table></div>';
      }
      if(sf.top_outflow && sf.top_outflow.length > 0) {
        main+='<div class="sub-h" style="margin-top:16px">资金净流出 Top 5</div>';
        main+='<div style="margin:10px 0"><table style="width:100%;border-collapse:collapse">';
        main+='<thead><tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:13px"><th style="text-align:left;padding:8px">行业</th><th style="text-align:right;padding:8px">净流入</th><th style="text-align:right;padding:8px">涨跌幅</th></tr></thead><tbody>';
        sf.top_outflow.forEach(item=>{
          const flowCls = item.net_inflow > 0 ? 'up' : 'down';
          const pctCls = item.change_pct > 0 ? 'up' : (item.change_pct < 0 ? 'down' : '');
          main+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px">'+esc(item.name)+'</td>';
          main+='<td class="'+flowCls+'" style="text-align:right;padding:10px;font-weight:600">'+(item.net_inflow>0?'+':'')+item.net_inflow.toFixed(2)+' 亿</td>';
          main+='<td class="'+pctCls+'" style="text-align:right;padding:10px">'+(item.change_pct>0?'+':'')+item.change_pct.toFixed(2)+'%</td></tr>';
        });
        main+='</tbody></table></div>';
      }
      main+='</div>';
    }

    // 个股资金流向
    if(moneyFlow.stock_flow && (moneyFlow.stock_flow.top_inflow || moneyFlow.stock_flow.top_outflow)) {
      const stf = moneyFlow.stock_flow;
      main+='<div class="block"><h2>📊 个股资金流向</h2>';
      if(stf.top_inflow && stf.top_inflow.length > 0) {
        main+='<div class="sub-h">主力净流入 Top 10</div>';
        main+='<div style="margin:10px 0"><table style="width:100%;border-collapse:collapse">';
        main+='<thead><tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:13px"><th style="text-align:left;padding:8px">股票</th><th style="text-align:center;padding:8px">代码</th><th style="text-align:right;padding:8px">净流入</th><th style="text-align:right;padding:8px">涨跌幅</th></tr></thead><tbody>';
        stf.top_inflow.forEach(item=>{
          const flowCls = item.net_inflow > 0 ? 'up' : 'down';
          const pctCls = item.change_pct > 0 ? 'up' : (item.change_pct < 0 ? 'down' : '');
          main+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:10px">'+esc(item.name)+'</td>';
          main+='<td style="text-align:center;padding:10px;color:var(--muted);font-size:12px">'+esc(item.code)+'</td>';
          main+='<td class="'+flowCls+'" style="text-align:right;padding:10px;font-weight:600">'+(item.net_inflow>0?'+':'')+item.net_inflow.toFixed(2)+' 亿</td>';
          main+='<td class="'+pctCls+'" style="text-align:right;padding:10px">'+(item.change_pct>0?'+':'')+item.change_pct.toFixed(2)+'%</td></tr>';
        });
        main+='</tbody></table></div>';
      }
      main+='</div>';
    }
  }

  document.getElementById('main').innerHTML=main;
  const sources='格隆汇、同花顺、金十数据、第一财经、财新网、Seeking Alpha、Bloomberg、CNBC';
  document.getElementById('footerMeta').innerHTML='本期共 <b style="color:var(--accent2)">'+meta.total+'</b> 条 · 数据来源：'+sources+' · 行情：腾讯财经';

  // Tab 切换功能
  const tabs = document.querySelectorAll('.tab');
  const sections = document.querySelectorAll('.section');
  tabs.forEach(tab => {
    tab.addEventListener('click', function(){
      const filter = this.getAttribute('data-filter');

      // 更新 tab 状态
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');

      // 过滤显示对应的 section
      sections.forEach(section => {
        const sectionId = section.getAttribute('id');
        if(filter === 'all'){
          section.classList.remove('hidden');
        }else if(filter === 'domestic' && sectionId && sectionId.startsWith('domestic-')){
          section.classList.remove('hidden');
        }else if(filter === 'intl' && sectionId && sectionId.startsWith('intl-')){
          section.classList.remove('hidden');
        }else{
          section.classList.add('hidden');
        }
      });

      // 平滑滚动到第一个可见的新闻区域
      const firstVisible = document.querySelector('.section:not(.hidden)');
      if(firstVisible){
        firstVisible.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
    });
  });

  // 二级tab切换功能（section级别）
  const subTabsContainers = document.querySelectorAll('.sub-tabs');
  subTabsContainers.forEach(container => {
    const marketId = container.getAttribute('data-market');
    const subTabs = container.querySelectorAll('.sub-tab');

    subTabs.forEach(subTab => {
      subTab.addEventListener('click', function(){
        const sectionFilter = this.getAttribute('data-section');

        // 更新当前market的sub-tab状态
        subTabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');

        // 过滤显示对应market下的sections
        const marketSections = document.querySelectorAll('.section[id^="'+marketId+'-sec-"]');
        marketSections.forEach(section => {
          if(sectionFilter === 'all-'+marketId){
            // 显示该market的所有sections
            section.classList.remove('hidden');
          }else if(section.getAttribute('id') === sectionFilter){
            // 显示特定section
            section.classList.remove('hidden');
          }else{
            // 隐藏其他sections
            section.classList.add('hidden');
          }
        });

        // 平滑滚动到第一个可见的section
        const firstVisibleSection = document.querySelector('.section[id^="'+marketId+'-sec-"]:not(.hidden)');
        if(firstVisibleSection){
          firstVisibleSection.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      });
    });
  });
})();

// 展开/折叠翻译全文
function toggleTranslation(contentId, linkElement) {
  const content = document.getElementById(contentId);
  if (content) {
    if (content.style.display === 'none') {
      content.style.display = 'block';
      linkElement.textContent = '收起中文全文 ↑';
    } else {
      content.style.display = 'none';
      linkElement.textContent = '查看中文全文 ↓';
    }
  }
}
</script>
</body></html>
