name: 每日推送：AI 日报 + 财经日报（企业微信 + GitHub Pages）

on:
  schedule:
    - cron: '0 0 * * *'        # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:           # 允许在 Actions 页面手动触发测试

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 清除 Python 缓存
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true

      - name: 第一条：AI 日报（图文卡片 + AI 日报网页）
        env:
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: python ai_daily_push.py

      # 第二条独立于第一条：财经日报失败（数据源/LLM 异常）不应该让已经成功的
      # AI 日报连带标红，所以用 continue-on-error 兜住。
      - name: 第二条：财经日报（markdown + 财经网页）
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FINANCE_DASHBOARD_URL: ${{ secrets.FINANCE_DASHBOARD_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: python finance_daily_push.py

      - name: 准备 Pages 静态产物（两个独立页面）
        run: |
          mkdir -p public
          cp ai_daily_dashboard.html public/index.html
          # 财经日报若失败则不会产出 html，此时只发布 AI 日报页面，不让整个部署失败
          if [ -f finance_dashboard.html ]; then
            cp finance_dashboard.html public/finance.html
          else
            echo "finance_dashboard.html 不存在，跳过财经页面发布"
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
