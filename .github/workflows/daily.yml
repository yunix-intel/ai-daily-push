name: 每日推送：AI 日报 + 财经日报（企业微信 + GitHub Pages）

on:
  schedule:
    # UTC 23:00 = 北京时间 07:00（次日）；GitHub cron 为尽力调度，不保证准点启动
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-push-${{ github.ref }}
  cancel-in-progress: true

env:
  CRON_HOUR: "23"
  CRON_MINUTE: "0"
  DEEPSEEK_MAX_CONCURRENCY: "4"
  ANALYSIS_MAX_CONCURRENCY: "8"
  LLM_MAX_RETRIES: "0"
  LLM_TIMEOUT: "300"
  RSSHUB_TIMEOUT: "5"
  RSSHUB_MAX_MIRRORS: "2"
  PYTHONUNBUFFERED: "1"
  TRANSLATION_ENABLED: "1"
  FULL_TEXT_TRANSLATION_ENABLED: "0"

jobs:
  ai-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装 Python 依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 恢复市场数据历史快照
        uses: actions/cache@v5
        with:
          path: data/market_data
          key: ai-market-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-market-data-${{ github.ref_name }}-
            ai-market-data-
      - name: 恢复 AI 翻译缓存
        uses: actions/cache@v5
        with:
          path: translations
          key: ai-translations-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-translations-${{ github.ref_name }}-
            ai-translations-
      - name: AI 日报
        env:
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WECOM_WEBHOOK: ${{ secrets.AI_WECOM_WEBHOOK || secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.AI_FEISHU_WEBHOOK || secrets.FEISHU_WEBHOOK }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL_TRANSLATE: ${{ secrets.OPENAI_MODEL_TRANSLATE }}
          OPENAI_MODEL_ANALYSIS: ${{ secrets.OPENAI_MODEL_ANALYSIS }}
          DELIVERY_STATUS_FILE: ai_delivery_status.json
        run: python -u ai_daily_push.py
      - name: 上传 AI 页面和状态
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-daily-output
          path: |
            ai_daily_dashboard.html
            ai_push_standalone.html
            ai_delivery_status.json
            translations
          if-no-files-found: warn

  finance-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 安装 Python 依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 恢复财经翻译缓存
        uses: actions/cache@v5
        with:
          path: translations
          key: finance-translations-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            finance-translations-${{ github.ref_name }}-
            finance-translations-
      # 行业/个股昨日终值回退依赖此缓存。保鲜缺口（见 CHANGELOG [4.3.0]）：
      # 07:00 任务在盘前、自身填不满缓存；靠 actions/cache 滚动沿用最近一次
      # 盘中/盘后成功快照，仓库内种子仅作冷启动兜底（严格同日期才命中）。
      - name: 恢复资金榜终值快照
        uses: actions/cache@v5
        with:
          path: data/market_data
          key: finance-market-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            finance-market-data-${{ github.ref_name }}-
            finance-market-data-
      - name: 财经日报
        env:
          WECOM_WEBHOOK: ${{ secrets.FINANCE_WECOM_WEBHOOK || secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FINANCE_FEISHU_WEBHOOK || secrets.FEISHU_WEBHOOK }}
          FINANCE_DASHBOARD_URL: ${{ secrets.FINANCE_DASHBOARD_URL }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # 财经独占模型（与 AI 日报隔离，避免并发争抢同一模型触发网关熔断）：
          # 分析 deepseek-v4.1-flash / 翻译 qwen3.8-27b。Secret 未建时回退到共用模型。
          OPENAI_MODEL_TRANSLATE: ${{ secrets.OPENAI_MODEL_TRANSLATE_FINANCE || secrets.OPENAI_MODEL_TRANSLATE }}
          OPENAI_MODEL_ANALYSIS: ${{ secrets.OPENAI_MODEL_ANALYSIS_FINANCE || secrets.OPENAI_MODEL_ANALYSIS }}
          # 网关部分模型要求带 x-opencode-session 头，否则路由层 400（MissingSessionID）
          X_OPENCODE_SESSION: ${{ secrets.X_OPENCODE_SESSION }}
          DELIVERY_STATUS_FILE: finance_delivery_status.json
        run: python -u finance_daily_push.py
      - name: 上传财经页面和状态
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finance-daily-output
          path: |
            finance_dashboard.html
            finance_push_standalone.html
            finance_delivery_status.json
          if-no-files-found: warn

  publish:
    # 两份日报都成功生成后才允许更新正式 Pages，避免失败运行发布旧产物。
    if: needs['ai-daily'].result == 'success' && needs['finance-daily'].result == 'success'
    needs: [ai-daily, finance-daily]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 下载 AI 页面
        uses: actions/download-artifact@v8
        with:
          name: ai-daily-output
          path: ai-output
      - name: 下载财经页面
        uses: actions/download-artifact@v8
        with:
          name: finance-daily-output
          path: finance-output
      - name: 记录日报运行状态
        run: |
          echo "AI job result: ${{ needs['ai-daily'].result }}"
          echo "Finance job result: ${{ needs['finance-daily'].result }}"
          if [ "${{ needs['ai-daily'].result }}" != "success" ]; then echo "::warning::AI 日报 job 未成功"; fi
          if [ "${{ needs['finance-daily'].result }}" != "success" ]; then echo "::warning::财经日报 job 未成功"; fi
      - name: 读取当前运行里程碑
        id: milestones
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            // GitHub exposes runner start on the run; event creation is not
            // available as a trustworthy timestamp in this job context.
            core.setOutput('runner_started_at', run.data.run_started_at || '');
      - name: 记录推送时间
        env:
          EVENT_CREATED_AT: ""
          RUNNER_STARTED_AT: ${{ steps.milestones.outputs.runner_started_at }}
        run: |
          python push_history_recorder.py \
            --expected-time "23:00" \
            --task "AI + Finance Daily Push" \
            --delivery-status ai-output/ai_delivery_status.json \
            --delivery-status finance-output/finance_delivery_status.json \
            --event-created-at "$EVENT_CREATED_AT" \
            --runner-started-at "$RUNNER_STARTED_AT"
      - name: 提交推送历史
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add push_history.json push_history_report.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "推送历史无变化，跳过提交"
            exit 0
          fi
          git commit -m "📊 Update push history [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "推送历史已提交"
              exit 0
            fi
            echo "第 $i 次推送被拒，rebase 后重试"
            git pull --rebase origin "${GITHUB_REF_NAME}" || break
            sleep 5
          done
          echo "::warning::推送历史提交失败；不影响本次页面发布"
      - name: 生成监控页面
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u github_monitor.py \
            --repo "${{ github.repository }}" \
            --workflow "每日推送：AI 日报 + 财经日报（企业微信 + GitHub Pages）" \
            --report monitor.html
      - name: 准备 Pages 静态产物
        run: |
          mkdir -p public
          if [ -f ai-output/ai_daily_dashboard.html ]; then
            cp ai-output/ai_daily_dashboard.html public/index.html
          else
            echo "::warning::AI 页面缺失"
          fi
          if [ -f finance-output/finance_dashboard.html ]; then
            cp finance-output/finance_dashboard.html public/finance.html
          else
            echo "::warning::财经页面缺失"
          fi
          # 推送专用无导航落地页（企业微信卡片外链目标，不在站内导航里挂入口）
          if [ -f ai-output/ai_push_standalone.html ]; then
            cp ai-output/ai_push_standalone.html public/ai_push_standalone.html
          else
            echo "::warning::AI 推送落地页缺失"
          fi
          if [ -f finance-output/finance_push_standalone.html ]; then
            cp finance-output/finance_push_standalone.html public/finance_push_standalone.html
          else
            echo "::warning::财经推送落地页缺失"
          fi
          if [ -f push_history_report.html ]; then cp push_history_report.html public/push_history.html; fi
          if [ -f monitor.html ]; then cp monitor.html public/monitor.html; fi
          test -f public/index.html || { echo "::error::没有可发布的 AI 页面"; exit 1; }
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: needs.publish.result == 'success'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
