name: 每日推送：AI 日报 + 财经日报（企业微信 + GitHub Pages）

on:
  schedule:
    # UTC 23:00 = 北京时间 07:00（次日）
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-push-${{ github.ref }}
  cancel-in-progress: true

env:
  CRON_HOUR: "23"
  CRON_MINUTE: "0"
  LLM_MAX_CONCURRENCY: "2"
  RSSHUB_TIMEOUT: "10"

jobs:
  ai-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 恢复市场数据历史快照
        uses: actions/cache@v5
        with:
          path: data/market_data
          key: ai-market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: 恢复全文翻译缓存
        uses: actions/cache@v5
        with:
          path: translations
          key: ai-translations-${{ github.run_id }}
          restore-keys: translations-
      - name: AI 日报
        env:
          WECOM_CORPID: ${{ secrets.WECOM_CORPID }}
          WECOM_CORPSECRET: ${{ secrets.WECOM_CORPSECRET }}
          WECOM_AGENTID: ${{ secrets.WECOM_AGENTID }}
          WECOM_TOUSER: ${{ secrets.WECOM_TOUSER }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL_TRANSLATE: ${{ secrets.OPENAI_MODEL_TRANSLATE || 'deepseek-v4-flash' }}
          OPENAI_MODEL_ANALYSIS: ${{ secrets.OPENAI_MODEL_ANALYSIS || 'gpt-5.6-sol' }}
        run: python ai_daily_push.py
      - name: 上传 AI 页面和状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-output
          path: |
            ai_daily_dashboard.html
            translations
          if-no-files-found: warn

  finance-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: 恢复全文翻译缓存
        uses: actions/cache@v5
        with:
          path: translations
          key: finance-translations-${{ github.run_id }}
          restore-keys: translations-
      - name: 财经日报
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FINANCE_DASHBOARD_URL: ${{ secrets.FINANCE_DASHBOARD_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL_TRANSLATE: ${{ secrets.OPENAI_MODEL_TRANSLATE || 'deepseek-v4-flash' }}
          OPENAI_MODEL_ANALYSIS: ${{ secrets.OPENAI_MODEL_ANALYSIS || 'gpt-5.6-sol' }}
        run: python finance_daily_push.py
      - name: 上传财经页面和状态
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-daily-output
          path: finance_dashboard.html
          if-no-files-found: warn

  publish:
    if: always()
    needs: [ai-daily, finance-daily]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 下载 AI 页面
        uses: actions/download-artifact@v4
        with:
          name: ai-daily-output
          path: ai-output
        continue-on-error: true
      - name: 下载财经页面
        uses: actions/download-artifact@v4
        with:
          name: finance-daily-output
          path: finance-output
        continue-on-error: true
      - name: 记录日报运行状态
        run: |
          echo "AI job result: ${{ needs.ai-daily.result }}"
          echo "Finance job result: ${{ needs.finance-daily.result }}"
          if [ "${{ needs.ai-daily.result }}" != "success" ]; then echo "::warning::AI 日报 job 未成功"; fi
          if [ "${{ needs.finance-daily.result }}" != "success" ]; then echo "::warning::财经日报 job 未成功"; fi
      - name: 记录推送时间
        if: always()
        run: python push_history_recorder.py --expected-time "23:00" --task "AI Daily Push"
      - name: 提交推送历史
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add push_history.json push_history_report.html
          if git diff --quiet && git diff --staged --quiet; then
            echo "推送历史无变化，跳过提交"
            exit 0
          fi
          git commit -m "📊 Update push history [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "推送历史已提交"
              exit 0
            fi
            echo "第 $i 次推送被拒，rebase 后重试"
            git pull --rebase origin "${GITHUB_REF_NAME}" || break
            sleep 5
          done
          echo "::warning::推送历史提交失败；不影响本次页面发布"
      - name: 准备 Pages 静态产物
        run: |
          mkdir -p public
          if [ -f ai-output/ai_daily_dashboard.html ]; then
            cp ai-output/ai_daily_dashboard.html public/index.html
          else
            echo "::warning::AI 页面缺失"
          fi
          if [ -f finance-output/finance_dashboard.html ]; then
            cp finance-output/finance_dashboard.html public/finance.html
          else
            echo "::warning::财经页面缺失"
          fi
          if [ -f push_history_report.html ]; then cp push_history_report.html public/push_history.html; fi
          test -f public/index.html || { echo "::error::没有可发布的 AI 页面"; exit 1; }
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: always() && needs.publish.result == 'success'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
