name: Monitor Push Status

# 监测主推送任务是否按时运行
# 每天 06:45 北京时间（UTC 22:45）运行，检查 05:30 任务是否已开始
# 如果主任务延迟超过 15 分钟，发送告警

on:
  schedule:
    # 每天 06:45 北京时间（UTC 22:45 前一日）
    - cron: '45 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Check main workflow status
        id: check-main
        run: |
          python github_monitor.py \
            --repo "${{ github.repository }}" \
            --workflow "每日推送：AI 日报 + 财经日报（企业微信 + GitHub Pages）" \
            --check-delay \
            --threshold 900
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_WECOM_WEBHOOK: ${{ secrets.ALERT_WECOM_WEBHOOK }}
          ALERT_DINGTALK_WEBHOOK: ${{ secrets.ALERT_DINGTALK_WEBHOOK }}
          ALERT_FEISHU_WEBHOOK: ${{ secrets.ALERT_FEISHU_WEBHOOK }}

      - name: Monitor result
        if: always()
        run: |
          status="${{ steps.check-main.outcome }}"
          if [ "$status" = "success" ]; then
            echo "主任务运行正常"
          else
            echo "主任务检查失败或存在延迟"
            exit 1
          fi
